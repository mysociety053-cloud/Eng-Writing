      <h3 style="margin:0 0 4px">👂 ${esc(a.title)}</h3>
      <p class="muted" style="margin:0 0 6px">${tag||''} · 표현 ${a.items.length}개 ·
        ${b.n}×${b.n} · ${b.target}빙고 · ${b.iv? b.iv+'초 자동':'수동 진행'}</p>
      ${emo? `<div style="font-size:1.5rem; letter-spacing:2px">${emo}${a.items.length>10?' …':''}</div>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-a]').forEach(c=> c.onclick=()=> bingoStartFromAssignment(c.dataset.a));
}
/* 과제에 저장된 설정 그대로 게임을 연다 — 학급마다 다시 설정할 필요가 없다 */
async function bingoStartFromAssignment(aid){
  const a=DB.assignments.find(x=>x.id===aid); if(!a) return;
  const cls=DB.classes.find(x=>x.id===a.classId);
  const b=a.bingo||{n:5,target:3,iv:14};
  const items=a.items.map(i=>({ t:i.text, m:i.meaning||'', e:(i.emoji==='-'?'':(i.emoji||'')) }));
  const sess={ id:'bg'+uid(), classId:a.classId, className:cls?cls.name:'', listId:a.listId, asgId:a.id,
    title:a.title, n:b.n, target:b.target, iv:b.iv, items, calls:[], at:Date.now(),
    status:'ready', updatedAt:Date.now() };
  const ok=await sSet(bingoKey(a.classId), sess);
  if(!ok) return;
  bingoRun(sess);
}
/* ---------- 이모지 고르기 창 ---------- */
/* 추천 후보만 돌리면 원하는 그림이 없을 때 막힌다. 사전 전체에서 찾아 고를 수 있게 한다. */
/* opts = { text, meaning, cands, cur, onPick(이모지) } — 어느 화면에서든 쓸 수 있게 값만 주고받는다 */
let emoPick=null;
function emojiPickOpen(opts){
  emoPick=Object.assign({ q:'', cat:'', cands:[], cur:'', meaning:'' }, opts);
  emojiPickDraw();
  $('emoPick').classList.add('show');
  setTimeout(()=>{ const s=$('emoQ'); if(s) s.focus(); }, 60);
}
function emojiPickClose(){ $('emoPick').classList.remove('show'); emoPick=null; }
function emojiPickSet(e){
  const cb=emoPick && emoPick.onPick;
  emojiPickClose();
  if(cb) cb(e);
}
function emojiPickDraw(){
  const it={ t:emoPick.text, m:emoPick.meaning, e:emoPick.cur, cands:emoPick.cands };
  const q=emoPick.q.trim().toLowerCase();
  const hit=(d)=> !q || d[2].includes(q) || d[1].split('|').some(k=>k.includes(q));
  let secs;
  if(q){
    const rows=BINGO_EMO.filter(hit);
    secs = rows.length
      ? `<div class="sec">'${esc(emoPick.q)}' 검색 결과 ${rows.length}개</div>
         <div class="grid">${rows.map(d=>emojiPickCell(d,it.e)).join('')}</div>`
      : `<div class="empty"><span class="em">🔍</span>찾는 그림이 없어요.<br>
           <span class="muted">한글(예: 실험)이나 영어(예: science)로 찾아보세요.<br>
           그래도 없으면 창을 닫고 칸에 이모지를 직접 붙여넣으면 됩니다.</span></div>`;
  } else {
    const rec=it.cands||[];
    const cats=BINGO_EMO_CATS.filter(([c])=> !emoPick.cat || c===emoPick.cat);
    secs = (rec.length && !emoPick.cat
        ? `<div class="sec">✨ 이 표현에 어울리는 그림</div>
           <div class="grid">${rec.map(e=>emojiPickCell(BINGO_EMO.find(d=>d[0]===e)||[e,'',''], it.e)).join('')}</div>`
        : '')
      + cats.map(([c,list])=>`<div class="sec">${c}</div>
           <div class="grid">${list.map(d=>emojiPickCell(d,it.e)).join('')}</div>`).join('');
  }
  $('emoBox').innerHTML=`
    <div class="hd">
      <div class="q">${esc(it.t)}</div>
      ${it.m?`<div class="muted" style="margin-bottom:8px">${esc(it.m)}</div>`:'<div style="height:8px"></div>'}
      <input type="text" id="emoQ" placeholder="🔎 한글·영어로 찾기 (예: 실험, science)" value="${esc(emoPick.q)}">
    </div>
    <div class="cats">
      <span class="chip ${emoPick.cat?'':'on'}" data-cat="">전체</span>
      ${BINGO_EMO_CATS.map(([c])=>`<span class="chip ${emoPick.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</span>`).join('')}
    </div>
    <div class="body">${secs}</div>
    <div class="ft">
      <button class="btn ghost sm" id="emoNone">글자로 표시</button>
      <div style="flex:1"></div>
      <button class="btn sm" id="emoClose">닫기</button>
    </div>`;
  const qi=$('emoQ');
  qi.oninput=()=>{ emoPick.q=qi.value; const at=qi.selectionStart; emojiPickDraw();
    const n=$('emoQ'); if(n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(e){} } };
  $('emoBox').querySelectorAll('[data-cat]').forEach(c=> c.onclick=()=>{ emoPick.cat=c.dataset.cat; emoPick.q=''; emojiPickDraw(); });
  $('emoBox').querySelectorAll('[data-pick]').forEach(b=> b.onclick=()=> emojiPickSet(b.dataset.pick));
  $('emoNone').onclick=()=> emojiPickSet('');
  $('emoClose').onclick=emojiPickClose;
}
function emojiPickCell(d, cur){
  return `<button data-pick="${esc(d[0])}" class="${d[0]===cur?'on':''}" title="${esc(d[2]||'')}">${d[0]}</button>`;
}
$('emoPick').onclick=(e)=>{ if(e.target.id==='emoPick') emojiPickClose(); };   /* 바깥을 누르면 닫기 */

/* ---------- 그림 고르기 한 줄 (과제 만들기의 빙고 설정에서 씀) ----------
   보관함 항목의 emoji 값을 그대로 다룬다: '' = 아직 안 정함, '-' = 일부러 글자로, 그 외 = 이모지 */
function emojiRowsHTML(items){
  return items.map((i,k)=>{
    const cur=i.emoji==='-'? '' : (i.emoji||'');
    return `<div class="item-row">
      <input class="bg-emo" data-emoin="${k}" value="${esc(cur)}" placeholder="글자" maxlength="8"
        title="이모지를 직접 넣거나 붙여넣기 (비우면 한글 뜻이 글자로 나와요)" aria-label="${esc(i.text)} 그림">
      <button class="bg-emo-cyc" data-emocyc="${k}" title="추천 그림으로 바꾸기">🔄</button>
      <button class="bg-emo-cyc" data-emopick="${k}" title="그림 목록에서 고르기">🔎</button>
      <span class="txt">${esc(i.text)}${i.meaning?`<span class="muted" style="font-size:.85rem"> — ${esc(i.meaning)}</span>`:''}</span>
    </div>`;
  }).join('');
}
function emojiRowsBind(root, items, redraw){
  root.querySelectorAll('[data-emoin]').forEach(inp=> inp.oninput=()=>{
    const v=inp.value.trim(); items[+inp.dataset.emoin].emoji = v || '-';   /* 다시 그리지 않는다(커서 유지) */
  });
  root.querySelectorAll('[data-emocyc]').forEach(b=> b.onclick=()=>{
    const i=items[+b.dataset.emocyc], cands=bingoSuggest(i.text,4);
    if(!cands.length){ i.emoji='-'; return redraw(); }
    const cur=i.emoji==='-'? '' : (i.emoji||'');
    const at=cands.indexOf(cur);
    i.emoji = at<0 ? cands[0] : (at+1>=cands.length ? '-' : cands[at+1]);
    redraw();
  });
  root.querySelectorAll('[data-emopick]').forEach(b=> b.onclick=()=>{
    const k=+b.dataset.emopick, i=items[k];
    emojiPickOpen({ text:i.text, meaning:i.meaning||'', cands:bingoSuggest(i.text,4),
      cur:(i.emoji==='-'?'':(i.emoji||'')),
      onPick:(e)=>{ i.emoji = e || '-'; redraw(); } });
  });
}
/* ---------- 선생님: 진행 ---------- */
function bingoRun(sess){
  bingoLeave();
  if(sess.iv==null) sess.iv=0;                       /* 자동 진행이 없던 예전 게임은 수동으로 */
  BG={ role:'teacher', sess, players:[], unsubs:[], repeatT:0,
       autoT:0, tickT:0, paused:false, nextAt:0 };
  const cls=DB.classes.find(x=>x.id===sess.classId);
  BG.roster = cls? cls.students : [];
  if(fbReady && window.__store){
    BG.unsubs.push(window.__store.watchWhere(colName('progress'), 'value.sess', sess.id, (rows)=>{
      BG.players=rows; bingoRunDraw();
    }));
  }
  BG.tickT=setInterval(bingoAutoTick, 250);          /* 남은 시간만 갱신 — 화면을 통째로 다시 그리지 않는다 */
  bingoRunDraw();
}
/* ---------- 자동 진행 (선생님 기기에서만 돈다) ---------- */
/* 읽어주는 데 걸리는 시간 어림값 — 느린 목소리로 바꾸면 그만큼 길어진다.
   앞뒤 여백까지 넉넉히 잡는다. 선생님 기기와 학생 태블릿이 같은 계산을 써야 단계가 어긋나지 않으므로,
   실제 음성 길이로 보정하지 않고 이 어림값 하나만 쓴다. */
function bingoSayMs(text, twice){
  const words=String(text||'').trim().split(/\s+/).length;
  const one=Math.max(1200, words*380/Math.max(0.5, VOICE.rate) + 700);
  return twice? one*2+700 : one;
}
function bingoAutoSchedule(){
  if(!BG || BG.role!=='teacher') return;
  clearTimeout(BG.autoT); BG.autoT=0;
  const s=BG.sess;
  if(!(s.iv>0) || s.status!=='playing' || BG.paused){ BG.nextAt=0; return; }
  /* 음악·호루라기·문장을 다 들려주고도 생각할 틈은 남아야 한다 — 그보다 짧게는 넘기지 않는다 */
  const wait=Math.max(s.iv*1000, BG_INTRO_MS+(BG.sayMs||0)+3000);   /* 생각할 시간 최소 3초 */
  BG.nextAt=Date.now()+wait;
  BG.autoT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoNext(); }, wait);
}
function bingoAutoTick(){
  if(!BG || BG.role!=='teacher') return;
  const el=$('bgTick'); if(!el) return;
  const s=BG.sess;
  if(!(s.iv>0) || s.status!=='playing'){ el.textContent=''; return; }
  if(BG.paused){ el.textContent='⏸ 잠깐 멈춤'; return; }
  if(!BG.nextAt){ el.textContent=''; return; }
  el.textContent=`${Math.max(0,Math.ceil((BG.nextAt-Date.now())/1000))}초 뒤 다음 표현`;
}
function bingoAutoPause(){
  BG.paused=!BG.paused;
  if(BG.paused){ clearTimeout(BG.autoT); BG.autoT=0; BG.nextAt=0; }
  else bingoAutoSchedule();
  bingoRunDraw();
}
/* 간격 조절 — 수업 분위기를 보고 바로 늘리거나 줄일 수 있어야 한다 */
function bingoAutoSet(v){
  v=Math.max(4, Math.min(30, v|0));
  BG.paused=false;
  bingoTeacherSave({iv:v});          /* 새로고침해도 유지되도록 세션에 같이 저장 */
  bingoAutoSchedule();
}
function bingoAutoOff(){
  clearTimeout(BG.autoT); BG.autoT=0; BG.nextAt=0; BG.paused=false;
  bingoTeacherSave({iv:0});
}
function bingoTeacherSave(patch){
  Object.assign(BG.sess, patch, {updatedAt:Date.now()});
  sSet(bingoKey(BG.sess.classId), BG.sess);   /* 판정·저장은 선생님 기기 한 대만 한다 */
  bingoRunDraw();
}
function bingoNext(){
  const s=BG.sess;
  const unseen=s.items.map((_,i)=>i).filter(i=>!s.calls.includes(i));
  const pool=unseen.length?unseen:s.items.map((_,i)=>i);       /* 다 들려줬으면 처음부터 다시 */
  const pick=pool[Math.floor(Math.random()*pool.length)];
  clearTimeout(BG.repeatT); clearTimeout(BG.sayT); clearTimeout(BG.whistleT);
  const text=s.items[pick].t;
  BG.callAt=Date.now();
  BG.sayMs=bingoSayMs(text, false);                 /* 문장은 한 번만 들려준다 */
  bingoJingle();                                    /* ① 경쾌한 음악 */
  BG.whistleT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoWhistle(); }, BG_JINGLE_MS);      /* ② 삑~ */
  BG.sayT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoSay(text, false); }, BG_INTRO_MS);    /* ③ 듣기 */
  bingoTeacherSave({ calls:[...s.calls, pick], at:Date.now(), status:'playing' });
  bingoPhaseTimers(bingoRunDraw);                   /* ④ 생각·터치 */
  bingoAutoSchedule();
}
function bingoRunDraw(){
  if(!BG || BG.role!=='teacher') return;
  if(BG.learn) return bingoLearnDraw();
  const s=BG.sess, ci=s.calls.length? s.calls[s.calls.length-1] : -1, it=ci>=0? s.items[ci] : null;
  /* 게임 중에는 정답을 화면에 절대 띄우지 않는다.
     이 화면이 곧 교실 TV라, 그림이나 문장이 뜨면 늦게 누르는 학생이 소리 대신 화면을 보고 찍는다. */
  const ph=bingoPhase();
  let stage, stageCls='';
  if(s.status==='ready') stage=`<div class="em">👂</div><div class="tx">Listen &amp; Bingo</div>
      <div class="hint">아래 <b>첫 표현 들려주기</b>를 누르면 시작해요</div>`;
  else if(s.status==='done') stage=`<div class="tx">Good job! 🎉</div>
      <div class="hint">${BG.players.filter(p=>p.bingo).length}명이 빙고를 완성했어요</div>`;
  else if(ph==='jingle'){ stageCls=' jingle';
    stage=`<div class="em bg-bounce">🎵</div><div class="tx" style="font-size:1.8rem">${s.calls.length}번째 표현</div>
      <div class="hint">곧 시작해요</div>`; }
  else if(ph==='whistle'){ stageCls=' whistle';
    stage=`<div class="em">📣</div><div class="tx" style="font-size:2rem">집중!</div>
      <div class="hint">잘 들을 준비</div>`; }
  else if(ph==='listen') stage=`<div class="ear">🔊</div><div class="tx" style="font-size:1.5rem">잘 들어요</div>
      <div class="hint">한 번만 들려줍니다</div>`;
  else { stageCls=' think';
    stage=`<div class="em">👆</div><div class="tx" style="font-size:1.6rem">빙고판에서 찾아 누르세요</div>
      <div class="hint">${s.calls.length}번째 · 한 칸만 누를 수 있어요</div>`; }
  /* 들려준 표현은 게임이 끝난 뒤에만 공개한다 (놓친 학생이 뒤늦게 따라 찍는 것도 막는다) */
  const review= s.status!=='done' ? '' : `<div class="card noanim">
      <h3 style="margin:0 0 10px">🔎 들려준 표현 (${s.calls.length}번)</h3>
      <div class="bg-review">${s.calls.map((c,k)=>`<span><b>${k+1}</b> ${s.items[c].e||''} ${esc(s.items[c].t)}</span>`).join('')}</div>
    </div>`;
  /* 명단과 학생 기록을 합친다 — 아직 안 들어온 학생도 보이도록 */
  const byId={}; BG.players.forEach(p=> byId[p.sid]=p);
  const rows=(BG.roster.length? BG.roster.map(st=>({ sid:st.id, name:st.name, p:byId[st.id] }))
    : BG.players.map(p=>({ sid:p.sid, name:p.name, p })));
  const near=rows.filter(r=>r.p && !r.p.bingo && r.p.lines>=s.target-1).length;
  const wins=rows.filter(r=>r.p && r.p.bingo).length;
  const tiles=rows.map(r=>{ const p=r.p;
    const c=p? (p.bingo?'win':(p.lines>=s.target-1?'near':'')) : '';
    const st=p? (p.bingo?'🎉 빙고!':`${p.lines}줄 · ${p.marks.filter(Boolean).length}칸`) : '아직 안 들어옴';
    return `<div class="bg-stu ${c}"><div class="nm">${esc(r.name)}</div><div class="st">${st}</div></div>`;}).join('');
  app.innerHTML=`<button class="back" onclick="bingoQuitTeacher()">← 선생님 메뉴</button>
    <div class="card noanim">
      <div class="bg-stage${stageCls}">${stage}</div>
      <div class="center" style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
        ${s.status==='ready'?`<button class="btn ghost" id="bgLearn">📖 표현 익히기</button>`:''}
        ${s.status!=='done'?`<button class="btn lg" id="bgNext">${s.calls.length?'다음 표현 ▶':'첫 표현 들려주기 ▶'}</button>`:''}
        ${s.calls.length&&s.status!=='done'?`<button class="btn ghost" id="bgAgain">🔁 다시 들려주기</button>`:''}
        ${s.status!=='done'?`<button class="btn ghost" id="bgEnd">게임 끝내기</button>`
          :`<button class="btn coral" id="bgNew">새 게임 만들기</button>`}
        <button class="btn ghost" id="bgClose">🗑 게임 닫기</button>
        <button class="btn ghost" id="bgPrint">🖨️ 종이 빙고판</button>
      </div>
      ${s.status==='done'? '' : `<div class="bg-auto">
        ${s.iv>0? `
          <button class="btn sm ${BG.paused?'coral':'ghost'}" id="bgPause">${BG.paused?'▶ 이어서 하기':'⏸ 잠깐 멈춤'}</button>
          <span class="ivbox">
            <button class="btn sm ghost" id="bgSlow" title="간격 줄이기 (빠르게)" ${s.iv<=4?'disabled':''}>−</button>
            <b>${s.iv}초 간격</b>
            <button class="btn sm ghost" id="bgFast" title="간격 늘리기 (천천히)" ${s.iv>=30?'disabled':''}>+</button>
          </span>
          <span class="tick" id="bgTick"></span>
          <button class="btn sm ghost" id="bgManual">✋ 수동으로</button>`
        : `<button class="btn sm ghost" id="bgAuto">⏱ 자동 진행 켜기 (14초마다)</button>
           <span class="muted" style="font-size:.82rem">켜면 누르지 않아도 다음 표현이 나와요</span>`}
      </div>`}
      <div class="bg-stat">
        <div><b>${s.calls.length}</b><span>들려준 횟수</span></div>
        <div><b>${near}</b><span>한 줄 남은 학생</span></div>
        <div><b>${wins}</b><span>빙고 완성</span></div>
      </div>
      <p class="muted center">${s.n}×${s.n} · ${s.target}빙고 · 표현 ${s.items.length}개 · ${esc(s.className||'')}</p>
    </div>
    <div class="card noanim">
      <h3 style="margin:0 0 10px">학생별 현황</h3>
      ${rows.length? `<div class="bg-grid">${tiles}</div>`
        : '<p class="muted">이 학급에 등록된 학생이 없어요. 종이 빙고판으로도 놀 수 있어요.</p>'}
    </div>
    ${review}`;
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('bgNext', bingoNext);
  on('bgLearn', ()=> bingoLearn(0));
  on('bgAgain', ()=>{ if(it) bingoSay(it.t, false); });
  on('bgEnd', ()=>{ clearTimeout(BG.repeatT); clearTimeout(BG.autoT);
    BG.autoT=0; BG.nextAt=0; speakStop(); bingoTeacherSave({status:'done'}); });
  on('bgNew', ()=> bingoPickAssignment(s.classId));
  on('bgClose', async ()=>{
    if(!confirm('게임을 닫을까요?\n학생 태블릿에서 빙고판이 사라지고, 지금까지 체크한 것도 지워져요.\n(과제는 그대로 남아서 언제든 다시 시작할 수 있어요)')) return;
    const cid=s.classId;
    clearTimeout(BG.autoT); speakStop();
    await bingoCloseGame(cid);
    bingoLeave();
    toast('게임을 닫았어요. 학생 화면에서 내려갔어요');
    bingoPickAssignment(cid);
  });
  on('bgPrint', bingoPrint);

function bingoStudentSync(){
  const s=BG.sess;
  if(s && (!BG.me || BG.me.sess!==s.id || !BG.me.marks || BG.me.marks.length!==s.n*s.n)){
    BG.me={ sess:s.id, sid:session.studentId, name:session.name, marks:Array(s.n*s.n).fill(false),
      lines:0, bingo:false, lastCall:-1, lastCell:-1, updatedAt:Date.now() };
  }
  if(s && s.status!=='ready' && BG.pr){ BG.pr=null; speakStop(); }   /* 게임이 시작되면 연습은 끝 */
  /* 새 표현이 도착한 순간부터 이 기기 기준으로 단계를 잰다 (선생님 기기와 시계가 달라도 안전) */
  if(s && s.status==='playing' && s.calls.length !== BG.seenCalls){
    BG.seenCalls=s.calls.length;
    BG.callAt=Date.now();
    BG.sayMs=bingoSayMs(s.items[s.calls[s.calls.length-1]].t, false);
    bingoPhaseTimers(()=>{ if(BG && BG.role==='student') bingoStudentDraw(); });
  }

async function bingoTap(cell){
  const s=BG.sess, me=BG.me;
  if(!s || s.status!=='playing' || me.bingo) return;
  if(bingoPhase()!=='think') return;          /* 듣는 동안에는 판이 안 보이므로 눌릴 일도 없다 */
  const callIdx=s.calls.length-1, ei=s.calls[callIdx];
  /* 방금 이번 차례에 찍은 칸은 취소할 수 있다 (지난 차례 것은 못 고침) */
  if(me.lastCall===callIdx && me.lastCell===cell){
    me.marks[cell]=false; me.lastCall=-1; me.lastCell=-1;
    me.lines=bingoDoneLines(me.marks,s.n).length; BG.fb='취소했어요. 다시 골라도 돼요';
    bingoStudentDraw(); return bingoSaveMe();
  }
  if(me.lastCall===callIdx){ BG.fb='이번 소리는 이미 체크했어요'; return bingoStudentDraw(); }
  if(me.marks[cell]){ BG.fb='이미 체크한 칸이에요'; BG.shake=cell; return bingoStudentDraw(); }
  const board=bingoBoard(s.id+'|'+session.studentId, s.n, s.items.length);
  if(board[cell]!==ei){ BG.fb='다른 그림이에요. 다시 들어보세요'; BG.shake=cell; return bingoStudentDraw(); }
  me.marks[cell]=true; me.lastCall=callIdx; me.lastCell=cell;
  me.lines=bingoDoneLines(me.marks,s.n).length;
  BG.fb='좋아요! 잘 찾았어요';
  if(me.lines>=s.target && !me.bingo){ me.bingo=true; showCeleb(`${s.target}빙고 완성! 손을 들어 선생님께 알려요 🎉`); }
  bingoStudentDraw();
  await bingoSaveMe();
}

   문제는 학생 기기 안에서만 만들고 채점한다 — 저장도, 통신도 없다. */
function bingoPracticeStart(dir){
  const s=BG.sess; if(!s) return;
  const n=s.items.length, k=Math.min(4, n);
  const qs=bgShuffle([...Array(n).keys()]).map(ans=>{
    const others=bgShuffle([...Array(n).keys()].filter(i=>i!==ans)).slice(0, k-1);
    return { ans, opts:bgShuffle([ans, ...others]) };
  });
  BG.pr={ dir:dir||'toPic', qs, i:0, ok:0, tries:0, wrongSel:-1, justOk:false };
  bingoStudentDraw();
}
function bingoPracticeAnswer(choice){
  const p=BG.pr, q=p.qs[p.i];
  if(p.justOk) return;
  p.tries++;
  if(choice!==q.ans){ p.wrongSel=choice; bingoStudentDraw(); return; }
  p.ok++; p.justOk=true; p.wrongSel=-1;
  bingoStudentDraw();
  setTimeout(()=>{                       /* 맞았다는 표시를 잠깐 보여주고 다음 문제로 */
    if(!BG || !BG.pr) return;
    BG.pr.justOk=false; BG.pr.i++;
    bingoStudentDraw();
  }, 750);
}

function bingoStudentDraw(){
  if(!BG || BG.role!=='student') return;

  const s=BG.sess;
  if(!s){ wrap.className='card empty';
    wrap.innerHTML='<span class="em">🕰️</span>아직 빙고가 열리지 않았어요.<br>선생님이 시작하면 바로 나와요!'; return; }

      <h2 style="margin:6px 0">${esc(s.title)}</h2>

      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px">

    $('prGo').onclick=()=> bingoPracticeStart('toPic');

    return; }

  const lit=new Set(); bingoDoneLines(me.marks,s.n).forEach(l=>l.forEach(i=>lit.add(i)));
  const done=(s.status!=='playing')||me.bingo;
  const cells=board.map((v,i)=>{ const it=s.items[v];
    const cls=['bg-cell', me.marks[i]?(lit.has(i)?'mk lit':'mk'):'', done?'dis':'', BG.shake===i?'shake':''].join(' ');

  }).join('');
  /* 학생 화면에도 정답을 띄우지 않는다 — 소리로만 찾는 활동이라 화면에 답이 뜨면 게임이 무너진다.
     듣는 동안에는 빙고판 자체를 감춘다 — 판을 훑어보지 말고 소리에 집중하게 하려는 것 */
  const ph=bingoPhase(), over=(s.status!=='playing');

      <div class="hint">${me.bingo?'빙고를 완성했어요!':`${me.lines}줄 완성했어요`}</div></div>`;
  else if(ph==='jingle'){ showBoard=false;
    head=`<div class="bg-stage jingle" style="min-height:200px"><div class="em bg-bounce" style="font-size:4rem">🎵</div>
      <div class="tx" style="font-size:1.6rem">${s.calls.length}번째 표현</div>
      <div class="hint">곧 시작해요</div></div>`; }
  else if(ph==='whistle'){ showBoard=false;
    head=`<div class="bg-stage whistle" style="min-height:200px"><div class="em" style="font-size:4rem">📣</div>
      <div class="tx" style="font-size:1.8rem">집중!</div>
      <div class="hint">곧 들려줄 거예요</div></div>`; }
  else if(ph==='listen'){ showBoard=false;
    head=`<div class="bg-stage" style="min-height:200px"><div class="ear">🔊</div>
      <div class="tx" style="font-size:1.4rem">잘 들어요</div>
      <div class="hint">한 번만 들려줍니다</div></div>`; }
  else head=`<div class="bg-stage think" style="min-height:96px"><div class="tx" style="font-size:1.3rem">👆 지금 눌러요</div>
      <div class="hint">${s.calls.length}번째 · 한 칸만</div></div>`;
  wrap.className='card';
  wrap.innerHTML=`
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
      <b class="jua" style="flex:1">${esc(session.name)}</b>

    ${head}
    ${showBoard? `<div class="bg-board" style="grid-template-columns:repeat(${s.n},1fr)">${cells}</div>
    <div class="bg-foot ${/좋아요/.test(BG.fb)?'hit':(BG.fb?'miss':'')}">
      ${me.bingo? 'BINGO! 🎉 손을 들어요' : (over? '게임이 끝났어요' : (BG.fb||'들은 그림을 한 칸만 눌러요'))}</div>`
    : `<div class="bg-foot">빙고판은 소리가 끝나면 나와요</div>`}`;
  /* 소리는 선생님 기기 한 대만 낸다 — 태블릿마다 따로 울리면 교실이 시끄럽고 어느 소리인지 헷갈린다 */
  BG.fb=''; BG.shake=-1;
  wrap.querySelectorAll('[data-cell]').forEach(b=> b.onclick=()=> bingoTap(+b.dataset.cell));
}

<!-- Firebase (모듈 SDK) : 전용 Firestore DB + 인증(선생님 로그인 / 학생 익명) -->
<script type="module">
(async ()=>{
  const cfg = window.__cfg || {};
  const finish = ()=>{ if(window.boot) window.boot(); };
  if(!cfg.ready){ window.__backend = { ready:false }; return finish(); }
  try{
    const imp = async (urls)=>{ let err; for(const u of urls){ try{ return await import(u); }catch(e){ err=e; } } throw err; };
    const V="10.12.5";
    const appMod = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/app/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-app.js`]);
    const fsMod  = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/firestore/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`]);
    const auMod  = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/auth/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`]);
    const { initializeApp } = appMod;
    const { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, query, where } = fsMod;
    const { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } = auMod;
    const appFb = initializeApp(cfg.config);
    const db = cfg.dbId ? getFirestore(appFb, cfg.dbId) : getFirestore(appFb);
    const auth = getAuth(appFb);
    // 항상 누군가는 로그인된 상태로 만들기(없으면 익명) — 그래야 읽기/진행 저장 가능
    await new Promise((res)=>{
      let done=false;
      onAuthStateChanged(auth, (u)=>{
        window.__user = u || null;
        if(window.__onUser) window.__onUser(u||null);
        if(!done){ done=true; if(!u){ signInAnonymously(auth).catch(()=>{}).finally(res); } else res(); }
      });
    });
    window.__store = {
      async get(col, id){ const s = await getDoc(doc(db, col, id)); return s.exists() ? s.data().value : undefined; },
      async set(col, id, value){ await setDoc(doc(db, col, id), { value }); },
      async del(col, id){ await deleteDoc(doc(db, col, id)); },
      // 문서 하나 구독. 반환값을 부르면 구독 해제(화면을 떠날 때 꼭 해제해야 요금이 새지 않음)
      watch(col, id, cb){ return onSnapshot(doc(db, col, id), s=> cb(s.exists()? s.data().value : undefined)); },
      // 같은 필드값을 가진 문서들을 통째로 구독 (빙고 교사 대시보드용)
      watchWhere(col, field, val, cb){
        return onSnapshot(query(collection(db, col), where(field, '==', val)),
          snap=> cb(snap.docs.map(d=> d.data().value).filter(v=> v!==undefined)),
          err=> console.warn('watchWhere', col, err));   // 현황판만 비고 게임은 계속 돌아간다
      }
    };
    window.__auth = {
      current:()=> auth.currentUser,
      isTeacher:()=> { const u=auth.currentUser; return !!(u && !u.isAnonymous); },
      email:()=> { const u=auth.currentUser; return (u && u.email) || ''; },
      async signIn(email,pw){ await signInWithEmailAndPassword(auth, email, pw); },
      async signUp(email,pw){ await createUserWithEmailAndPassword(auth, email, pw); },
      async resetPassword(email){ await sendPasswordResetEmail(auth, email); },
      async signOutToAnon(){ try{ await signOut(auth); }catch(e){} try{ await signInAnonymously(auth); }catch(e){} }
    };
    // 고품질 TTS 콜러블 함수 연결 (실패해도 앱 본체/저장은 그대로 동작)
    // firebase/functions 모듈은 쓰지 않는다 — CDN에서 app 모듈과 다른 사본이 잡혀
    // "Service functions is not available"로 죽는다. 콜러블 규약대로 직접 부른다:
    //   POST {data:{...}}  →  {result:{...}}
    const FN_URL = `https://asia-northeast3-${cfg.config.projectId}.cloudfunctions.net/ttsSpeak`;
    window.__tts = async (text, voice)=>{
      const u = auth.currentUser; if(!u) return '';
      const tok = await u.getIdToken();
      const r = await fetch(FN_URL, { method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok },
        body: JSON.stringify({ data:{ text, voice } }) });
      if(!r.ok) throw new Error('tts http '+r.status);
      const j = await r.json();
      return j && j.result && j.result.url;
    };
    window.__backend = { ready:true };
  }catch(e){
    window.__backend = { ready:false, error:(e && e.message) || String(e) };
  }
  finish();
})();
</script>
