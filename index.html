<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>또박또박 영어 — 쓰기와 말하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --paper2:#FFFDF8; --ink:#2C2A26; --ink-soft:#7A7264;
    --green:#2F8F77; --green-d:#246F5C; --coral:#EE6C4D; --coral-d:#D8543A;
    --sky:#9BC7DC; --base-line:#E0876B; --gold:#F4C95D;
    --border:#E7DDC6; --shadow:rgba(80,55,15,.12); --good:#2F8F77; --bad:#D8543A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Gowun Dodum',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(244,201,93,.18), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(47,143,119,.14), transparent 42%),
      var(--paper);
    background-attachment:fixed; min-height:100vh;
  }
  h1,h2,h3,.jua{font-family:'Jua',sans-serif; font-weight:400; letter-spacing:.5px;}
  .wrap{max-width:920px; margin:0 auto; padding:18px 16px 80px;}
  .topbar{display:flex; align-items:center; gap:12px; padding:12px 16px; margin:-4px 0 18px; flex-wrap:wrap;
    background:var(--paper2); border:2px solid var(--border); border-radius:18px; box-shadow:0 6px 0 var(--shadow);}
  .logo{font-family:'Jua'; font-size:1.45rem; color:var(--green-d);}
  .logo .pen{color:var(--coral);}
  .spacer{flex:1;}
  .who{font-size:.9rem; color:var(--ink-soft); word-break:break-all;}
  .who b{color:var(--ink);}
  button{font-family:'Jua',sans-serif; cursor:pointer; border:none; font-size:1rem;}
  .btn{background:var(--green); color:#fff; padding:11px 18px; border-radius:14px;
    box-shadow:0 4px 0 var(--green-d); transition:transform .06s, box-shadow .06s;}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d);}
  .btn.coral{background:var(--coral); box-shadow:0 4px 0 var(--coral-d);}
  .btn.coral:active{box-shadow:0 1px 0 var(--coral-d);}
  .btn.ghost{background:#fff; color:var(--ink); box-shadow:0 4px 0 var(--border); border:2px solid var(--border);}
  .btn.ghost:active{box-shadow:0 1px 0 var(--border);}
  .btn.sm{padding:7px 13px; font-size:.9rem; border-radius:11px;}
  .btn.lg{padding:15px 26px; font-size:1.2rem; border-radius:18px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
  .card{background:var(--paper2); border:2px solid var(--border); border-radius:20px;
    padding:20px; box-shadow:0 8px 0 var(--shadow); margin-bottom:18px; animation:rise .35s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  label{display:block; font-size:.9rem; color:var(--ink-soft); margin:0 0 5px 3px;}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%; font-family:'Gowun Dodum'; font-size:1rem; color:var(--ink);
    padding:11px 13px; border:2px solid var(--border); border-radius:12px; background:#fff; outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--green);}
  textarea{resize:vertical; min-height:96px; line-height:1.6;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row>div{flex:1; min-width:120px;}
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .tile{background:#fff; border:2px solid var(--border); border-radius:16px; padding:16px;
    text-align:center; box-shadow:0 5px 0 var(--shadow); cursor:pointer; transition:transform .08s;}
  .tile:hover{transform:translateY(-3px);}
  .tile .emoji{font-size:2rem; display:block; margin-bottom:6px;}
  .tile .t{font-family:'Jua'; font-size:1.1rem;}
  .tile.on{border-color:var(--green); background:#E9F6F0; box-shadow:0 5px 0 var(--green);}
  .tile.on::after{content:'✓'; position:absolute; top:6px; right:10px; color:var(--green-d); font-family:'Jua';}
  .tile{position:relative;}
  .tile .s{font-size:.8rem; color:var(--ink-soft); margin-top:4px;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:#fff; border:2px solid var(--border);
    border-radius:999px; padding:6px 12px; font-size:.85rem; margin:0 6px 6px 0;}
  .chip.lib-g{cursor:pointer; font-family:'Jua';}
  .chip.lib-g.on{background:var(--green); color:#fff; border-color:var(--green);}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.78rem; font-family:'Jua';}
  .pill.done{background:#E3F3ED; color:var(--green-d);}
  .pill.not{background:#FCE6DF; color:var(--coral-d);}
  .item-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border:2px solid var(--border);
    border-radius:12px; background:#fff; margin-bottom:8px;}
  .item-row input[type=checkbox]{width:20px; height:20px; accent-color:var(--green); flex:0 0 auto;}
  .item-row .txt{flex:1; font-family:'Andika'; font-size:1.05rem; word-break:break-word;}
  .item-row .ty{font-size:.72rem; color:var(--ink-soft); background:#F4EEDF; padding:2px 8px; border-radius:8px; flex:0 0 auto;}
  /* 과제 항목 한 줄 = 낱말 하나 (카드 미션 편집기와 같은 방식) */
  .asg-row{display:grid; grid-template-columns:26px 34px 1fr 1fr 32px; gap:7px; align-items:center; margin-bottom:8px;}
  .asg-row input[type=checkbox]{width:20px; height:20px; accent-color:var(--green); margin:0 auto;}
  .asg-row input[type=text]{margin:0;}
  .asg-row input.en{font-family:'Andika';}
  .asg-row .ty{font-size:.7rem; color:var(--ink-soft); background:#F4EEDF; border-radius:8px;
    padding:6px 0; text-align:center; align-self:stretch; display:flex; align-items:center; justify-content:center;}
  .asg-row.off input[type=text]{opacity:.5; background:#FAF6EC;}
  @media (max-width:560px){
    .asg-row{grid-template-columns:26px 34px 1fr 32px;}
    .asg-row>*:nth-child(1){grid-area:1/1/3/2; align-self:center;}
    .asg-row>*:nth-child(2){grid-area:1/2/3/3; align-self:stretch;}
    .asg-row>*:nth-child(3){grid-area:1/3/2/4;}
    .asg-row>*:nth-child(4){grid-area:2/3/3/4;}
    .asg-row>*:nth-child(5){grid-area:1/4/3/5;}
  }
  .del{background:none; color:var(--coral-d); font-size:1.2rem; padding:2px 6px; box-shadow:none;}
  .muted{color:var(--ink-soft); font-size:.9rem;}
  .center{text-align:center;}
  .hr{height:2px; background:var(--border); border-radius:2px; margin:16px 0;}
  .seg{display:inline-flex; background:#F1E9D6; border-radius:12px; padding:4px; gap:4px; margin-bottom:14px; flex-wrap:wrap;}
  .seg button{background:transparent; color:var(--ink-soft); padding:8px 14px; border-radius:9px;}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 2px 0 var(--shadow);}
  .progress{height:14px; background:#EFE6D2; border-radius:999px; overflow:hidden; border:1px solid var(--border);}
  .progress>div{height:100%; background:linear-gradient(90deg,var(--gold),var(--green)); width:0; transition:width .4s;}
  /* tracing */
  .trace-line{position:relative; margin:10px 0; border-radius:14px; overflow:hidden;
    border:2px solid var(--border); background:#fff; touch-action:none;}
  .trace-line.locked{opacity:.85;}
  .trace-line.future{opacity:.35; pointer-events:none;}
  .trace-line canvas{display:block; width:100%;}
  .trace-line .ink{position:absolute; inset:0;}
  .badge{position:absolute; top:8px; right:10px; font-family:'Jua'; font-size:.95rem; padding:3px 11px;
    border-radius:999px; display:none;}
  .badge.show{display:block; animation:pop .3s ease both;}
  .badge.ok{background:#E3F3ED; color:var(--green-d);}
  .badge.try{background:#FCE6DF; color:var(--coral-d);}
  @keyframes pop{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}
  .line-tools{display:flex; gap:8px; justify-content:flex-end; margin-top:4px;}
  .model-card{background:#FFFCF4; border:2px dashed var(--green); border-radius:14px; padding:6px 10px;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:14px; font-family:'Jua';
    opacity:0; transition:.3s; z-index:50; box-shadow:0 8px 20px rgba(0,0,0,.25);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .celebrate{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60;
    background:rgba(43,42,38,.55); backdrop-filter:blur(3px);}
  .celebrate.show{display:flex; animation:rise .3s ease both;}
  .celebrate .box{background:var(--paper2); border-radius:24px; padding:34px 30px; text-align:center;
    border:3px solid var(--gold); box-shadow:0 14px 0 var(--shadow); max-width:340px;}
  .celebrate .big{font-size:3.2rem;}
  .back{background:none; box-shadow:none; color:var(--green-d); font-family:'Jua'; padding:6px 2px; font-size:1rem;}
  .empty{text-align:center; color:var(--ink-soft); padding:30px 10px;}
  .empty .em{font-size:2.4rem; display:block; margin-bottom:8px;}
  .roster{display:grid; grid-template-columns:1fr; gap:8px;}
  .stu-card{display:flex; align-items:center; gap:12px; background:#fff; border:2px solid var(--border);
    border-radius:14px; padding:11px 14px;}
  .stu-card .nm{font-family:'Jua'; flex:1;}
  .stu-card .mini{height:10px; width:90px; background:#EFE6D2; border-radius:999px; overflow:hidden;}
  .stu-card .mini>div{height:100%; background:var(--green);}
  .legend{font-size:.82rem; color:var(--ink-soft); margin-bottom:10px;}
  .count-ctrl{display:flex; align-items:center; gap:10px;}
  .count-ctrl button{width:40px; height:40px; border-radius:12px; background:var(--gold); color:var(--ink); box-shadow:0 3px 0 #d8ab3e;}
  .count-ctrl .n{font-family:'Jua'; font-size:1.6rem; min-width:42px; text-align:center;}
  /* multi-copy tracing line */
  .trace-row{display:flex; gap:0; border:2px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; margin:10px 0;}
  .trace-cell{position:relative; flex:1 1 0; min-width:0; touch-action:none; border-right:2px dashed var(--border);}
  .trace-cell:last-child{border-right:none;}
  .trace-cell.future{opacity:.32; pointer-events:none;}
  .trace-cell.locked{opacity:.95;}
  .trace-cell canvas{display:block; width:100%;}
  .trace-cell .ink{position:absolute; inset:0;}
  .trace-cell .badge{top:4px; right:6px; font-size:.85rem; padding:1px 8px;}
  @media(max-width:520px){ .wrap{padding:12px 10px 80px;} .card{padding:15px;} .logo{font-size:1.2rem;} }
  /* speaking practice */
  .speak-hero{border-radius:22px; padding:26px 20px; text-align:center; color:#fff;
    background:linear-gradient(135deg,#3b6fd4,#6a4bd8); box-shadow:0 10px 0 rgba(60,40,120,.25);}
  .speak-hero .tag{display:inline-block; font-family:'Jua'; font-size:.72rem; letter-spacing:.5px;
    background:rgba(255,255,255,.22); padding:4px 12px; border-radius:999px; margin-bottom:12px;}
  .speak-hero .word{font-family:'Andika'; font-weight:700; font-size:2.8rem; line-height:1.1;}
  .speak-hero .mean{font-size:1.05rem; opacity:.95; margin-top:4px;}
  .speak-hero .listen{margin-top:16px; background:rgba(255,255,255,.95); color:#3b3a86;
    font-family:'Jua'; padding:11px 20px; border-radius:14px; box-shadow:0 4px 0 rgba(0,0,0,.15);}
  .speak-hero .listen:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .chal-dots{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .chal-dots .d{width:30px; height:30px; border-radius:999px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Jua'; font-size:.85rem; color:var(--ink-soft); background:#fff;}
  .chal-dots .d.on{background:var(--green); border-color:var(--green); color:#fff;}
  .mic-zone{border:2px dashed var(--border); border-radius:16px; padding:22px 16px; text-align:center; background:#FBFAF6;}
  .mic-btn{width:84px; height:84px; border-radius:999px; background:var(--coral); color:#fff; font-size:2rem;
    box-shadow:0 6px 0 var(--coral-d); margin-bottom:6px;}
  .mic-btn:active{transform:translateY(3px); box-shadow:0 3px 0 var(--coral-d);}
  .mic-btn.rec{background:#d83a3a; box-shadow:0 6px 0 #a82a2a; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.07);}}
  .heard{font-family:'Andika'; font-size:1.15rem; min-height:1.4em;}
  .score-big{font-family:'Jua'; font-size:2rem;}
  .score-row{display:flex; gap:12px; margin-top:12px;}
  .score-row>div{flex:1; background:#fff; border:2px solid var(--border); border-radius:14px; padding:12px;}
  /* ===== 듣기 빙고 ===== */
  .card.noanim{animation:none;}   /* 자주 다시 그리는 화면 — 매번 나타나는 효과가 반복되면 눈이 아프다 */
  .bg-stage{border-radius:22px; padding:22px 18px; text-align:center; color:#fff; min-height:230px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(135deg,#1f5f8b,#2F8F77); box-shadow:0 10px 0 rgba(20,60,60,.25);}
  .bg-stage .em{font-size:5.5rem; line-height:1;}
  .bg-stage .tx{font-family:'Andika'; font-weight:700; font-size:2.1rem; line-height:1.2;}
  .bg-stage .mn{font-size:1.05rem; opacity:.9;}
  .bg-stage .hint{font-family:'Jua'; font-size:1rem; opacity:.85;}
  .bg-stage .ear{font-size:5rem; animation:bgear 1.1s ease-in-out infinite;}
  /* 단계마다 화면 색이 확 달라져야 멀리서도 지금이 들을 때인지 누를 때인지 안다 */
  .bg-stage.jingle{background:linear-gradient(135deg,#6a4bd8,#3b6fd4); box-shadow:0 10px 0 rgba(60,40,120,.25);}
  .bg-bounce{animation:bgbounce .5s ease-in-out infinite alternate;}
  @keyframes bgbounce{from{transform:translateY(6px) rotate(-7deg);} to{transform:translateY(-8px) rotate(7deg);}}
  .bg-stage.whistle{background:linear-gradient(135deg,#D8543A,#F4C95D); box-shadow:0 10px 0 rgba(120,50,20,.25);}
  .bg-stage.whistle .em{animation:bgpop .5s ease both;}
  @keyframes bgpop{0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;}}
  .bg-stage.think{background:linear-gradient(135deg,#2F8F77,#6FB98F); box-shadow:0 10px 0 rgba(20,80,60,.25);}
  @keyframes bgear{0%,100%{opacity:.5; transform:scale(.94);} 50%{opacity:1; transform:scale(1.06);}}
  .bg-hist{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:6px;}
  .bg-hist span{background:rgba(255,255,255,.18); border-radius:10px; padding:3px 8px; font-size:1.2rem;}
  .bg-board{display:grid; gap:6px; margin:12px 0;}
  /* 칸 글씨는 화면이 아니라 '칸 크기'에 맞춰 커진다 — 7×7도 태블릿에서 깨지지 않도록 */
  .bg-cell{aspect-ratio:1; border:2px solid var(--border); border-radius:12px; background:#fff;
    display:flex; align-items:center; justify-content:center; position:relative; padding:2px;
    container-type:inline-size; overflow:hidden; transition:transform .08s;}
  .bg-cell .e{font-size:58cqw; line-height:1;}
  .bg-cell .w{font-family:'Gowun Dodum'; font-size:min(19cqw,17px); line-height:1.2;
    word-break:keep-all; text-align:center;}
  .bg-cell:active{transform:scale(.93);}
  .bg-cell.mk{background:#FCE6DF; border-color:var(--coral);}
  .bg-cell.mk::after{content:''; position:absolute; inset:10%; border:3px solid var(--coral);
    border-radius:50%; opacity:.8; transform:rotate(-8deg);}
  .bg-cell.lit{background:#FCF2D8; border-color:var(--gold);}
  .bg-cell.lit::after{border-color:#D9A324;}
  .bg-cell.dis{opacity:.9;}
  .bg-cell.shake{animation:bgshake .34s;}
  @keyframes bgshake{0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);}}
  .bg-foot{text-align:center; font-family:'Jua'; padding:8px 0; min-height:2.2em;}
  .bg-foot.hit{color:var(--green-d);} .bg-foot.miss{color:var(--coral-d);}
  .bg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px;}
  .bg-stu{border:2px solid var(--border); border-radius:12px; background:#fff; padding:8px 10px;}
  .bg-stu .nm{font-family:'Jua'; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bg-stu .st{font-size:.78rem; color:var(--ink-soft);}
  .bg-stu.near{background:#FCF7E6; border-color:var(--gold);}
  .bg-stu.win{background:#FDF0D2; border-color:var(--gold); box-shadow:0 3px 0 #E8CC8A;}
  /* 게임 전 연습 — 그림·문장 맞추기 */
  .pr-ask{background:#FFFCF4; border:2px dashed var(--green); border-radius:16px; padding:18px 14px;
    text-align:center; margin-bottom:14px;}
  .pr-ask .tx{font-family:'Andika'; font-weight:700; font-size:1.5rem; line-height:1.25;}
  .pr-ask .mn{color:var(--ink-soft); margin-top:4px;}
  .pr-ask .pr-big{font-size:4.5rem; line-height:1.1;}
  .pr-opts{display:grid; gap:10px;}
  .pr-opts.pic{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}
  .pr-opts.txt{grid-template-columns:1fr;}
  .pr-opt{background:#fff; border:2px solid var(--border); border-radius:16px; box-shadow:0 4px 0 var(--shadow);
    padding:12px; transition:transform .08s; text-align:center;}
  .pr-opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow);}
  .pr-opt.pic{aspect-ratio:1; display:flex; align-items:center; justify-content:center; container-type:inline-size;}
  .pr-opt.pic .e{font-size:52cqw; line-height:1;}
  .pr-opt.pic .w{font-family:'Gowun Dodum'; font-size:min(17cqw,17px); line-height:1.2; word-break:keep-all;}
  .pr-opt.txt{display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;}
  .pr-opt.txt b{font-family:'Andika'; font-size:1.15rem;}
  .pr-opt.txt .muted{font-size:.85rem;}
  .pr-opt.ok{background:#E3F3ED; border-color:var(--green); box-shadow:0 4px 0 var(--green);}
  .pr-opt.no{background:#FCE6DF; border-color:var(--coral); animation:bgshake .34s;}
  .bg-review{display:flex; flex-wrap:wrap; gap:6px;}
  .bg-review span{background:#fff; border:2px solid var(--border); border-radius:10px;
    padding:5px 10px; font-size:.9rem; font-family:'Andika';}
  .bg-review b{font-family:'Jua'; color:var(--ink-soft); margin-right:4px; font-size:.82rem;}
  .bg-auto{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    margin-top:12px; padding:9px 12px; background:#F6F1E4; border:2px solid var(--border); border-radius:14px;}
  .bg-auto .ivbox{display:inline-flex; align-items:center; gap:8px; font-family:'Jua';}
  .bg-auto .ivbox b{min-width:66px; text-align:center;}
  .bg-auto .ivbox .btn{width:34px; padding:5px 0; text-align:center;}
  .bg-auto .tick{font-family:'Jua'; color:var(--green-d); min-width:118px; text-align:center; font-size:.92rem;}
  .bg-stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .bg-stat div{background:#fff; border:2px solid var(--border); border-radius:14px; padding:10px; text-align:center;}
  .bg-stat b{display:block; font-family:'Jua'; font-size:1.5rem; color:var(--green-d);}
  .bg-stat span{font-size:.78rem; color:var(--ink-soft);}
  .bg-emo{width:56px; height:46px; font-size:1.5rem; text-align:center; background:#fff;
    border:2px solid var(--border); border-radius:12px; flex:0 0 auto; box-shadow:none; padding:0;}
  .bg-emo::placeholder{font-size:.8rem; color:var(--ink-soft); font-family:'Gowun Dodum';}
  .bg-emo-cyc{width:34px; height:46px; background:none; box-shadow:none; font-size:1rem;
    color:var(--ink-soft); flex:0 0 auto; padding:0;}
  .bg-emo-cyc:hover{color:var(--green-d);}
  /* 이모지 고르기 창 */
  .emopick{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:70;
    background:rgba(43,42,38,.55); backdrop-filter:blur(3px); padding:16px;}

<script>
/* ============================ BACKEND CONFIG ============================ */
/*  ▼▼▼  여기만 채우면 됩니다  ▼▼▼
    1) FIREBASE_CONFIG : Firebase 콘솔 → 프로젝트 설정 → '내 앱'의 구성값 복사
    2) DATABASE_ID     : 전용(이름 있는) Firestore DB의 ID. 예) "english-trace"
                         ※ (default)를 쓰면 빈 칸으로 두세요. 지금은 전용 DB 방식!
    3) COLLECTION_PREFIX: 컬렉션 접두사(다른 앱과 분리). 그대로 둬도 됨.            */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCHUXPjWyVdaPcKhgEk6PtstJJ4zI14h4A",
  authDomain: "class-relation2.firebaseapp.com",
  projectId: "class-relation2",
  storageBucket: "class-relation2.firebasestorage.app",
  messagingSenderId: "90743477473",
  appId: "1:90743477473:web:7f836a9298763cb7e6d3a0"
};
const DATABASE_ID = "english-trace";   // ← 콘솔에서 만든 전용 DB의 ID와 똑같이!
const COLLECTION_PREFIX = "eng_";       // → eng_app, eng_progress
/*  ▲▲▲  여기까지  ▲▲▲  */
const BACKEND_READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
// 모듈 스크립트가 읽어갈 설정
window.__cfg = { config:FIREBASE_CONFIG, dbId:DATABASE_ID, ready:BACKEND_READY };

/* ============================ STORAGE LAYER (Firestore) ============================ */
const KEYS = { classes:'v1:classes', assignments:'v1:assignments', settings:'v1:settings', lists:'v1:lists',
               mingle:'v1:mingle',     /* 카드 미션 세트 모음 → eng_app/mingle (선생님만 쓰기) */
               board:'v1:board',       /* 보드게임 세트 모음 → eng_app/board (선생님만 쓰기) */
               land:'v1:land',         /* 땅따먹기 세트 모음 → eng_app/land (선생님만 쓰기) */
               balance:'v1:balance' };  /* 밸런스 게임 세트 모음 → eng_app/balance (선생님만 쓰기) */
let fbReady=false, backendError='';
const mem={}; // 백엔드 연결 전/실패 시 임시 메모리(기기 간 공유 안 됨)
function colName(name){ return COLLECTION_PREFIX+name; }
function keyRef(key){
  if(key.indexOf('v1:prog:')===0) return { col:colName('progress'), id:key.slice(8).replace(/:/g,'__') };
  return { col:colName('app'), id:key.replace(/^v1:/,'').replace(/:/g,'_') };
}
async function sGet(key, def){
  if(fbReady && window.__store){ try{ const {col,id}=keyRef(key); const v=await window.__store.get(col,id);
    return v===undefined ? def : v; }catch(e){ console.warn('sGet',key,e); return def; } }
  return (key in mem)? mem[key] : def;
}
async function sSet(key, val){
  if(fbReady && window.__store){ try{ const {col,id}=keyRef(key); await window.__store.set(col,id,val); return true; }
    catch(e){ console.warn('sSet',key,e);
      const msg=(e&&(e.code||e.message))||'';
      if(/permission/i.test(msg)) toast('저장 권한이 없어요. 선생님 계정/보안 규칙의 이메일을 확인하세요.');
      else toast('저장 중 오류: '+String(msg).slice(0,60));
      return false; } }
  mem[key]=val; return true;
}
const progKey = (aid,sid)=> `v1:prog:${aid}:${sid}`;
async function sDel(key){
  if(fbReady && window.__store){ try{ const {col,id}=keyRef(key); await window.__store.del(col,id); return true; }catch(e){ console.warn('sDel',key,e); return false; } }
  delete mem[key]; return true;
}
function setupLiveSync(){
  if(!(fbReady && window.__store)) return;
  const c=colName('app');
  window.__store.watch(c,'classes', v=> DB.classes=v||[]);
  window.__store.watch(c,'assignments', v=> DB.assignments=v||[]);
  window.__store.watch(c,'lists', v=> DB.lists=v||[]);
  window.__store.watch(c,'mingle', v=> DB.mingle=v||[]);
  window.__store.watch(c,'board', v=> DB.board=v||[]);
  window.__store.watch(c,'land', v=> DB.land=v||[]);
  window.__store.watch(c,'balance', v=> DB.balance=v||[]);
  window.__store.watch(c,'settings', v=>{ if(v) applyVoiceSetting(v); });
}

/* ============================ APP STATE ============================ */
let DB = { classes:[], assignments:[], lists:[], mingle:[], board:[], land:[], balance:[] };

const uid = ()=> Math.random().toString(36).slice(2,9);

async function boot(){
  if(window.__booted) return; window.__booted=true;
  const b = window.__backend || { ready:false };
  fbReady = !!b.ready; backendError = b.error||'';
  if(fbReady){
    DB.classes = await sGet(KEYS.classes, []);
    DB.assignments = await sGet(KEYS.assignments, []);
    DB.lists = await sGet(KEYS.lists, []);
    DB.mingle = await sGet(KEYS.mingle, []);
    DB.board = await sGet(KEYS.board, []);
    DB.land = await sGet(KEYS.land, []);
    DB.balance = await sGet(KEYS.balance, []);
    await loadVoiceSetting();     // 선생님이 정한 목소리·속도를 학생 기기도 그대로 쓴다

}
function renderSetupNeeded(){

        <li>그 전용 DB의 <b>규칙(Rules)</b> 탭에 아래 규칙을 붙여넣고 <b>게시</b>. (이메일은 선생님 본인 것으로 바꾸기)</li>
        <li><b>Netlify Drop</b>(netlify.com/drop)에 파일을 올려 링크 완성 → 학생들에게 공유.</li>
        <li>그 링크로 들어가 <b>선생님</b> → <b>계정 만들기</b>로 위 4번에 적은 이메일/비번 계정을 한 번 생성하면 끝!</li>
      </ol>
      <div style="background:#FBF3E0; border:2px solid var(--gold); border-radius:12px; padding:12px; margin-top:6px">
        <b>보안 규칙</b> — 쓰기는 선생님 계정만, 읽기·진행 저장은 인증된 사용자(학생 익명 포함):
        <code style="font-size:.8rem; display:block; margin-top:6px; white-space:pre-wrap">rules_version = '2';

        <span class="muted" style="font-size:.8rem">※ <b>teacher@example.com</b>을 선생님 이메일로 꼭 바꾸세요. 이 이메일 계정만 학급·과제를 만들 수 있어요. (접두사 eng_를 바꿨다면 규칙 이름도 맞추기)</span>
      </div>

}

/* 선생님 계정으로 로그인돼 있는가 — 이 상태는 브라우저에 남아서 새로고침해도 풀리지 않는다 */

/* ============================ SPEAKING PRACTICE ============================ */
const SPEAK_GOAL = 5;
let speakRec = null;
let studentMode = 'write';   // 'write' | 'speak'
function assignmentHasMode(a, m){ const md=a.mode||'write'; return m==='speak' ? (md==='speak'||md==='both') : (md==='write'||md==='both'); }
/* ===== 목소리·속도 설정 =====
   목소리 이름만 바꾸면 되고 클라우드 함수는 손댈 필요가 없다(함수가 voice를 그대로 받는다).
   속도는 오디오를 느리게 재생해서 맞춘다 — 음높이는 그대로 유지되고, 이미 만들어 둔 mp3를
   그대로 쓰므로 속도를 바꿔도 TTS를 다시 만들지 않는다(요금 0). */
const TTS_VOICES=[
  { id:'en-US-Neural2-H', g:'f', label:'여자 1', note:'밝고 높은 편' },
  { id:'en-US-Neural2-G', g:'f', label:'여자 2', note:'또렷함' },
  { id:'en-US-Neural2-F', g:'f', label:'여자 3', note:'차분함' },
  { id:'en-US-Neural2-E', g:'f', label:'여자 4', note:'부드러움' },
  { id:'en-US-Neural2-J', g:'m', label:'남자 1', note:'밝은 편' },
  { id:'en-US-Neural2-I', g:'m', label:'남자 2', note:'또렷함' },
  { id:'en-US-Neural2-A', g:'m', label:'남자 3', note:'보통' },
  { id:'en-US-Neural2-D', g:'m', label:'남자 4', note:'낮음' }
];
const TTS_SPEEDS=[
  { v:0.70, label:'아주 느리게', note:'3~4학년 처음 듣기' },
  { v:0.82, label:'느리게', note:'따라 말하기' },
  { v:0.92, label:'조금 느리게' },
  { v:1.00, label:'보통' },
  { v:1.10, label:'빠르게', note:'익숙해진 뒤' }
];
let VOICE={ id:'en-US-Neural2-H', rate:0.82 };      // 기본값: 밝은 목소리 + 느리게
let ttsMode='', ttsError='';                        // 지금 무슨 음성으로 나가는지 (클라우드/기기) — 조용히 실패하면 알 수가 없다
const ttsUrlCache=new Map();         // 같은 (목소리|문장)은 한 세션에서 URL 재사용 (함수 호출 0)
let ttsAudio=null;
function voiceInfo(id){ return TTS_VOICES.find(v=>v.id===(id||VOICE.id)) || TTS_VOICES[0]; }
function speedLabel(r){ const s=TTS_SPEEDS.find(x=>Math.abs(x.v-r)<0.001); return s? s.label : Math.round(r*100)+'%'; }
let SETTINGS={};
function applyVoiceSetting(v){
  SETTINGS = v || {};
  if(SETTINGS.tts) VOICE={ id:SETTINGS.tts.id||VOICE.id, rate:+SETTINGS.tts.rate||VOICE.rate };
}
async function loadVoiceSetting(){ applyVoiceSetting(await sGet(KEYS.settings, {})); }
/* 읽기와 쓰기 사이에 await를 두지 않는다 — 빠르게 여러 번 누르면 앞선 저장이 덮여 날아간다 */
async function saveVoiceSetting(){
  SETTINGS.tts={ id:VOICE.id, rate:VOICE.rate };
  return sSet(KEYS.settings, SETTINGS);
}
function fallbackSpeak(text){        // 클라우드 음성이 없거나 실패하면 기기 내장 음성으로
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US';
    u.rate=Math.max(0.4, Math.min(1.2, VOICE.rate*0.92));   // 클라우드와 비슷한 빠르기로 맞춘다
    const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));
    const want=voiceInfo().g;                                 // 남/여만이라도 비슷하게 고른다
    const v=vs.find(x=> want==='f' ? /female|zira|samantha|aria|jenny|여/i.test(x.name)
                                   : /male|david|daniel|guy|남/i.test(x.name) && !/female/i.test(x.name)) || vs[0];
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakStop(){ if(speakRec){ try{ speakRec.stop(); }catch(e){} speakRec=null; }
  if(ttsAudio){ try{ ttsAudio.pause(); }catch(e){} ttsAudio=null; }
  try{ speechSynthesis.cancel(); }catch(e){} }
// 마이크 권한을 명시적으로 확보하고 즉시 반납한다(스트림을 붙들지 않음).
// SpeechRecognition의 암묵적 권한요청보다 안정적이고, 실패 원인을 분명히 알려준다.
async function ensureMic(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return {ok:true};
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=> t.stop());   // 권한만 확인하고 마이크를 곧바로 반납
    return {ok:true};
  }catch(e){ return {ok:false, err:e}; }
}
async function speak(text){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(ttsAudio){ try{ ttsAudio.pause(); }catch(e){} ttsAudio=null; }
  if(window.__tts){
    try{
      const key=VOICE.id+'|'+text;            // 목소리를 바꾸면 다른 음성 파일이어야 한다
      let url=ttsUrlCache.get(key);
      if(!url){ url=await window.__tts(text, VOICE.id); if(url) ttsUrlCache.set(key, url); }
      if(url){
        const au=new Audio(url);
        au.preservesPitch=true; au.mozPreservesPitch=true; au.webkitPreservesPitch=true;  // 느리게 해도 목소리가 굵어지지 않게
        au.playbackRate=VOICE.rate;
        ttsAudio=au; await au.play();
        ttsMode='cloud'; ttsError=''; return;
      }
    }catch(e){ ttsError=(e&&(e.code||e.message))||String(e); }   /* 아래 폴백으로 */
  } else ttsError=ttsError||'클라우드 음성에 연결되지 않았어요';
  ttsMode='device';
  fallbackSpeak(text);
}
function spNorm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function spLev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; const d=[]; for(let j=0;j<=n;j++)d[j]=j;
  for(let i=1;i<=m;i++){ let prev=d[0]; d[0]=i; for(let j=1;j<=n;j++){ const tmp=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } } return d[n]; }
function scoreSpeech(target, alts){
  const t=spNorm(target); let best=0, bestHeard='';
  (alts||[]).forEach(raw=>{ const h=spNorm(raw); if(!h) return;
    const ml=Math.max(t.length,h.length)||1; let sc=Math.round((1-spLev(t,h)/ml)*100);
    if(t.includes(' ')){ const tw=t.split(' '), hw=new Set(h.split(' ')); const hit=tw.filter(w=>hw.has(w)).length;
      sc=Math.max(sc, Math.round((sc + Math.round(hit/tw.length*100))/2)); }
    if(sc>best){ best=sc; bestHeard=raw; }
  });
  return { score:Math.max(0,Math.min(100,best)), heard:bestHeard };
}

function speakPractice(listId, idx){
  speakStop();
  const l=DB.lists.find(x=>x.id===listId); if(!l){ speakHome(); return; }
  idx=Math.max(0, Math.min(idx, l.items.length-1));
  const it=l.items[idx];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported=!!SR;
  let count=0;
  app.innerHTML=`<button class="back" id="spBack">← ${esc(l.name)}</button>
    <div class="speak-hero">
      <div class="tag">${esc([l.grade,l.unit].filter(Boolean).join(' • ')||'SPEAKING')}</div>
      <div class="word">${esc(it.text)}</div>
      ${it.meaning?`<div class="mean">${esc(it.meaning)}</div>`:''}
      <button class="listen" id="btnListen">🔊 원어민 발음 듣기</button>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="display:flex; align-items:center; gap:10px">
        <h3 style="margin:0; flex:1">🎯 ${SPEAK_GOAL}회 따라 말하기</h3>
        <span class="muted" id="chalText">진행: 0 / ${SPEAK_GOAL}</span>
      </div>
      <div class="chal-dots" id="dots" style="margin-top:10px">${Array.from({length:SPEAK_GOAL},(_,i)=>`<span class="d" data-d="${i}">${i+1}</span>`).join('')}</div>
      <div class="mic-zone" style="margin-top:14px">
        <button class="mic-btn" id="mic">🎤</button>
        <div id="micMsg" class="muted">${supported?'버튼을 누르고 또박또박 말해요':'이 브라우저는 음성 인식이 안 돼요. 크롬에서 열어 주세요.'}</div>
      </div>
      <div class="score-row">
        <div><div class="muted" style="font-size:.8rem">인식된 발음</div><div class="heard" id="heard">대기 중…</div></div>
        <div><div class="muted" style="font-size:.8rem">발음 점수</div><div class="score-big" id="score">-- <span style="font-size:.9rem; color:var(--ink-soft)">/100</span></div></div>
      </div>
    </div>
    <div style="display:flex; gap:8px">
      <button class="btn ghost" id="prev" ${idx<=0?'disabled':''}>← 이전</button>
      <button class="btn" id="next" style="flex:1" ${idx>=l.items.length-1?'disabled':''}>다음 단어 →</button>
    </div>`;
  $('spBack').onclick=()=>{ speakStop(); speakList(listId); };
  $('btnListen').onclick=()=> speak(it.text);
  $('prev').onclick=()=>{ speakStop(); speakPractice(listId, idx-1); };
  $('next').onclick=()=>{ speakStop(); speakPractice(listId, idx+1); };
  const setDots=()=>{ app.querySelectorAll('#dots .d').forEach((d,i)=> d.classList.toggle('on', i<count)); $('chalText').textContent=`진행: ${count} / ${SPEAK_GOAL}`; };
  if(!supported){ $('mic').disabled=true; return; }
  const mic=$('mic');
  let micBusy=false;
  mic.onclick=async ()=>{
    if(micBusy) return;
    if(speakRec){ speakStop(); mic.classList.remove('rec'); $('micMsg').textContent='버튼을 누르고 또박또박 말해요'; return; }
    micBusy=true;
    // 1) 따라 말하기 전, 재생 중인 발음 듣기(TTS)를 멈춰 마이크 충돌을 막는다
    try{ if(ttsAudio){ ttsAudio.pause(); ttsAudio=null; } speechSynthesis.cancel(); }catch(e){}
    // 2) 클릭 제스처 안에서 마이크 권한을 명시적으로 확보한다
    $('micMsg').textContent='마이크를 준비하고 있어요…';
    const perm=await ensureMic();
    if(!perm.ok){
      const n=perm.err && perm.err.name;
      $('micMsg').textContent =
        (n==='NotAllowedError'||n==='SecurityError') ? '마이크 권한을 허용해 주세요 (주소창 자물쇠 🔒 → 마이크 → 허용)' :
        (n==='NotReadableError'||n==='AbortError')   ? '다른 앱이 마이크를 쓰고 있어요. 화면 녹화·화상수업·관제 앱을 닫고 다시 눌러 주세요' :
        (n==='NotFoundError')                        ? '마이크를 찾을 수 없어요. 기기에 마이크가 연결됐는지 확인해 주세요' :
                                                       '마이크를 시작할 수 없어요. 잠시 후 다시 눌러 주세요';
      mic.classList.remove('rec'); micBusy=false; return;
    }
    // 3) 마이크가 완전히 반납되도록 잠깐 기다린 뒤 음성 인식 시작
    await new Promise(res=> setTimeout(res,120));
    const r=new SR(); speakRec=r; r.lang='en-US'; r.interimResults=false; r.maxAlternatives=4;
    mic.classList.add('rec'); $('micMsg').textContent='듣고 있어요… 지금 말해보세요 🎙️';
    r.onresult=(e)=>{
      const alts=[...e.results[0]].map(a=>a.transcript);
      const {score, heard}=scoreSpeech(it.text, alts);
      $('heard').textContent=heard||'(못 알아들었어요)';
      $('score').innerHTML=`${score} <span style="font-size:.9rem; color:var(--ink-soft)">/100</span>`;
      $('score').style.color = score>=80?'var(--green-d)': score>=60?'#caa12e':'var(--coral-d)';
      if(score>=60){ if(count<SPEAK_GOAL) count++; setDots();
        $('micMsg').textContent = count>=SPEAK_GOAL ? '완료! 아주 잘했어요 🎉 다음 단어로 가볼까요?' : (score>=80?'아주 좋아요! 한 번 더 💯':'좋아요! 계속 말해봐요');
      } else { $('micMsg').textContent='다시 또박또박 말해볼까요? 🔊 발음을 한 번 더 들어봐도 좋아요'; }
    };
    r.onerror=(e)=>{
      const er=e.error;
      $('micMsg').textContent =
        (er==='not-allowed'||er==='service-not-allowed') ? '마이크 권한을 허용해 주세요' :
        (er==='audio-capture')                           ? '다른 앱이 마이크를 쓰고 있어요. 다른 앱을 닫고 다시 눌러 주세요' :
        (er==='no-speech')                               ? '소리가 안 들렸어요. 마이크에 가까이, 또박또박 말해 주세요' :
                                                           '잘 안 들렸어요. 다시 눌러 주세요';
      mic.classList.remove('rec'); speakRec=null;
    };
    r.onend=()=>{ mic.classList.remove('rec'); if(speakRec===r) speakRec=null; };
    try{ r.start(); }catch(e){ $('micMsg').textContent='마이크를 시작할 수 없어요. 다시 눌러 주세요'; mic.classList.remove('rec'); speakRec=null; }
    micBusy=false;
  };
}

async function teacherLogin(){
  // 이미 선생님으로 로그인돼 있으면 바로 통과
  if(window.__auth && window.__auth.isTeacher()){ session.role='teacher'; teacherHome(); return; }
  if(!(window.__auth)){ toast('백엔드 준비 중이에요. 잠시 후 다시 시도하세요'); return; }
  let mode='in'; // 'in' 로그인 / 'up' 계정만들기
  const draw=()=>{
    app.innerHTML = `
    <button class="back" onclick="renderHome()">← 처음으로</button>
    <div class="card" style="max-width:430px; margin:0 auto">
      <h2 class="center">${mode==='in'?'선생님 로그인':'선생님 계정 만들기'}</h2>
      <p class="muted center">${mode==='in'?'이메일과 비밀번호로 로그인하세요.':'처음이시면 계정을 한 번 만들어요. (학교 이메일 권장)'}</p>
      <label>이메일</label>
      <input type="email" id="tEmail" placeholder="teacher@example.com" autocomplete="username">
      <label style="margin-top:8px">비밀번호</label>
      <input type="password" id="tPw" placeholder="6자 이상" autocomplete="${mode==='in'?'current-password':'new-password'}">
      <button class="btn lg" style="width:100%; margin-top:12px" id="doAuth">${mode==='in'?'로그인':'계정 만들고 시작하기'}</button>
      <p class="center" style="margin-top:12px">
        <button class="back" id="toggleMode" style="font-size:.88rem">${mode==='in'?'처음이신가요? 계정 만들기':'이미 계정이 있어요 → 로그인'}</button>
      </p>
      ${mode==='in'? '<p class="center" style="margin-top:-4px"><button class="back" id="resetPw" style="font-size:.82rem; color:var(--ink-soft)">비밀번호를 잊으셨나요? 재설정 메일 보내기</button></p>':''}
      <p class="muted" style="font-size:.78rem">※ 학급·과제를 만들고 고칠 수 있는 권한은 <b>선생님 계정</b>에만 있어요. 학생은 로그인 없이 사용합니다.</p>
    </div>`;
    $('tEmail').focus();
    $('toggleMode').onclick=()=>{ mode = (mode==='in'?'up':'in'); draw(); };
    $('doAuth').onclick=doAuth;
    $('tPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doAuth(); });
    const rp=$('resetPw'); if(rp) rp.onclick=async ()=>{
      const email=$('tEmail').value.trim();
      if(!email){ toast('재설정 메일을 받을 이메일을 먼저 입력하세요'); $('tEmail').focus(); return; }
      try{ await window.__auth.resetPassword(email); toast('재설정 메일을 보냈어요! 메일함을 확인하세요 📧'); }
      catch(e){ const m=(e&&e.code)||''; toast(m.includes('user-not-found')?'그 이메일로 만든 계정이 없어요':'메일 전송 실패: '+((e&&e.message)||m)); }
    };
  };
  const doAuth=async ()=>{
    const email=$('tEmail').value.trim(), pw=$('tPw').value;
    if(!email || !pw){ toast('이메일과 비밀번호를 입력하세요'); return; }
    const btn=$('doAuth'); btn.disabled=true; btn.textContent='처리 중...';
    try{
      if(mode==='up') await window.__auth.signUp(email, pw);
      else await window.__auth.signIn(email, pw);
      session.role='teacher'; toast('환영합니다, 선생님! 👩‍🏫'); teacherHome();
    }catch(e){
      const m=(e&&e.code)||'';
      const msg = m.includes('invalid-credential')||m.includes('wrong-password')||m.includes('user-not-found') ? '이메일 또는 비밀번호가 맞지 않아요'
        : m.includes('email-already-in-use') ? '이미 가입된 이메일이에요. 로그인으로 바꿔서 시도하세요'
        : m.includes('weak-password') ? '비밀번호는 6자 이상이어야 해요'
        : m.includes('invalid-email') ? '이메일 형식을 확인하세요'
        : ('로그인 실패: '+((e&&e.message)||m));
      toast(msg); btn.disabled=false; btn.textContent=(mode==='in'?'로그인':'계정 만들고 시작하기');
    }
  };
  draw();
}

/* ============================ WRITING LIST LIBRARY ============================ */
function listMatchKey(g,u,n){ return `${(g||'').trim()}|${(u||'').trim()}|${(n||'').trim()}`; }
async function saveListToLibrary(meta, items, opts){
  opts=opts||{};
  if(!items || !items.length){ if(!opts.silent) toast('저장할 항목이 없어요'); return null; }
  const name=(meta.title||'').trim() || [meta.grade,meta.unit].filter(Boolean).join(' ') || '제목 없는 목록';
  let existing = meta.sourceListId ? DB.lists.find(l=>l.id===meta.sourceListId) : null;
  if(!existing) existing = DB.lists.find(l=> listMatchKey(l.grade,l.unit,l.name)===listMatchKey(meta.grade,meta.unit,name));
  /* 빙고에서 지정해 둔 그림은 과제를 고쳐도 살려 둔다 (편집 화면에서는 항목 id가 새로 생기므로 문장으로 맞춘다) */
  const prevEmoji=new Map((existing? existing.items:[]).filter(i=>i.emoji).map(i=>[i.text, i.emoji]));
  const clean=items.map(i=>({ id:i.id||uid(), text:i.text, meaning:i.meaning||'', type:i.type,
    emoji: i.emoji || prevEmoji.get(i.text) || '' }));
  if(existing){
    Object.assign(existing,{ name, grade:meta.grade||'', unit:meta.unit||'', lesson:meta.lesson||'', items:clean, updatedAt:Date.now() });
  } else {
    existing={ id:uid(), name, grade:meta.grade||'', unit:meta.unit||'', lesson:meta.lesson||'', items:clean, updatedAt:Date.now() };
    DB.lists.push(existing);
  }
  await sSet(KEYS.lists, DB.lists);
  if(!opts.silent) toast('보관함에 저장했어요 📚');
  return existing.id;
}
function createAssignment(){
  const grades=[...new Set(DB.lists.map(l=>(l.grade||'').trim()).filter(Boolean))].sort();
  app.innerHTML = `
    <button class="back" onclick="teacherHome()">← 선생님 메뉴</button>
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
        <h2 style="margin:4px 0; flex:1">📝 과제 만들기</h2>
        <button class="btn" id="newAsg">＋ 새 과제 만들기</button>
      </div>
      <p class="muted">새로 만들거나, 그동안 만든 과제를 골라 <b>다른 학급에도 그대로 부여</b>할 수 있어요.</p>
      ${(DB.lists.length || (DB.mingle||[]).length || (DB.board||[]).length || (DB.land||[]).length || (DB.balance||[]).length)? `<input type="text" id="libSearch" placeholder="🔎 제목·단어·뜻으로 검색 (예: color, 색깔)" style="margin-top:8px">

      <div id="gradeChips">${grades.map(g=>`<span class="chip lib-g" data-g="${esc(g)}">${esc(g)}</span>`).join('')}${DB.lists.some(l=>!(l.grade||'').trim())?'<span class="chip lib-g" data-g="__none__">미지정</span>':''}<span class="chip lib-g bingo" data-g="__bingo__">👂 빙고놀이</span><span class="chip lib-g mingle" data-g="__mingle__">🃏 카드 미션</span><span class="chip lib-g board" data-g="__board__">🎲 보드게임</span><span class="chip lib-g land" data-g="__land__">🚩 땅따먹기</span><span class="chip lib-g balance" data-g="__balance__">⚖️ 밸런스 게임</span></div>`:''}
    </div>
    <p class="muted" style="margin:0 0 6px 6px">${(DB.lists.length || (DB.mingle||[]).length || (DB.board||[]).length || (DB.land||[]).length || (DB.balance||[]).length)? '📋 그동안 만든 과제':''}</p>
    <div id="libList"></div>`;
  $('newAsg').onclick=()=>{ draft=null; assignmentForm(); };
  let curGrade=null, curQ='';
  const render=()=>{
    const el=$('libList');
    if(curGrade==='__mingle__' && !curQ){ renderMingleSetList(el, render); return; }
    if(curGrade==='__board__' && !curQ){ renderBoardSetList(el, render); return; }
    if(curGrade==='__land__' && !curQ){ renderLandSetList(el, render); return; }
    if(curGrade==='__balance__' && !curQ){ renderBalanceSetList(el, render); return; }
    if(!DB.lists.length){ el.innerHTML='<div class="card empty"><span class="em">🌱</span>아직 만든 과제가 없어요.<br>「＋ 새 과제 만들기」로 시작해요.</div>'; return; }
    let rows;
    if(curQ){ const q=curQ.toLowerCase();
      rows=DB.lists.filter(l=> (l.name||'').toLowerCase().includes(q) || (l.grade||'').toLowerCase().includes(q) || (l.unit||'').toLowerCase().includes(q)
        || l.items.some(i=> (i.text||'').toLowerCase().includes(q) || (i.meaning||'').toLowerCase().includes(q)));
    } else if(curGrade==null){
      el.innerHTML='<div class="card empty"><span class="em">👆</span>위에서 학년을 선택하면<br>그 학년의 과제가 나와요.</div>'; return;
    } else if(curGrade==='__bingo__'){
      rows=DB.lists.filter(l=> l.bingo);                      /* 빙고놀이용으로 표시해 둔 것만 */
    } else {
      rows=DB.lists.filter(l=> curGrade==='__none__' ? !(l.grade||'').trim() : (l.grade||'').trim()===curGrade);
    }
    rows=[...rows].sort((a,b)=> (a.grade||'').localeCompare(b.grade||'') || (a.unit||'').localeCompare(b.unit||'') || (b.updatedAt-a.updatedAt));
    if(!rows.length){ el.innerHTML=`<div class="card empty"><span class="em">${curGrade==='__bingo__'?'👂':'🔍'}</span>${
      curQ? '검색 결과가 없어요.'
      : curGrade==='__bingo__'? '빙고놀이용으로 표시한 목록이 없어요.<br>목록 카드의 <b>「👂 빙고놀이용으로 표시」</b>를 눌러 두면 여기 모입니다.'

    el.innerHTML = rows.map(l=>{
      const preview=l.items.slice(0,8).map(i=>esc(i.text)).join(', ')+(l.items.length>8?' …':'');
      const tag=[l.grade,l.unit,l.lesson].filter(Boolean).join(' / ');
      const givenClassIds=[...new Set(DB.assignments.filter(a=>a.listId===l.id).map(a=>a.classId))];
      const givenChips=givenClassIds.map(cid=>{ const c=DB.classes.find(x=>x.id===cid); if(!c) return '';
        return `<span class="chip">${esc(c.name)} <button class="del" data-revoke="${l.id}|${cid}" title="이 학급에서 배부 취소" style="font-size:1rem; padding:0 2px">×</button></span>`; }).filter(Boolean).join('');
      const emoCount=l.items.filter(i=>i.emoji && i.emoji!=='-').length;
      /* 이 낱말이 지금 어디에 쓰이고 있는지 — 한 번 만든 낱말을 여러 활동에서 돌려 쓴다 */
      const asgModes=new Set(DB.assignments.filter(a=>a.listId===l.id).map(a=>a.mode||'write'));
      const ms=mgSetOfList(l), bs=bdSetOfList(l), gs=ldSetOfList(l);
      const usedPills=[
        asgModes.has('write')? '<span class="pill done">✏️ 쓰기</span>':'',
        asgModes.has('speak')? '<span class="pill done">🗣️ 말하기</span>':'',
        (l.bingo||asgModes.has('bingo'))? '<span class="pill bingo">👂 듣기 빙고</span>':'',
        ms? '<span class="pill mingle">🃏 카드 미션</span>':'',
        bs? '<span class="pill board">🎲 보드게임</span>':'',
        gs? '<span class="pill land">🚩 땅따먹기</span>':''
      ].filter(Boolean).join(' ');
      return `<div class="card" style="margin-bottom:12px">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
          <h3 style="margin:0; flex:1">${gs?'🚩':(bs?'🎲':(ms?'🃏':(l.bingo?'👂':'📄')))} ${esc(l.name)}</h3>
          <span class="muted">낱말 ${l.items.length}개</span>
        </div>
        <p class="muted" style="margin:5px 0 6px">${tag||'학년 미지정'}${emoCount?` · 그림 ${emoCount}개 지정됨`:''}</p>
        <p style="font-family:'Andika'; font-size:.95rem; margin:0 0 8px; color:var(--ink-soft)">${preview}</p>
        <p class="muted" style="font-size:.82rem; margin:0 0 4px">${usedPills? '지금 쓰이는 곳' : '아직 아무 활동에도 쓰지 않았어요'}</p>
        ${usedPills? `<div style="margin:0 0 10px">${usedPills}</div>`:''}
        <p class="muted" style="font-size:.82rem; margin:0 0 4px">${givenChips? '✅ 부여한 학급 <span style="font-size:.78rem">(×로 배부 취소)</span>' : '아직 부여한 학급 없음'}</p>
        ${givenChips? `<div style="margin:0 0 10px">${givenChips}</div>` : ''}
        <p class="muted" style="font-size:.82rem; margin:0 0 6px">📚 이 낱말로 만들기 <span style="font-size:.78rem">(그림과 대화문도 그대로 따라와요)</span></p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px">
          <button class="btn sm" data-load="${l.id}|write">✏️ 쓰기</button>
          <button class="btn sm" data-load="${l.id}|speak">🗣️ 말하기</button>
          <button class="btn sm" data-load="${l.id}|bingo">👂 듣기 빙고</button>
          <button class="btn sm" data-load="${l.id}|mingle">🃏 카드 미션${ms?' (이어서 고치기)':''}</button>
          <button class="btn sm" data-load="${l.id}|board">🎲 보드게임${bs?' (이어서 고치기)':''}</button>
          <button class="btn sm" data-load="${l.id}|land">🚩 땅따먹기${gs?' (이어서 고치기)':''}</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn ${l.bingo?'':'ghost'} sm" data-bingo="${l.id}">${l.bingo?'👂 빙고놀이용 ✓':'👂 빙고놀이용으로 표시'}</button>
          <button class="btn ghost sm" data-rename="${l.id}">이름 변경</button>
          <button class="btn ghost sm" data-dellist="${l.id}">삭제</button>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('[data-load]').forEach(b=> b.onclick=()=>{
      const [lid,md]=b.dataset.load.split('|'); loadListIntoDraft(lid, md); });
    el.querySelectorAll('[data-bingo]').forEach(b=> b.onclick=async ()=>{
      const l=DB.lists.find(x=>x.id===b.dataset.bingo); if(!l) return;
      l.bingo=!l.bingo; l.updatedAt=Date.now();
      await sSet(KEYS.lists, DB.lists);
      toast(l.bingo? '빙고놀이용으로 표시했어요 👂' : '빙고놀이 표시를 뺐어요');
      render();                    /* 보고 있던 학년·검색은 그대로 둔다 */
    });
    el.querySelectorAll('[data-rename]').forEach(b=> b.onclick=async ()=>{ const l=DB.lists.find(x=>x.id===b.dataset.rename);
      const nn=prompt('새 이름을 입력하세요', l.name); if(nn==null) return; l.name=(nn.trim()||l.name); l.updatedAt=Date.now(); await sSet(KEYS.lists,DB.lists); render(); });
    el.querySelectorAll('[data-dellist]').forEach(b=> b.onclick=async ()=>{ if(!confirm('이 과제 목록을 삭제할까요? (이미 학급에 부여된 과제는 그대로 남아요)')) return;
      const lid=b.dataset.dellist;
      /* 이 목록으로 돌고 있는 빙고가 있으면 학생 화면에서도 내린다 */
      for(const c of DB.classes){
        const live=await sGet(bingoKey(c.id), null);
        if(live && live.listId===lid) await bingoCloseGame(c.id);
      }
      DB.lists=DB.lists.filter(x=>x.id!==lid); await sSet(KEYS.lists,DB.lists); render(); });
    el.querySelectorAll('[data-revoke]').forEach(b=> b.onclick=async ()=>{
      const [lid,cid]=b.dataset.revoke.split('|');
      const c=DB.classes.find(x=>x.id===cid);
      const targets=DB.assignments.filter(a=>a.listId===lid && a.classId===cid);
      if(!targets.length) return;
      const hasBingo=targets.some(a=>a.mode==='bingo');
      if(!confirm(`'${c?c.name:'이 학급'}'에서 이 과제 배부를 취소할까요?\n학생들이 더 이상 볼 수 없고, 진행 기록도 함께 지워져요.${
        hasBingo? '\n진행 중인 빙고 게임이 있으면 학생 화면에서 함께 내려가요.' : ''} (보관함 목록은 그대로 남아요)`)) return;
      b.disabled=true; b.textContent='…';
      if(c){ for(const a of targets){ for(const s of c.students){ await sDel(progKey(a.id, s.id)); } } }
      const ids=new Set(targets.map(a=>a.id));
      /* 빙고를 취소하면 돌고 있는 게임도 같이 내린다 (안 그러면 학생 태블릿에 그대로 남는다) */
      if(hasBingo){
        const live=await sGet(bingoKey(cid), null);
        if(live && (ids.has(live.asgId) || live.listId===lid)) await bingoCloseGame(cid);
      }
      DB.assignments=DB.assignments.filter(a=>!ids.has(a.id));
      await sSet(KEYS.assignments, DB.assignments);
      toast('배부를 취소했어요'); render();
    });
  };
  const s=$('libSearch'); if(s) s.addEventListener('input',e=>{ curQ=e.target.value.trim(); render(); });
  app.querySelectorAll('.lib-g').forEach(ch=> ch.onclick=()=>{ curGrade=ch.dataset.g; curQ=''; const sb=$('libSearch'); if(sb) sb.value='';
    app.querySelectorAll('.lib-g').forEach(x=>x.classList.toggle('on', x===ch)); render(); });
  render();
}
/* 보관함 목록 = 하나의 원본. 여기서 쓰기·말하기·듣기 빙고·카드 미션 무엇이든 만들 수 있다.
   그림(이모지)과 이 목록에 딸린 카드 미션 설정(대화문·인원)도 함께 따라온다. */
function loadListIntoDraft(listId, mode){
  const l=DB.lists.find(x=>x.id===listId); if(!l) return;
  draft = { items: l.items.map(i=>({ id:uid(), text:i.text, meaning:i.meaning||'', type:i.type, sel:true,
              emoji:i.emoji||'', emojiAuto:!i.emoji, emojiFor:i.text })),   /* 지정해 둔 그림은 그대로 지킨다 */
            repeat: 3, classIds:[], sourceListId:l.id, mode: mode || 'write',
            loadMeta:{ grade:l.grade||'', unit:l.unit||'', lesson:l.lesson||'', title:l.name||'' } };
  const ms = mgSetOfList(l);
  if(ms){                                  /* 이 낱말로 만든 카드 미션이 있으면 대화문·인원을 그대로 이어 쓴다 */
    draft.mingle={ id:ms.id, pub:ms.pub||MG_PUBS[0], goal:ms.goal, cap:ms.cap,
      lines:(ms.lines||[]).map((x,i)=>({ role:x.role||(i%2?'B':'A'), en:x.en, ko:x.ko||'' })) };
    if(mode==='mingle') draft.classIds=(ms.classIds||[]).slice();
  }
  const bs = bdSetOfList(l);
  if(bs){                                  /* 이 낱말로 만든 보드게임이 있으면 인원·말판을 그대로 이어 쓴다 */
    draft.board={ id:bs.id, players:bs.players, size:bs.size||bs.tiles.length, tiles:bs.tiles.slice() };
    if(mode==='board') draft.classIds=(bs.classIds||[]).slice();
  }
  const gs = ldSetOfList(l);
  if(gs){                                  /* 이 낱말로 만든 땅따먹기가 있으면 판을 그대로 이어 쓴다 */
    draft.land={ id:gs.id, players:gs.players, n:gs.n, cells:gs.cells.map(c=>({i:c.i})) };
    if(mode==='land') draft.classIds=(gs.classIds||[]).slice();
  }
  assignmentForm();
  const what={ write:'쓰기', speak:'말하기', bingo:'듣기 빙고', mingle:'카드 미션', board:'보드게임',
               land:'땅따먹기', balance:'밸런스 게임' }[draft.mode];
  toast(`낱말을 불러왔어요 📋 ${what? '· '+what+'로 만들기':''}`);
}
/* 이 목록으로 만든 카드 미션 찾기 — 연결이 없는 옛 세트는 학년+제목으로 맞춰 본다 */
function mgSetOfList(l){
  if(!l) return null;
  if(l.mingleId){ const s=mgSet(l.mingleId); if(s) return s; }
  const key=listMatchKey(l.grade,'',l.name);
  return (DB.mingle||[]).find(s=> s.listId===l.id || listMatchKey(s.grade,'',s.title)===key) || null;
}
/* 이 목록으로 만든 보드게임 찾기 */
function bdSetOfList(l){
  if(!l) return null;
  if(l.boardId){ const s=bdSet(l.boardId); if(s) return s; }
  const key=listMatchKey(l.grade,'',l.name);
  return (DB.board||[]).find(s=> s.listId===l.id || listMatchKey(s.grade,'',s.title)===key) || null;
}
function listOfBdSet(s){
  if(!s) return null;
  if(s.listId){ const l=DB.lists.find(x=>x.id===s.listId); if(l) return l; }
  const key=listMatchKey(s.grade,'',s.title);
  return DB.lists.find(l=> l.boardId===s.id || listMatchKey(l.grade,'',l.name)===key) || null;
}
/* 이 목록으로 만든 땅따먹기 찾기 */
function ldSetOfList(l){
  if(!l) return null;
  if(l.landId){ const s=ldSet(l.landId); if(s) return s; }
  const key=listMatchKey(l.grade,'',l.name);
  return (DB.land||[]).find(s=> s.listId===l.id || listMatchKey(s.grade,'',s.title)===key) || null;
}
function listOfLdSet(s){
  if(!s) return null;
  if(s.listId){ const l=DB.lists.find(x=>x.id===s.listId); if(l) return l; }
  const key=listMatchKey(s.grade,'',s.title);
  return DB.lists.find(l=> l.landId===s.id || listMatchKey(l.grade,'',l.name)===key) || null;
}
/* 이 카드 미션이 쓰는 보관함 목록 찾기 (반대 방향) */
function listOfMgSet(s){
  if(!s) return null;
  if(s.listId){ const l=DB.lists.find(x=>x.id===s.listId); if(l) return l; }
  const key=listMatchKey(s.grade,'',s.title);
  return DB.lists.find(l=> l.mingleId===s.id || listMatchKey(l.grade,'',l.name)===key) || null;
}
/* 만들어 둔 카드 미션 목록 — 듣기 빙고와 같은 자리(과제 만들기)에서 고치고 다시 배부한다 */

        <button class="btn ghost sm" data-mgdel="${esc(s.id)}">삭제</button>
      </div>
      ${(()=>{ const l=listOfMgSet(s); return l? `
      <p class="muted" style="font-size:.82rem; margin:0 0 6px">📚 같은 낱말로 다른 활동 만들기</p>

      </div>`
      : `<p class="muted" style="font-size:.82rem; margin:0">📚 이 미션을 한 번 저장하면 낱말이 보관함에도 들어가서,
           쓰기·말하기·듣기 빙고로 그대로 다시 쓸 수 있어요.</p>`; })()}
    </div>`).join('');
  el.querySelectorAll('[data-mgload]').forEach(b=> b.onclick=()=> loadMingleIntoDraft(b.dataset.mgload));
  el.querySelectorAll('[data-mguse]').forEach(b=> b.onclick=()=>{

  el.querySelectorAll('[data-mgdel]').forEach(b=> b.onclick=async ()=>{
    const s=mgSet(b.dataset.mgdel); if(!s) return;
    if(!confirm(`'${s.title}' 카드 미션을 지울까요?\n학생들이 더 이상 볼 수 없고, 진행 기록도 보이지 않아요.`)) return;
    b.disabled=true; b.textContent='삭제 중...';
    const list=(DB.mingle||[]).filter(x=>x.id!==s.id);
    const ok=await sSet(KEYS.mingle, list);

/* ============================ ASSIGNMENT FORM ============================ */
let draft = null;
// 학급 이름에서 학년 숫자 추출 ("4학년 2반"→4, "4-2"→4)
function gradeNum(s){
  s=String(s||'');
  let m=s.match(/([1-6])\s*학년/); if(m) return m[1];
  m=s.match(/(?:^|[^0-9])([1-6])(?:[^0-9]|$)/); return m? m[1] : null;
}
function classesForGrade(grade){
  const g=(grade||'').trim();
  if(!g) return { list:DB.classes.slice(), all:true };
  const gn=gradeNum(g);
  const list=DB.classes.filter(c=> (c.name||'').includes(g) || (gn && gradeNum(c.name)===gn));
  if(!list.length) return { list:DB.classes.slice(), all:true, none:true };
  return { list, all:false };
}
function renderClassPick(){
  const wrap=$('clsPick'); if(!wrap) return;
  const note=$('clsNote');
  if(!DB.classes.length){ wrap.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="em">🏫</span>아직 학급이 없어요. 먼저 학급을 만들어 주세요.</div>'; if(note) note.textContent=''; return; }
  const grade=($('aGrade')&&$('aGrade').value.trim())||'';
  const {list, none}=classesForGrade(grade);
  const visible=new Set(list.map(c=>c.id));
  draft.classIds=(draft.classIds||[]).filter(id=>visible.has(id));
  wrap.innerHTML = list.map(c=>`<div class="tile cls-tile ${draft.classIds.includes(c.id)?'on':''}" data-cls="${c.id}">
      <span class="emoji">🏫</span><div class="t">${esc(c.name)}</div><div class="s">${c.students.length}명</div></div>`).join('');
  if(note) note.textContent = !grade ? '학년을 입력하면 해당 학년 학급만 보여요.'
    : none ? `'${grade}' 학급을 찾지 못해 전체 학급을 보여줘요.`
    : `'${grade}' 학급만 보여주는 중이에요 ✨`;
  wrap.querySelectorAll('.cls-tile').forEach(t=> t.onclick=()=>{ const id=t.dataset.cls;
    if(draft.classIds.includes(id)){ draft.classIds=draft.classIds.filter(x=>x!==id); t.classList.remove('on'); }
    else { draft.classIds.push(id); t.classList.add('on'); } });
}

  draft = draft || { items:[], repeat:3, classIds:[], mode:'write' };
  if(!draft.classIds) draft.classIds=[];
  if(!draft.mode) draft.mode='write';
  mgSaveArm=false;                       /* '한 번 더 눌러 주세요' 상태는 화면을 새로 열 때마다 푼다 */
  app.innerHTML = `

function detectType(t){ return /\s/.test(t.trim()) ? 'sentence' : 'word'; }
// 영어와 뜻 분리: 탭, '=', ' / ' 순으로 첫 구분자에서 나눔
function splitMeaning(line){
  let en=line, meaning='';
  let idx=line.indexOf('\t');
  if(idx<0){ idx=line.indexOf('='); }
  if(idx<0){ idx=line.indexOf(' / '); if(idx>=0){ en=line.slice(0,idx); meaning=line.slice(idx+3); return {en:en.trim(), meaning:meaning.trim()}; } }
  if(idx>=0){ en=line.slice(0,idx); meaning=line.slice(idx+1); }
  return { en:en.trim(), meaning:meaning.trim() };
}
/* 그림 목록(듣기 빙고 칸 / 카드 미션 카드)은 항목이 바뀔 때마다 같이 갱신한다 */
function asgSyncBingo(){
  if(!draft) return;
  if(draft.mode==='bingo' && window.__renderBingoBox) window.__renderBingoBox();
  if(draft.mode==='mingle' && window.__renderMingleCards) window.__renderMingleCards();
  if(draft.mode==='board' && window.__renderBoardCards) window.__renderBoardCards();
  if(draft.mode==='land' && window.__renderLandCards) window.__renderLandCards();
}
/* 이 낱말이 다른 활동에도 쓰이고 있으면 알려 준다 — 낱말은 하나인데 활동은 여럿이기 때문 */
function renderLinkNote(){
  const box=$('linkNote'); if(!box || !draft) return;
  const l = draft.sourceListId ? DB.lists.find(x=>x.id===draft.sourceListId) : null;
  const ms = (draft.mingle && draft.mingle.id) ? mgSet(draft.mingle.id) : mgSetOfList(l);
  const asgModes = l ? new Set(DB.assignments.filter(a=>a.listId===l.id).map(a=>a.mode||'write')) : new Set();
  const spots=[];
  if(asgModes.has('write')) spots.push('✏️ 쓰기');
  if(asgModes.has('speak')) spots.push('🗣️ 말하기');
  if(asgModes.has('bingo') || (l&&l.bingo)) spots.push('👂 듣기 빙고');
  if(ms) spots.push(`🃏 카드 미션 「${esc(ms.title)}」`);
  const bs = (draft.board && draft.board.id) ? bdSet(draft.board.id) : bdSetOfList(l);
  if(bs) spots.push(`🎲 보드게임 「${esc(bs.title)}」`);
  const gs = (draft.land && draft.land.id) ? ldSet(draft.land.id) : ldSetOfList(l);
  if(gs) spots.push(`🚩 땅따먹기 「${esc(gs.title)}」`);
  if(!spots.length){ box.innerHTML=''; return; }
  const warn = (ms && draft.mode!=='mingle') || (bs && draft.mode!=='board') || (gs && draft.mode!=='land');
  box.innerHTML = `<div class="mg-note" style="margin:0 0 12px">
    📚 이 낱말은 <b>${spots.join('</b>, <b>')}</b> 에도 쓰이고 있어요.
    ${warn? `<br><span style="font-size:.85rem">여기서 낱말을 고치면 보관함은 바뀌지만
      <b>${[ms&&draft.mode!=='mingle'?'카드 미션의 카드':'', bs&&draft.mode!=='board'?'보드게임의 말판':'',
             gs&&draft.mode!=='land'?'땅따먹기의 땅':''].filter(Boolean).join(' · ')}은 그대로</b>예요.

/* 라운드 수·보기 수를 바꿔도 정답표가 어긋나지 않게 길이와 값을 맞춘다 */
function blFitAnswers(q){
  const n=Math.max(1, q.rounds||1), k=Math.max(2, Math.min(4, q.choices||4));
  const a=(q.answers||[]).slice(0,n);
  while(a.length<n) a.push(1);
  q.answers=a.map(v=> (v>=1 && v<=k) ? v : 1);
  return q.answers;
}

        `<button class="bl-kb ${v===x+1?'on':''}" data-ka="${r}|${x+1}">${BL_NUM[x]}</button>`).join('')}</div>
    </div>`).join('');
  box.querySelectorAll('[data-ka]').forEach(b=> b.onclick=()=>{
    const [r,v]=b.dataset.ka.split('|').map(Number);
    q.answers[r]=v;

  draw();
}
/* 이미 만든 미션을 고치는 중인지에 따라 저장 버튼 이름이 달라진다 *//* 이미 만든 미션을 고치는 중인지에 따라 저장 버튼 이름이 달라진다 */
function mgSaveLabel(){
  return (draft && draft.mingle && draft.mingle.id)
    ? '🃏 고친 내용 저장하기' : '🃏 선택한 학급에 카드 미션 배부하기';
}
/* 카드 미션 — 대화문 줄. 글자를 칠 때는 다시 그리지 않는다(커서가 튄다). */
function mgLinesDraw(){
  const box=$('mgLines'); if(!box || !draft || !draft.mingle) return;
  const m=draft.mingle;
  box.innerHTML = m.lines.map((l,i)=>`
    <div class="mg-drow">
      <button class="mg-rb ${l.role}" data-lrole="${i}" title="말하는 사람 바꾸기">${l.role}</button>
      <input type="text" data-len="${i}" placeholder="영어 문장 (빈칸은 ___)" value="${esc(l.en)}">
      <input type="text" data-lko="${i}" placeholder="한국어 뜻" value="${esc(l.ko)}">
      <button class="del" data-ldel="${i}" title="문장 지우기">✕</button>
    </div>`).join('');
  box.querySelectorAll('[data-len]').forEach(el=> el.oninput=()=> m.lines[+el.dataset.len].en=el.value);
  box.querySelectorAll('[data-lko]').forEach(el=> el.oninput=()=> m.lines[+el.dataset.lko].ko=el.value);
  box.querySelectorAll('[data-ldel]').forEach(el=> el.onclick=()=>{ m.lines.splice(+el.dataset.ldel,1); mgLinesDraw(); });
  box.querySelectorAll('[data-lrole]').forEach(el=> el.onclick=()=>{
    const l=m.lines[+el.dataset.lrole];
    l.role = l.role==='A' ? 'B' : 'A';
    el.textContent=l.role; el.className='mg-rb '+l.role;
  });
}
/* 카드 미션 — 체크한 낱말마다 카드 그림 한 줄 (듣기 빙고와 같은 고르기 UI, 추천은 한글 뜻까지 본다) */
function renderMingleCards(){
  const wrap=$('mgEmoWrap'); if(!wrap || !draft) return;
  const chosen=draft.items.filter(i=>i.sel && (i.text||'').trim());
  chosen.forEach(i=>{
    if(!i.emoji || (i.emojiAuto!==false && i.emojiFor!==i.text)){
      i.emoji = mgSuggest(i.text, i.meaning)[0] || '-'; i.emojiAuto=true; i.emojiFor=i.text;
    }
  });
  wrap.innerHTML = chosen.length
    ? `<div id="mgEmoRows">${emojiRowsHTML(chosen)}</div>
       <p class="muted" style="margin-top:8px">${chosen.length<2
         ? '⚠️ 주제 카드가 <b>2종 이상</b>이어야 미션을 만들 수 있어요.'
         : `주제 카드 ${chosen.length}종`}</p>`
    : '<p class="muted">② 에서 낱말을 먼저 골라 주세요.</p>';
  const rows=$('mgEmoRows');
  if(rows) emojiRowsBind(rows, chosen, renderMingleCards, i=> mgSuggest(i.text, i.meaning).slice(0,4));
}
/* 빈 칸(영어를 안 쓴 줄)은 저장 대상에서 뺀다 — 항상 빈 줄 하나를 띄워 두기 때문 */
function asgTrimItems(){ draft.items=draft.items.filter(i=>(i.text||'').trim()); }

function asgAddItem(focus){
  draft.items.push({ id:uid(), text:'', meaning:'', type:'word', sel:true });
  renderItemList();
  if(focus!==false){ const rows=$('itemList').querySelectorAll('input.en'); const last=rows[rows.length-1]; if(last) last.focus(); }
}

/* 항목 목록 — 한 줄이 낱말 하나. 카드 미션 편집기와 같이 칸에 바로 고쳐 쓴다.
   글자를 칠 때는 다시 그리지 않는다(커서가 튄다). 모델만 고치고 칸을 나갈 때 갱신한다. */
function renderItemList(){
  const list=$('itemList');
  if(!draft.items.length) draft.items.push({ id:uid(), text:'', meaning:'', type:'word', sel:true });
  list.innerHTML = draft.items.map(i=>`
    <div class="asg-row ${i.sel?'':'off'}" data-row="${i.id}">
      <input type="checkbox" data-sel="${i.id}" ${i.sel?'checked':''} title="학생에게 낼 항목">
      <span class="ty" data-ty="${i.id}">${(i.text||'').trim()? (i.type==='word'?'낱말':'문장') : '–'}</span>
      <input class="en" type="text" data-itext="${i.id}" placeholder="영어 (예: pizza / I like apples.)" value="${esc(i.text)}">
      <input type="text" data-imean="${i.id}" placeholder="한글 뜻 (예: 피자)" value="${esc(i.meaning||'')}">
      <button class="del" data-deli="${i.id}" title="이 줄 지우기">✕</button>
    </div>`).join('');
  const find=id=> draft.items.find(x=>x.id===id);

  list.querySelectorAll('[data-itext]').forEach(el=> {
    const it=find(el.dataset.itext);
    el.oninput=()=>{ it.text=el.value; it.type=detectType(el.value);
      const ty=list.querySelector(`[data-ty="${it.id}"]`);
      if(ty) ty.textContent = it.text.trim()? (it.type==='word'?'낱말':'문장') : '–'; };
    el.onchange=asgSyncBingo;                       /* 칸을 나갈 때 빙고 그림을 다시 맞춘다 */
    el.onkeydown=e=>{ if(e.key!=='Enter') return; e.preventDefault();
      const m=list.querySelector(`[data-imean="${it.id}"]`); if(m) m.focus(); };
  });
  list.querySelectorAll('[data-imean]').forEach(el=> {
    const it=find(el.dataset.imean);
    el.oninput=()=>{ it.meaning=el.value; };
    el.onchange=asgSyncBingo;
    el.onkeydown=e=>{ if(e.key!=='Enter') return; e.preventDefault();
      const idx=draft.items.indexOf(it);
      if(idx===draft.items.length-1) asgAddItem();   /* 마지막 줄에서 엔터 = 다음 줄 만들기 */
      else { const nx=list.querySelector(`[data-itext="${draft.items[idx+1].id}"]`); if(nx) nx.focus(); } };
  });
  list.querySelectorAll('[data-sel]').forEach(c=> c.onchange=()=>{
    const it=find(c.dataset.sel); it.sel=c.checked;
    const row=list.querySelector(`[data-row="${it.id}"]`); if(row) row.classList.toggle('off', !it.sel);
    asgSyncBingo(); });
  list.querySelectorAll('[data-deli]').forEach(b=> b.onclick=()=>{
    draft.items=draft.items.filter(x=>x.id!==b.dataset.deli); renderItemList(); asgSyncBingo(); });
}

/* 교과서·엑셀에서 여러 개를 한 번에 가져올 때만 쓰는 보조 칸 — 붙여넣으면 한 줄씩 칸으로 흩어진다 */
function asgPasteToggle(){
  const area=$('pasteArea');
  if(area.style.display!=='none'){ area.style.display='none'; area.innerHTML=''; return; }
  area.style.display='';
  area.innerHTML=`
    <div class="hr"></div>
    <label>여러 개를 한꺼번에 가져오기 — 한 줄에 하나씩 붙여넣으면 <b>낱말마다 한 칸씩</b> 만들어져요.<br>
      <span class="muted" style="font-size:.82rem">(<b>영어 = 뜻</b> 형식. 구분 기호는 <b>=</b> 또는 <b>/</b> 또는 엑셀에서 복사한 탭)</span></label>
    <textarea id="bulkBox" placeholder="red = 빨강&#10;blue = 파랑&#10;I like apples. = 나는 사과를 좋아해."></textarea>
    <button class="btn sm" id="bulkAdd" style="margin-top:8px">칸으로 옮기기</button>`;
  $('bulkAdd').onclick=()=>{
    const lines=$('bulkBox').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length){ toast('내용을 입력하세요'); return; }
    asgTrimItems();
    let n=0;
    lines.forEach(line=>{ const {en,meaning}=splitMeaning(line); if(!en) return;
      draft.items.push({id:uid(), text:en, meaning, type:detectType(en), sel:true}); n++; });
    renderItemList(); asgSyncBingo(); asgPasteToggle();
    toast(`${n}개를 칸으로 옮겼어요`);
  };
}
async function saveAssignment(){
  const title=$('aTitle').value.trim() || '영어 과제';
  const isBingo = draft.mode==='bingo';
  asgTrimItems();                                   /* 빈 칸은 빼고 배부한다 */
  const items=draft.items.slice();                  /* 다시 그리면 빈 칸 한 줄이 새로 생기므로 먼저 떠 둔다 */
  renderItemList();
  /* 밸런스 게임은 문제를 PPT로 내므로 낱말이 없어도 배부할 수 있다 — 낱말 검사보다 먼저 처리한다 */
  if(draft.mode==='balance'){
    return saveBalanceSet({ grade:$('aGrade').value.trim(), unit:$('aUnit').value.trim(),
                            lesson:$('aLesson').value.trim(), title });
  }
  const chosen = items.filter(i=>i.sel).map(i=>({id:i.id,text:i.text.trim(),meaning:(i.meaning||'').trim(),type:i.type,emoji:i.emoji||''}));
  if(!chosen.length){ toast('제시할 항목을 1개 이상 선택하세요'); return; }
  if(isBingo && chosen.length<3){ toast('빙고는 표현이 3개 이상이어야 해요'); return; }
  const grade=$('aGrade').value.trim(), unit=$('aUnit').value.trim(), lesson=$('aLesson').value.trim();
  /* 카드 미션은 과제(assignments)가 아니라 미션 세트로 저장된다 — 배부 학급도 세트가 들고 있다 */
  if(draft.mode==='mingle'){ return saveMingleSet(items, chosen, { grade, unit, lesson, title }); }
  if(draft.mode==='board'){ return saveBoardSet(items, chosen, { grade, unit, lesson, title }); }
  if(draft.mode==='land'){ return saveLandSet(items, chosen, { grade, unit, lesson, title }); }
  if(!draft.classIds.length){ toast('배부할 학급을 1개 이상 선택하세요'); return; }
  if(isBingo && draft.bingo.target>draft.bingo.n){ toast(`${draft.bingo.n}×${draft.bingo.n} 판에서는 ${draft.bingo.n}빙고까지 가능해요`); return; }
  const listId = await saveListToLibrary({ grade, unit, lesson, title, sourceListId:draft.sourceListId }, items, {silent:true});
  if(isBingo){                       /* 보관함에서도 빙고용으로 구분되게 */
    const l=DB.lists.find(x=>x.id===listId);
    if(l){ l.bingo=true; l.updatedAt=Date.now(); await sSet(KEYS.lists, DB.lists); }
  }
  const modes = draft.mode==='both' ? ['write','speak'] : [draft.mode||'write'];
  const now=Date.now(); let k=0;
  draft.classIds.forEach((classId)=>{
    modes.forEach((md)=>{
      const a={ id:uid(), classId, listId, title, grade, unit, lesson, mode:md,
        items:chosen.map(c=>({...c})), repeat:draft.repeat, createdAt:now + (k++) };
      if(md==='bingo') a.bingo={...draft.bingo};    /* 판 크기·목표·자동 진행을 과제에 저장 */
      DB.assignments.push(a);
    });
  });
  await sSet(KEYS.assignments, DB.assignments);
  const n=draft.classIds.length;
  draft=null;
  toast(isBingo? `${n}개 학급에 빙고를 배부했어요! 👂` : `${n}개 학급에 과제를 배부했어요! 🎉`);
  createAssignment();
}

/* 카드 미션 배부 — ②의 낱말이 주제 카드, ③의 설정이 대화문·인원, ④가 배부 학급이 된다.
   저장 형식은 예전 '미션 세트 만들기'와 똑같아서 학생 화면·현황판은 손댈 것이 없다. */
async function saveMingleSet(items, chosen, meta){
  const m = draft.mingle || {};
  const title = meta.title;
  const cards = chosen.map(i=>({ en:i.text, ko:i.meaning||'',
    em: (i.emoji && i.emoji!=='-') ? i.emoji : (mgSuggest(i.text, i.meaning)[0] || '🃏') }));
  const lines = (m.lines||[]).map(l=>({ role:l.role||'A', en:(l.en||'').trim(), ko:(l.ko||'').trim() })).filter(l=>l.en);
  const goal=+m.goal, cap=+m.cap;
  const classIds=(draft.classIds||[]).filter(id=> DB.classes.some(c=>c.id===id));

  if(cards.length<2 || !lines.length){
    mgSaveArm=false; return mgMsg('⚠️ ②에서 <b>주제 카드 2종 이상</b>을 고르고, <b>대화문을 1문장 이상</b> 채워 주세요.'); }
  if(!classIds.length){
    mgSaveArm=false; return mgMsg('⚠️ ④에서 이 미션을 받을 <b>학급을 한 곳 이상</b> 골라 주세요.'); }
  if(!goal || goal<2 || goal>25){
    mgSaveArm=false; return mgMsg('⚠️ 만날 친구 수는 2~25명 사이로 정해 주세요.'); }
  if(goal<cards.length){
    mgSaveArm=false; return mgMsg(`⚠️ 모든 카드에 최소 1명씩 배정되므로, 만날 친구 수는 카드 수(${cards.length}명) 이상이어야 해요.`); }
  if(goal>cards.length*cap){
    mgSaveArm=false;
    return mgMsg(`⚠️ 지금 설정으로는 카드 ${cards.length}종 × 최대 ${cap}명 = <b>${cards.length*cap}명</b>까지만 가능해요.<br>
      👉 '카드당 최대 인원'을 <b>${Math.ceil(goal/cards.length)} 이상</b>으로 올리거나 카드를 늘려 주세요.`); }

  const prev = m.id ? mgSet(m.id) : null;
  /* 카드·인원이 바뀌면 예전 배정은 더 이상 맞지 않는다 → ver를 올려 학생이 다시 뽑게 한다.
     제목이나 대화문만 고칠 때는 ver를 그대로 두어 진행 중인 기록을 지킨다 */
  const reset = !!prev && (prev.goal!==goal || prev.cap!==cap ||
                           JSON.stringify(prev.cards)!==JSON.stringify(cards));
  /* 중복 도장 금지라 '만날 친구 수'가 반 인원 − 1보다 많으면 아무도 끝낼 수 없다 */
  const small=DB.classes.filter(c=> classIds.includes(c.id) && c.students.length-1 < goal);
  const warns=[];
  if(reset) warns.push(`카드나 인원이 바뀌었어요. 배부하면 <b>이미 시작한 학생의 카드와 도장이 초기화</b>되고
    다음에 들어올 때 새로 뽑게 됩니다.`);
  if(small.length) warns.push(`${small.map(c=>`<b>${esc(c.name)}</b>(${c.students.length}명)`).join(', ')}
    은 만날 수 있는 친구가 ${Math.min(...small.map(c=>c.students.length))-1}명뿐이라
    <b>${goal}명을 다 채울 수 없어요.</b> 만날 친구 수를 줄이거나 학생을 더 등록해 주세요.`);
  if(warns.length && !mgSaveArm){
    mgSaveArm=true;
    return mgMsg('⚠️ '+warns.join('<br><br>⚠️ ')+'<br><br>그래도 배부하려면 <b>배부 버튼을 한 번 더</b> 눌러 주세요.');
  }
  mgSaveArm=false;

  /* 낱말은 보관함에도 남겨 두어 쓰기·말하기·듣기 빙고로 그대로 다시 쓸 수 있게 한다 (그림도 함께 저장된다) */
  const listId = await saveListToLibrary({ grade:meta.grade, unit:meta.unit, lesson:meta.lesson, title,
    sourceListId: draft.sourceListId || (prev && prev.listId) || null }, items, {silent:true});

  const rec={ id: m.id || ('m'+uid()), title, grade:meta.grade||'', pub:m.pub||MG_PUBS[0],
    classIds, cards, lines, goal, cap, listId: listId || (prev && prev.listId) || null,
    ver: prev ? ((prev.ver||1) + (reset?1:0)) : 1,
    createdAt: prev ? prev.createdAt : Date.now() };
  const list=(DB.mingle||[]).slice();
  const i=list.findIndex(s=>s.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  const ok=await sSet(KEYS.mingle, list);
  if(!ok) return mgMsg('⚠️ 저장하지 못했어요. 선생님 계정으로 로그인했는지 확인해 주세요.');
  DB.mingle=list;
  /* 목록 쪽에도 되돌아오는 표시를 남긴다 — 보관함에서 이 미션을 바로 이어서 고칠 수 있다 */
  const lrec=DB.lists.find(x=>x.id===listId);
  if(lrec && lrec.mingleId!==rec.id){ lrec.mingleId=rec.id; lrec.updatedAt=Date.now(); await sSet(KEYS.lists, DB.lists); }
  draft=null;
  toast(`${classIds.length}개 학급에 카드 미션을 배부했어요! 🃏`);
  createAssignment();
}

/* 보드게임 배부 — ②의 낱말이 미션 칸, ③의 설정이 인원·칸 수, ④가 배부 학급이 된다.
   낱말·칸 수·인원이 바뀌면 ver를 올려서 이미 열려 있던 모둠 게임을 처음부터 다시 시작하게 한다. */
async function saveBoardSet(items, chosen, meta){
  const b = draft.board || {};
  const title = meta.title;
  const bItems = chosen.map(i=>({ en:i.text, ko:i.meaning||'',
    em:(i.emoji && i.emoji!=='-') ? i.emoji : (mgSuggest(i.text, i.meaning)[0] || '📝') }));
  const players = Math.max(2, Math.min(4, +b.players||2));
  const size = Math.max(12, Math.min(48, +b.size||30));
  const classIds=(draft.classIds||[]).filter(id=> DB.classes.some(c=>c.id===id));

  if(bItems.length<3){
    mgSaveArm=false; return mgMsg('⚠️ ②에서 <b>미션 낱말을 3개 이상</b> 골라 주세요.'); }
  if(!classIds.length){
    mgSaveArm=false; return mgMsg('⚠️ ④에서 이 보드게임을 할 <b>학급을 한 곳 이상</b> 골라 주세요.'); }

  const prev = b.id ? bdSet(b.id) : null;
  const tiles = (b.tiles && b.tiles.length===size) ? b.tiles : bdMakeTiles(bItems, size);
  const reset = !!prev && (prev.players!==players ||
    JSON.stringify(prev.items)!==JSON.stringify(bItems) || JSON.stringify(prev.tiles)!==JSON.stringify(tiles));
  /* 인원보다 학생이 적으면 모둠이 안 만들어진다 */
  const small=DB.classes.filter(c=> classIds.includes(c.id) && c.students.length<2);
  const warns=[];
  if(reset) warns.push(`낱말·말판·인원이 바뀌었어요. 배부하면 <b>진행 중인 모둠 게임이 처음부터</b> 다시 시작됩니다.`);
  if(small.length) warns.push(`${small.map(c=>`<b>${esc(c.name)}</b>(${c.students.length}명)`).join(', ')}
    은 학생이 너무 적어 모둠을 짤 수 없어요. 학생을 더 등록해 주세요.`);
  if(warns.length && !mgSaveArm){
    mgSaveArm=true;
    return mgMsg('⚠️ '+warns.join('<br><br>⚠️ ')+'<br><br>그래도 배부하려면 <b>배부 버튼을 한 번 더</b> 눌러 주세요.');
  }
  mgSaveArm=false;

  /* 낱말은 보관함에도 남겨 두어 쓰기·말하기·듣기 빙고·카드 미션으로 그대로 다시 쓸 수 있게 한다 */
  const listId = await saveListToLibrary({ grade:meta.grade, unit:meta.unit, lesson:meta.lesson, title,
    sourceListId: draft.sourceListId || (prev && prev.listId) || null }, items, {silent:true});

  const rec={ id: b.id || ('b'+uid()), title, grade:meta.grade||'', classIds,
    items:bItems, tiles, players, size, listId: listId || (prev && prev.listId) || null,
    ver: prev ? ((prev.ver||1) + (reset?1:0)) : 1,
    createdAt: prev ? prev.createdAt : Date.now() };
  const list=(DB.board||[]).slice();
  const i=list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  const ok=await sSet(KEYS.board, list);
  if(!ok) return mgMsg('⚠️ 저장하지 못했어요. 선생님 계정으로 로그인했는지 확인해 주세요.');
  DB.board=list;
  const lrec=DB.lists.find(x=>x.id===listId);
  if(lrec && lrec.boardId!==rec.id){ lrec.boardId=rec.id; lrec.updatedAt=Date.now(); await sSet(KEYS.lists, DB.lists); }
  draft=null;
  toast(`${classIds.length}개 학급에 보드게임을 배부했어요! 🎲`);
  createAssignment();
}

/* 땅따먹기 배부 — ②의 낱말이 각 칸, ③의 설정이 인원·판 크기, ④가 배부 학급이 된다. */
async function saveLandSet(items, chosen, meta){
  const g = draft.land || {};
  const title = meta.title;
  const lItems = chosen.map(i=>({ en:i.text, ko:i.meaning||'',
    em:(i.emoji && i.emoji!=='-') ? i.emoji : (mgSuggest(i.text, i.meaning)[0] || '📝') }));
  const players = Math.max(2, Math.min(4, +g.players||2));
  const n = Math.max(4, Math.min(7, +g.n||5));
  const classIds=(draft.classIds||[]).filter(id=> DB.classes.some(c=>c.id===id));

  if(lItems.length<3){
    mgSaveArm=false; return mgMsg('⚠️ ②에서 <b>낱말을 3개 이상</b> 골라 주세요.'); }
  if(!classIds.length){
    mgSaveArm=false; return mgMsg('⚠️ ④에서 이 땅따먹기를 할 <b>학급을 한 곳 이상</b> 골라 주세요.'); }

  const prev = g.id ? ldSet(g.id) : null;
  const cells = (g.cells && g.cells.length===n*n) ? g.cells.map(c=>({i:c.i})) : ldMakeCells(lItems, n).map(c=>({i:c.i}));
  const reset = !!prev && (prev.players!==players || prev.n!==n ||
    JSON.stringify(prev.items)!==JSON.stringify(lItems) ||
    JSON.stringify((prev.cells||[]).map(c=>c.i))!==JSON.stringify(cells.map(c=>c.i)));
  const small=DB.classes.filter(c=> classIds.includes(c.id) && c.students.length<2);
  const warns=[];
  if(reset) warns.push(`낱말·땅·인원이 바뀌었어요. 배부하면 <b>진행 중인 모둠의 땅이 처음부터</b> 다시 시작됩니다.`);
  if(small.length) warns.push(`${small.map(c=>`<b>${esc(c.name)}</b>(${c.students.length}명)`).join(', ')}
    은 학생이 너무 적어 모둠을 짤 수 없어요. 학생을 더 등록해 주세요.`);
  if(warns.length && !mgSaveArm){
    mgSaveArm=true;
    return mgMsg('⚠️ '+warns.join('<br><br>⚠️ ')+'<br><br>그래도 배부하려면 <b>배부 버튼을 한 번 더</b> 눌러 주세요.');
  }
  mgSaveArm=false;

  /* 낱말은 보관함에도 남겨 두어 다른 활동으로 그대로 다시 쓸 수 있게 한다 */
  const listId = await saveListToLibrary({ grade:meta.grade, unit:meta.unit, lesson:meta.lesson, title,
    sourceListId: draft.sourceListId || (prev && prev.listId) || null }, items, {silent:true});

  const rec={ id: g.id || ('g'+uid()), title, grade:meta.grade||'', classIds,
    items:lItems, cells, n, players, listId: listId || (prev && prev.listId) || null,
    ver: prev ? ((prev.ver||1) + (reset?1:0)) : 1,
    createdAt: prev ? prev.createdAt : Date.now() };
  const list=(DB.land||[]).slice();
  const i=list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  const ok=await sSet(KEYS.land, list);
  if(!ok) return mgMsg('⚠️ 저장하지 못했어요. 선생님 계정으로 로그인했는지 확인해 주세요.');
  DB.land=list;
  const lrec=DB.lists.find(x=>x.id===listId);
  if(lrec && lrec.landId!==rec.id){ lrec.landId=rec.id; lrec.updatedAt=Date.now(); await sSet(KEYS.lists, DB.lists); }
  draft=null;
  toast(`${classIds.length}개 학급에 땅따먹기를 배부했어요! 🚩`);
  createAssignment();
}

/* 밸런스 게임 배부 — 문제는 PPT로 내므로 낱말은 저장하지 않는다.
   ③의 설정(보기 수·라운드 수·정답표)과 ④의 배부 학급만 있으면 된다. */
async function saveBalanceSet(meta){
  const q = draft.balance || {};
  const title = meta.title;
  const choices = Math.max(2, Math.min(4, +q.choices||4));
  const rounds = Math.max(1, Math.min(50, +q.rounds||10));
  const fb = q.fb==='now' ? 'now' : 'end';
  const limit = [0,10,15,20,30,45,60].includes(+q.limit) ? +q.limit : 0;
  const answers = blFitAnswers({ choices, rounds, answers:q.answers });
  const classIds=(draft.classIds||[]).filter(id=> DB.classes.some(c=>c.id===id));

  if(!classIds.length){
    mgSaveArm=false; return mgMsg('⚠️ ④에서 이 게임을 할 <b>학급을 한 곳 이상</b> 골라 주세요.'); }

  const prev = q.id ? blSet(q.id) : null;
  const rec={ id: q.id || ('q'+uid()), title, grade:meta.grade||'', classIds,
    choices, rounds, answers, fb, limit,
    ver: prev ? ((prev.ver||1)+1) : 1,
    createdAt: prev ? prev.createdAt : Date.now() };
  const list=(DB.balance||[]).slice();
  const i=list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  const ok=await sSet(KEYS.balance, list);
  if(!ok) return mgMsg('⚠️ 저장하지 못했어요. 선생님 계정으로 로그인했는지 확인해 주세요.');
  DB.balance=list;
  draft=null;
  toast(`${classIds.length}개 학급에 밸런스 게임을 배부했어요! ⚖️`);
  createAssignment();
}

  const persist=async ()=>{ prog.updatedAt=Date.now(); await sSet(progKey(aid,session.studentId), prog); };
  const firstIncomplete=()=>{ for(let i=0;i<a.items.length;i++){ const it=a.items[i]; if((prog.counts[it.id]||0)<a.repeat) return i; } return -1; };

  speakStop();

    <p class="muted" id="spaText" style="margin-top:8px"></p></div>
    <div id="spaItem"></div>`;
  $('spaBack').onclick=()=>{ speakStop(); studentAssignments(); };
  const updateBar=()=>{ const c=overall(); const pct=total?Math.round(c/total*100):0;
    const b=$('spaProg'); if(b) b.style.width=pct+'%'; const t=$('spaText'); if(t) t.textContent=`${c} / ${total} 번 완료 (${pct}%)`; };

  const renderItem=(idx)=>{
    speakStop();
    const it=a.items[idx];
    const area=$('spaItem'); if(!area) return;
