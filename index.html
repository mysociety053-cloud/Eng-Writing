async function balanceRun(setId, cid){
  blLeave();
  const set=blSet(setId), cls=DB.classes.find(c=>c.id===cid);
  if(!set || !cls) return balanceTeacher();
  BL={ role:'teacher', setId, cid, set, sess:null, rows:[], unsubs:[], sound:true, tv:false,
       t:0, tick:0, endAt:0, lim:0, left:0, beeped:99, shown:-1 };
  app.innerHTML=`<button class="back" onclick="balancePickClass('${esc(setId)}')">← 반 고르기</button>
    <div id="blWrap" class="card empty"><span class="em">⏳</span>불러오는 중...</div>`;
  const sess=await sGet(blSKey(setId,cid), null);
  if(!BL || BL.role!=='teacher') return;
  BL.sess = (sess && sess.ver===set.ver) ? sess : null;
  /* 진행 중인 문제로 다시 들어왔으면 남은 시간부터 이어서 잰다 */
  if(BL.sess && BL.sess.status==='playing' && set.limit){
    const rem=Math.ceil(set.limit - (Date.now()-(BL.sess.startedAt||0))/1000);
    if(rem>0) blRunTimer(rem, set.limit);
  }
  blRunWatch();
  blRunDraw();
}
function blRunWatch(){
  if(!BL || !(fbReady && window.__store)) return;
  (BL.unsubs||[]).forEach(u=>{ try{ u(); }catch(e){} }); BL.unsubs=[];
  BL.unsubs.push(window.__store.watch(colName('app'), keyRef(blSKey(BL.setId,BL.cid)).id, (v)=>{
    if(!BL || BL.role!=='teacher') return;
    BL.sess = v || null;
    blRunDraw();
  }));
  if(window.__store.watchWhere){
    BL.unsubs.push(window.__store.watchWhere(colName('progress'), 'value.blKey', BL.setId+'|'+BL.cid, (rows)=>{
      if(!BL || BL.role!=='teacher') return;
      BL.rows=rows||[];
      blRunDraw();                       /* 누가 들어왔는지·몇 명이 답했는지 바로 보인다 */
    }));
  }
}
function blJoined(){                     /* 이번 판에 들어온 학생 */
  const g=BL.sess && BL.sess.id;
  return (BL.rows||[]).filter(r=> r && r.game===g);
}
async function blPut(patch){             /* 진행 상태 고치기 (선생님만) */
  const rec=Object.assign({}, BL.sess||{}, patch, { at:Date.now() });
  const ok=await sSet(blSKey(BL.setId, BL.cid), rec);
  if(!ok) return false;
  BL.sess=rec; blRunDraw();
  return true;
}
async function blOpenLobby(){
  const set=BL.set;

  if(!ok){ if(btn){ btn.disabled=false; btn.textContent='▶️ 대기실 열기'; } return; }
  BL.sess=rec; blRunDraw();
}
async function blGoRound(i){
  blTimerStop();
  if(i>=BL.set.rounds) return blEndGame();
  blRunTimer(BL.set.limit||0);      /* 시계를 먼저 건다 — 안 그러면 화면에 '시간 끝'이 한순간 잘못 뜬다 */
  if(!await blPut({ status:'playing', round:i, startedAt:Date.now() })){ blTimerStop(); return; }
  blGoSound();
}
function blRunTimer(sec, full){          /* 선생님 화면 카운트다운 (소리도 여기서만 난다) */
  BL.sound=true;
  blTimerStart(sec||0, ()=>{ if(BL && BL.role==='teacher') blRunDraw(); }, full);

async function blEndGame(){

    </div>

      ${set.limit? `<div class="bl-timer ${BL.left<=10?'warn':''}" id="blTimer">

    <div class="hr"></div>
    <div class="center" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
      <button class="btn lg coral" id="blNextR">${last? '🏁 끝내고 결과 보기' : '⏭ 다음 문제 시작'}</button>

        <div><label>학급</label><select id="blDCls"></select></div>
      </div>
      <p class="muted" id="blDSub" style="margin:12px 0 0"></p>
      <div id="blDQs" style="margin-top:10px"></div>
    </div>
    <div class="card noanim"><div id="blDList" style="display:flex; flex-direction:column; gap:8px"></div></div>`;
  $('blDSet').onchange=()=>{ BL.setId=$('blDSet').value; blDashClsFill(); blDashWatch(); };
  $('blDCls').onchange=()=>{ BL.cid=$('blDCls').value; blDashWatch(); };
  $('blTv').onclick=()=>{ BL.tv=!BL.tv; app.classList.toggle('mg-tv', BL.tv); mgWide(BL.tv); };
  blDashClsFill();
  blDashWatch();
}
function blDashClsFill(){
  const sel=$('blDCls'); if(!sel || !BL) return;
  const list=blClasses(blSet(BL.setId));
  sel.innerHTML = list.length
    ? list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
    : '<option value="">배부된 학급이 없어요</option>';
  if(!list.some(c=>c.id===BL.cid)) BL.cid = list.length ? list[0].id : null;
  sel.value = BL.cid || '';
}
function blDashWatch(){
  if(!BL) return;
  (BL.unsubs||[]).forEach(u=>{ try{ u(); }catch(e){} }); BL.unsubs=[];
  BL.rows=[]; blDashDraw();
  if(!BL.cid) return;
  if(!(fbReady && window.__store && window.__store.watchWhere)) return;
  BL.unsubs.push(window.__store.watchWhere(colName('progress'), 'value.blKey', BL.setId+'|'+BL.cid,
    (rows)=>{ if(!BL || BL.role!=='dash') return; BL.rows=rows||[]; blDashDraw(); }));
}
function blDashDraw(){
  if(!BL || BL.role!=='dash') return;
  const st=blSet(BL.setId), cls=DB.classes.find(c=>c.id===BL.cid);
  const sub=$('blDSub'), box=$('blDList'), qs=$('blDQs');
  if(!st || !box) return;
  if(!cls){
    if(sub) sub.textContent=''; if(qs) qs.innerHTML='';
    box.innerHTML='<div class="empty"><span class="em">🏫</span>이 게임을 받은 학급이 없어요.<br>과제 만들기에서 학급을 골라 주세요.</div>';
    return;
  }
  const key=blAnswers(st);
  const by={}; BL.rows.forEach(r=>{ if(r && r.sid) by[r.sid]=r; });
  const rows=cls.students.map(s=>{
    const r=by[s.id];
    return { nm:s.name, best: r? (r.best||0) : 0, total: (r && r.rounds) || st.rounds,
             plays: r? (r.plays||0) : 0, picks: (r && r.picks) || [] };
  }).sort((a,b)=> (b.plays? b.best/(b.total||1) : -1)-(a.plays? a.best/(a.total||1) : -1) || a.nm.localeCompare(b.nm,'ko'));
  const played=rows.filter(r=>r.plays>0);
  const avg=played.length ? Math.round(played.reduce((s,r)=>s+r.best/(r.total||1),0)/played.length*100) : 0;
  sub.innerHTML=`${esc(cls.name)} · ${st.choices}개 중 하나 · ${st.rounds}문제 ·
    ${st.limit? `⏱ ${st.limit}초` : '시간 제한 없음'} · 정답 ${esc(blKeyText(st))} ·
    <b>${played.length}</b>명 참여 / ${cls.students.length}명${played.length?` · 평균 정답률 <b>${avg}%</b>`:''}`;
  /* 문항별 정답 인원 — 어느 문제에서 많이 틀렸는지 한눈에 보고 그 자리에서 다시 설명할 수 있다 */
  if(qs) qs.innerHTML = played.length ? `<p class="muted" style="font-size:.82rem; margin:0 0 5px">문항별 맞힌 사람</p>
    <div class="bl-qbar">${key.map((a,i)=>{
      const n=played.filter(r=> (r.picks[i]||0)===a).length;
      const pct=Math.round(n/played.length*100);
      return `<div class="q ${pct>=80?'good':(pct<50?'bad':'')}" title="${i+1}번 · 정답 ${BL_NUM[a-1]}">
        <b>${i+1}</b><span>${n}</span></div>`;
    }).join('')}</div>` : '';
  box.innerHTML = cls.students.length ? rows.map(r=>{
    const pct=r.plays? Math.min(100, r.best/(r.total||1)*100) : 0;
    const perfect=r.plays>0 && r.best>=r.total;
    return `<div class="mg-row${perfect?' done':''}">
      <div class="nm">${perfect?'🏆 ':''}${esc(r.nm)}</div>
      <div class="cd">${r.plays? (r.plays+'판') : '—'}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="ct">${r.plays? (r.best+'/'+r.total) : '아직'}</div></div>`;
  }).join('') : '<div class="empty">이 학급에는 학생이 없어요.</div>';
}

/* ============================ 학생 — 번호만 고르기 ============================ */
async function balanceStudent(){
  blLeave(); bingoLeave(); mingleLeave(); bdLeave(); ldLeave();
  session.role='student'; refreshWho();
  BL={ role:'student', setId:null, set:null, sess:null, me:null, unsubs:[], sound:false,

      아직 열린 밸런스 게임이 없어요.<br>선생님이 <b>미션 활동 → 밸런스 게임</b>에서 대기실을 열면 바로 나와요!
      <div class="center" style="margin-top:12px"><button class="btn ghost sm" onclick="balanceStudent()">🔄 다시 확인</button></div></div>`;
    return;
  }
  if(open.length>1){
    wrap.outerHTML=`<div id="blWrap" class="card">
      <h2 style="margin-top:4px">⚖️ 어느 게임에 들어갈까요?</h2>
      <div class="grid-cards" style="margin-top:12px">${open.map(o=>`
        <div class="tile" data-blpick="${esc(o.set.id)}"><span class="emoji">⚖️</span>
          <div class="t">${esc(o.set.title)}</div>
          <div class="s">${o.set.choices}개 중 하나 · ${o.set.rounds}문제</div></div>`).join('')}</div></div>`;
    app.querySelectorAll('[data-blpick]').forEach(el=> el.onclick=()=> blJoin(el.dataset.blpick));

function balanceStudentQuit(){ blLeave(); studentPickName(session.classId); }

async function blJoin(setId){
  const set=blSet(setId); if(!set) return;
  BL.setId=setId; BL.set=set;
  const saved=await sGet(blPKey(setId, session.classId, session.studentId), null);
  if(!BL || BL.role!=='student') return;
  BL.me=saved;
  if(fbReady && window.__store){
    BL.unsubs.push(window.__store.watch(colName('app'), keyRef(blSKey(setId, session.classId)).id, (v)=>{
      if(!BL || BL.role!=='student') return;
      BL.sess=v||null; blStuSync();
    }));
  } else {
    BL.sess=await sGet(blSKey(setId, session.classId), null); blStuSync();
  }
}
/* 진행 상태가 바뀔 때마다 — 새 판이면 답을 비우고, 새 문제가 열리면 시계를 다시 잰다 */
function blStuSync(){
  const s=BL.sess, set=BL.set;
  if(!s){ blTimerStop(); BL.seen=-2; return blStuDraw(); }
  if(!BL.me || BL.me.game!==s.id){
    BL.me={ blKey:set.id+'|'+session.classId, game:s.id, setId:set.id,
      sid:session.studentId, sname:session.name, rounds:set.rounds,
      picks:new Array(set.rounds).fill(0),
      correct:0, best:(BL.me&&BL.me.best)||0, plays:(BL.me&&BL.me.plays)||0, at:Date.now() };
    blSaveMe();                          /* 들어왔다는 것을 선생님 화면에 알린다 */
  }
  if(s.status==='playing' && s.round!==BL.seen){
    BL.seen=s.round; BL.lock=false;
    BL.sound=false;                      /* 소리는 선생님 기기에서만 */
    blTimerStart(set.limit||0, ()=>{ if(BL && BL.role==='student'){ BL.lock=true; blStuDraw(); } });
  }
  if(s.status!=='playing'){ blTimerStop(); BL.seen=-2; }
  if(s.status==='done') blStuFinish();
  blStuDraw();
}
async function blSaveMe(){
  if(!BL || !BL.me) return;
  BL.me.at=Date.now();
  await sSet(blPKey(BL.set.id, session.classId, session.studentId), BL.me);
}
function blAnswer(v){
  if(!BL || BL.role!=='student' || BL.lock) return;
  const s=BL.sess;
  if(!s || s.status!=='playing') return;
  BL.me.picks[s.round]=v;
  blStuDraw();
  blSaveMe();
}
/* 선생님이 끝내면 — 점수를 세어 화면에 보여주고, 이 판의 결과를 한 번만 저장한다 */
async function blStuFinish(){
  if(!BL || !BL.me) return;
  if(BL.me.doneGame===BL.sess.id) return;
  const ok=blScore(BL.set, BL.me.picks);
  BL.me.doneGame=BL.sess.id;
  BL.me.correct=ok;
  BL.me.best=Math.max(ok, BL.me.best||0);
  BL.me.plays=(BL.me.plays||0)+1;
  await blSaveMe();
  if(ok>=BL.set.rounds) mgConfetti();
}

    const msg  = pct===100? '한 문제도 안 틀렸어요! 최고예요!'
               : pct>=80 ? '아주 잘했어요!' : pct>=60 ? '잘했어요!' : '괜찮아요. 다음에 더 잘할 수 있어요!';
    wrap.className='card center';
    wrap.innerHTML=`
      <div style="font-size:3.4rem">${face}</div>
      <h2 style="margin:6px 0">${total}문제 중 <span style="color:var(--green-d)">${ok}개</span> 맞혔어요!</h2>
      <div class="bl-score">${ok} / ${total} <span class="muted" style="font-size:1rem">(${pct}%)</span></div>

      <div class="bl-result">${key.map((a,i)=>{

          <span class="mine">${p? BL_NUM[p-1] : '–'}</span>

      }).join('')}</div>

  const showAns = BL.lock && set.fb==='now';
  const foot = BL.lock
    ? (showAns ? undefined : '⏰ 시간이 끝났어요. 다음 문제를 기다려요')
    : undefined;

    <div style="display:flex; align-items:center; gap:10px; margin:2px 0 10px">
      <b class="jua" style="flex:1">⚖️ ${esc(set.title)}</b>

    </div>
    ${blPadHTML(set, { i, picks, left:BL.left, lock:BL.lock, showAns, foot })}
    <p class="muted center" style="margin:12px 0 0; font-size:.83rem">${BL.lock
      ? '선생님이 <b>다음 문제</b>를 열어 줄 때까지 기다려요.'
      : (set.limit? '시간 안에는 답을 다시 골라도 돼요.' : '선생님이 다음 문제를 열 때까지 답을 바꿀 수 있어요.')}</p>`;

/* ============================ 모둠 발표 (짜잔!) ============================
   선생님이 버튼을 누르면 TV에 두구두구 → 모둠이 하나씩 뿅뿅 → 짜잔.
   보드게임·땅따먹기가 같이 쓴다. */
function grpRollSound(){                     /* 두구두구 — 하이햇 연타 */
  const ctx=bgCtx(); if(!ctx) return;
  const t0=ctx.currentTime+0.02;
  for(let i=0;i<26;i++) bgHat(ctx, t0+i*0.06, 0.05);
}
function grpPopSound(k){                     /* 모둠 하나가 나올 때 한 음씩 올라간다 */
  const ctx=bgCtx(); if(!ctx) return;
  const sc=[523.25,587.33,659.25,783.99,880,1046.5,1174.7];
  bgNote(ctx, sc[k%sc.length], ctx.currentTime+0.01, 0.24, 0.16, [['triangle',0.8],['sine',0.4]]);
}
function grpTadaSound(){                     /* 짜잔! */
  const ctx=bgCtx(); if(!ctx) return;
  const t=ctx.currentTime+0.02;
  [[523.25,0],[659.25,0.08],[783.99,0.16],[1046.5,0.24]].forEach(([f,d])=>
    bgNote(ctx, f, t+d, 0.55, 0.2, [['triangle',0.7],['sine',0.5]]));
  bgHat(ctx, t+0.24, 0.12);
}
/* groups: [[학생id,...], ...] · students: 학급 학생 목록. 닫을 때까지 기다리는 약속을 돌려준다. */
function groupReveal(groups, students, opts){
  opts=opts||{};
  return new Promise((done)=>{
    document.querySelectorAll('.grp-ov').forEach(el=> el.remove());
    const nameOf=(sid)=>{ const st=students.find(x=>x.id===sid); return st? st.name : '친구'; };
    const toks=opts.tokens || ['🐰','🐻','🐼','🦊','🐯','🐨'];
    const ov=document.createElement('div');
    ov.className='grp-ov';
    ov.innerHTML=`
      <div class="grp-box">
        <div class="grp-title" id="grpTitle">🥁 두구두구두구…</div>
        <div class="grp-sub" id="grpSub">${esc(opts.sub||'')}</div>
        <div class="grp-roll" id="grpRoll">&nbsp;</div>
        <div class="grp-grid" id="grpGrid"></div>
        <div class="center" style="margin-top:20px">
          <button class="btn lg" id="grpClose" style="display:none">확인했어요 👍</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    let closed=false;
    const finish=()=>{ if(closed) return; closed=true; ov.remove(); done(); };
    const timers=[];
    const later=(fn,ms)=> timers.push(setTimeout(fn,ms));

    /* ① 이름이 촤르륵 지나간다 */
    const names=students.map(x=>x.name).filter(Boolean);
    grpRollSound();
    const rollT=setInterval(()=>{
      const el=ov.querySelector('#grpRoll'); if(!el) return;
      el.textContent = names.length? names[Math.floor(Math.random()*names.length)] : '…';
    }, 70);
    timers.push(rollT);

    later(()=>{
      clearInterval(rollT);
      const r=ov.querySelector('#grpRoll'); if(r) r.textContent='';
      const ti=ov.querySelector('#grpTitle'); if(ti) ti.textContent='🎊 모둠 발표!';
      /* ② 모둠이 하나씩 뿅뿅 */
      const grid=ov.querySelector('#grpGrid');
      groups.forEach((ids,g)=>{
        const card=document.createElement('div');
        card.className='grp-card';
        card.innerHTML=`<h3>${g+1}모둠</h3>${ids.map((sid,i)=>
          `<div class="who"><span>${toks[i%toks.length]}</span><span>${esc(nameOf(sid))}</span></div>`).join('')}`;
        grid.appendChild(card);
        later(()=>{ card.classList.add('show'); grpPopSound(g); }, 280*g);
      });
      /* ③ 짜잔 */
      later(()=>{
        const t2=ov.querySelector('#grpTitle'), s2=ov.querySelector('#grpSub');
        if(t2) t2.textContent='짜잔! 🎉 오늘의 모둠이에요';
        if(s2) s2.textContent=`${groups.length}개 모둠 · 모둠끼리 모여 앉아요!`;
        grpTadaSound(); mgConfetti();
        const b=ov.querySelector('#grpClose');
        if(b){ b.style.display=''; b.onclick=finish; }
        ov.onclick=(e)=>{ if(e.target===ov) finish(); };      /* 바깥을 눌러도 닫힌다 */
      }, 280*groups.length+420);
    }, 1700);

    ov._stop=()=>{ timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); finish(); };
  });
}
function groupRevealClose(){ document.querySelectorAll('.grp-ov').forEach(el=>{ if(el._stop) el._stop(); else el.remove(); }); }

/* ============================ 땅따먹기 (돌 던져 땅 차지하기) ============================
   조준 → 힘 모으기 → 발사. 돌이 떨어진 칸의 낱말 미션에 성공하면 그 칸이 내 땅이 된다.
   돌·말·자 같은 실물 도구는 필요 없고 태블릿만으로 논다. 모둠·미션 판정 방식은 보드게임과 같다. */
const LD_TOKENS=['🔴','🔵','🟡','🟢'];
const ldKey  = (setId,cid)=> `v1:ld:${setId}:${cid}`;                 /* 모둠 편성 (선생님이 씀) */
const ldRKey = (setId,cid,g)=> `v1:prog:ld:${setId}:${cid}:${g}`;     /* 모둠별 땅 (학생이 씀) */
let LD=null, ldUnsubs=[];

function ldLeave(){
  groupRevealClose();
  ldUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  ldUnsubs=[];
  if(LD){ if(LD.aimT) clearInterval(LD.aimT); if(LD.powT) clearInterval(LD.powT); if(LD.flyT) clearTimeout(LD.flyT); }
  LD=null;
}
function ldSets(){ return (DB.land||[]).slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)); }
function ldSet(id){ return (DB.land||[]).find(s=>s.id===id) || null; }
function ldClasses(set){
  if(!set) return [];
  if(!set.classIds || !set.classIds.length) return DB.classes.slice();
  return DB.classes.filter(c=> set.classIds.includes(c.id));
}
function ldClassNames(set){
  if(!set.classIds || !set.classIds.length) return '전체 학급';
  const l=ldClasses(set);
  return l.length ? l.map(c=>c.name).join(', ') : '배부된 학급 없음(지워진 학급)';
}

/* ---------- 땅 만들기 ---------- */
/* n×n 칸에 낱말을 골고루 뿌린다. 칸마다 미션 낱말이 하나씩 붙는다. */
function ldMakeCells(items, n){
  const total=n*n;
  const cells=[]; let bag=[];
  for(let k=0;k<total;k++){
    if(!bag.length) bag=bdShuffle(items.map((_,i)=>i));
    cells.push({ i:bag.pop(), o:null });
  }
  return cells;
}
/* 네 귀퉁이를 시작 땅으로 나눠 준다 */
function ldBases(n, np){
  const c=[0, n-1, n*n-n, n*n-1];
  return c.slice(0, Math.max(2, Math.min(4, np)));
}
/* 조준 각도와 힘으로 돌이 떨어지는 칸을 구한다.
   한 칸 이내로 살짝 벗어나면 선을 맞고 가장자리에 멈춘다. 그보다 멀리 나가면 빗나감(-1). */
function ldLandCell(n, from, ang, pow){
  const fx=(from%n)+0.5, fy=Math.floor(from/n)+0.5;
  const dist=0.8 + pow*(n-0.8);
  const x=fx+Math.cos(ang)*dist, y=fy+Math.sin(ang)*dist;
  let cx=Math.floor(x), cy=Math.floor(y);
  if(cx<-1||cy<-1||cx>n||cy>n) return -1;          /* 많이 벗어나면 빗나감 */
  cx=Math.max(0, Math.min(n-1, cx));
  cy=Math.max(0, Math.min(n-1, cy));
  return cy*n+cx;
}
function ldCounts(room){
  const c=room.players.map(()=>0);
  room.cells.forEach(x=>{ if(x.o!=null && c[x.o]!=null) c[x.o]++; });
  return c;
}
function ldEmpty(room){ return room.cells.filter(x=>x.o==null).length; }

/* ---------- 땅 그리기 ---------- */
function ldBoardHTML(set, room, opt){
  opt=opt||{};
  const n=set.n;
  const cells=(room? room.cells : set.cells).map((c,idx)=>{
    const it=set.items[c.i]||{};
    const own=(c.o!=null);
    const isFrom = room && !opt.flat && room.phase==='aim' && (room.players[room.turn]||{}).last===idx;
    const isHit  = room && room.shot && room.shot.to===idx;
    return `<div class="ld-cell${own?' p'+c.o:''}${isFrom?' from':''}${isHit?' hit':''}"
        title="${esc(it.en||'')}">
      <span class="em">${it.em||'📝'}</span>
      <span class="wd">${esc(it.en||'')}</span>
      ${own?`<span class="fg">${LD_TOKENS[c.o%LD_TOKENS.length]}</span>`:''}
      ${isFrom?'<span class="st">🪨</span>':''}
    </div>`;
  }).join('');
  return `<div class="ld-board" style="grid-template-columns:repeat(${n},1fr)">${cells}</div>`;
}
function ldSeatsHTML(set, room){
  const cnt=ldCounts(room);
  return room.players.map((p,i)=>`
    <div class="bd-seat ${i===room.turn?'on':''}">
      <span class="tk">${LD_TOKENS[i%LD_TOKENS.length]}</span>
      <span class="nm">${esc(p.name)}${p.sid===session.studentId?' (나)':''}</span>
      <span class="ps">${cnt[i]}칸</span>
    </div>`).join('');
}

async function ldDrawGroups(again){
  const set=ldSet(LD.setId), cls=DB.classes.find(c=>c.id===LD.cid);
  if(!set || !cls) return;
  if(cls.students.length<2){ toast('학생이 2명 이상이어야 모둠을 짤 수 있어요'); return; }
  if(again && !confirm('모둠을 다시 뽑을까요?\n진행 중인 땅따먹기는 처음부터 다시 시작됩니다.')) return;
  const btn=$('ldDraw')||$('ldReshuffle');
  if(btn){ btn.disabled=true; btn.textContent='🥁 뽑는 중…'; }
  ldUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); ldUnsubs=[];
  if(LD.sess) for(let g=0; g<LD.sess.groups.length; g++) await sDel(ldRKey(LD.setId, LD.cid, g));
  const groups=bdMakeGroups(cls.students, set.players);
  const rec={ setId:LD.setId, classId:LD.cid, ver:set.ver, groups:grpWrap(groups), at:Date.now(),
              shuffle:((LD.sess&&LD.sess.shuffle)||0)+1 };
  if(!await sSet(ldKey(LD.setId, LD.cid), rec)){
    if(btn){ btn.disabled=false; btn.textContent=again? '🔀 모둠 다시 뽑기' : '🎊 모둠 뽑기'; }
    return;
  }
  if(!LD || LD.role!=='teacher') return;
  LD.sess=rec; LD.rooms={};
  await groupReveal(groups, cls.students, { sub:`${cls.name} · ${set.title}`, tokens:LD_TOKENS });
  if(!LD || LD.role!=='teacher') return;
  ldTeacherDraw(); ldTeacherWatch();
}
function ldTeacherWatch(){
  ldUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); ldUnsubs=[];
  if(!LD || LD.role!=='teacher' || !LD.sess) return;
  if(!(fbReady && window.__store)) return;
  LD.sess.groups.forEach((_,g)=>{
    const ref=keyRef(ldRKey(LD.setId, LD.cid, g));
    ldUnsubs.push(window.__store.watch(ref.col, ref.id, (v)=>{
      if(!LD || LD.role!=='teacher') return;
      LD.rooms[g]=v||null; ldTeacherDraw();
    }));
  });
}

    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
        <h2 style="margin:2px 0; flex:1">🚩 ${esc(set.title)} · ${esc(cls.name)}</h2>
        <button class="btn ghost sm" id="ldShow">🎊 모둠 다시 보여주기</button>
        <button class="btn ghost sm" id="ldReshuffle">🔀 모둠 다시 뽑기</button>
      </div>
      <p class="muted" style="margin:6px 0 0">${LD.sess.groups.length}개 모둠 · 한 모둠 ${set.players}명 기준 ·
        ${set.n}×${set.n} = ${total}칸. 학생들에게 <b>미션 활동 → 🚩 땅따먹기</b>로 들어오라고 해 주세요.</p>

    </div>
    ${groups}</div>`;
  $('ldReshuffle').onclick=()=> ldDrawGroups(true);
  $('ldShow').onclick=async ()=>{
    const groups=LD.sess.groups.map(grpIds);
    await groupReveal(groups, cls.students, { sub:`${cls.name} · ${set.title}`, tokens:LD_TOKENS });
  };
}

async function ldJoin(setId){
  const set=ldSet(setId); if(!set) return;
  const cid=session.classId;
  const sess=await sGet(ldKey(setId,cid), null);
  if(!LD || LD.role!=='student') return;
  const g=(sess && sess.groups) ? sess.groups.findIndex(grp=> grpIds(grp).includes(session.studentId)) : -1;
  const wrap=$('ldWrap');
  if(g<0){
    if(wrap) wrap.outerHTML=`<div id="ldWrap" class="card empty"><span class="em">🙋</span>
      아직 모둠에 들어가지 못했어요.<br>선생님께 <b>모둠 다시 짜기</b>를 부탁해 주세요.
      <div class="center" style="margin-top:12px"><button class="btn ghost sm" onclick="landStudent()">🔄 다시 확인</button></div></div>`;
    return;
  }
  LD.setId=setId; LD.g=g; LD.sess=sess;
  await ldEnsureRoom(set, cid, g, grpIds(sess.groups[g]));
  if(!LD || LD.role!=='student') return;
  if(fbReady && window.__store){
    const ref=keyRef(ldRKey(setId,cid,g));
    ldUnsubs.push(window.__store.watch(ref.col, ref.id, (v)=>{
      if(!LD || LD.role!=='student') return;
      if(v && !LD.charging && !LD.flying) { LD.room=v; ldStudentDraw(); }
      else if(v) LD.room=v;
    }));
  }
  ldStudentDraw();
}
async function ldEnsureRoom(set, cid, g, ids){
  const cls=DB.classes.find(c=>c.id===cid);
  const mk=()=>{
    const cells=(set.cells||[]).map(c=>({ i:c.i, o:null }));
    const bases=ldBases(set.n, ids.length);
    const players=ids.map((sid,k)=>{ const s=cls? cls.students.find(x=>x.id===sid) : null;
      const base=bases[k%bases.length];
      return { sid, name:s? s.name : '친구', base, last:base }; });
    players.forEach((p,k)=>{ if(cells[p.base]) cells[p.base].o=k; });   /* 시작 땅 한 칸씩 */
    return { setId:set.id, classId:cid, g, ver:set.ver, ldKey:set.id+'|'+cid,
      players, cells, turn:0, phase:'aim', shot:null, shots:0, msg:'', winner:null, at:Date.now() };
  };
  const key=ldRKey(set.id,cid,g), ref=keyRef(key);
  const resolve=(cur)=>{
    if(cur && cur.ver===set.ver && Array.isArray(cur.players) && cur.players.length===ids.length
       && Array.isArray(cur.cells) && cur.cells.length===set.n*set.n) return null;
    return mk();
  };
  if(fbReady && window.__store && window.__store.ensure){
    try{ const v=await window.__store.ensure(ref.col, ref.id, resolve); LD.room=v; return; }
    catch(e){ console.warn('ldEnsureRoom', e); }
  }
  const cur=await sGet(key, null);
  const next=resolve(cur);
  LD.room = next || cur;
  if(next) await sSet(key, next);
}
async function ldSave(room){
  room.at=Date.now();
  LD.room=room;
  ldStudentDraw();
  await sSet(ldRKey(room.setId, room.classId, room.g), room);
}
function ldNextTurn(room){ room.turn=(room.turn+1)%room.players.length; }
/* 끝나는 조건 — 셋 중 하나. 어떤 경우에도 반드시 끝난다.
   ① 빈 땅이 하나도 없을 때  ② 누군가 전체의 절반을 넘겼을 때  ③ 정해진 던지기 횟수를 다 썼을 때 */
function ldMaxShots(room){ return room.cells.length*3; }
function ldCheckEnd(room, force){
  const c=ldCounts(room), total=room.cells.length;
  const done = force || ldEmpty(room)===0 || c.some(v=> v>total/2) || (room.shots||0)>=ldMaxShots(room);
  if(!done) return false;
  let best=0; c.forEach((v,i)=>{ if(v>c[best]) best=i; });
  room.winner=room.players[best].sid; room.phase='over';
  room.msg=`🎉 ${esc(room.players[best].name)} 님이 ${c[best]}칸으로 우승!`;
  return true;
}

function ldStudentDraw(){
  if(!LD || LD.role!=='student') return;
  const set=ldSet(LD.setId), room=LD.room, wrap=$('ldWrap');
  if(!set || !room || !wrap) return;
  const me=room.players.findIndex(p=>p.sid===session.studentId);
  const myTurn = me>=0 && me===room.turn;
  const cur=room.players[room.turn]||{};
  const cnt=ldCounts(room);

  let panel='';
  if(room.winner){
    const w=room.players.find(p=>p.sid===room.winner)||{};
    panel=`<div class="card center">
      <div style="font-size:3rem">🏆</div>
      <h2 style="margin:6px 0">${esc(w.name)} 우승!</h2>
      <p class="muted">${room.players.map((p,i)=>`${LD_TOKENS[i%LD_TOKENS.length]} ${esc(p.name)} ${cnt[i]}칸`).join(' · ')}</p>
      <button class="btn lg coral" id="ldAgain" style="margin-top:10px">🔄 처음부터 다시 하기</button>
    </div>`;
  } else if(room.phase==='mission'){
    const c=room.cells[room.shot.to]||{}, it=set.items[c.i]||{};
    const kind=room.shot.hit;
    panel=`<div class="card center">
      <p class="muted" style="margin:0">${esc(cur.name)} 님의 미션 ${
        kind==='steal'? '<b style="color:var(--coral-d)">— 남의 땅 뺏기!</b>' : '— 빈 땅 차지하기'}</p>
      <div style="font-size:3rem; line-height:1.2">${it.em||'📝'}</div>
      <div style="font-family:'Andika'; font-size:1.7rem; margin:2px 0">${esc(it.en||'')}</div>
      ${it.ko?`<p class="muted" style="margin:0">${esc(it.ko)}</p>`:''}
      <div class="row" style="justify-content:center; margin-top:10px">
        <button class="btn" id="ldHear">🔊 들어보기</button>
        ${myTurn? '<button class="btn coral" id="ldMic">🎤 말해서 차지하기</button>':''}
      </div>
      <p class="muted" id="ldMicMsg" style="margin:8px 0 0">${myTurn
        ? '또박또박 말하면 이 칸이 내 땅이 돼요. 잘 안 되면 모둠 친구가 판정해 줘요.'
        : '친구가 말하는 걸 듣고 판정해 주세요!'}</p>
      ${!myTurn? `<div class="row" style="justify-content:center; margin-top:10px">
        <button class="btn" id="ldOK">👍 통과!</button>
        <button class="btn ghost" id="ldNO">👎 다시</button></div>`:''}
      <p class="muted" style="margin:10px 0 0; font-size:.82rem">실패하면 그 칸은 그대로 두고 차례가 넘어가요.</p>
    </div>`;
  } else if(myTurn){
    panel=`<div class="card center">
      <p class="muted" style="margin:0">내 차례! 화살표가 돌 때 <b>버튼을 누르면</b> 방향이 정해져요.
        <br>누르고 있는 동안 <b>힘</b>이 차오르고, <b>손을 떼면</b> 돌이 날아가요 🪨</p>
      <div class="ld-aimwrap"><div class="ld-arrow" id="ldArrow">➤</div></div>
      <p class="muted" style="margin:2px 0 6px">방향 <b id="ldAngT">0°</b> · 힘 <b id="ldPowT">0%</b></p>
      <div class="ld-power"><div id="ldPowBar"></div></div>
      <button class="btn lg coral" id="ldFire" style="margin-top:12px; width:100%; max-width:340px">🪨 누르고 있기 → 손 떼면 발사</button>
    </div>`;
  } else {
    panel=`<div class="card center">
      <p class="muted" style="margin:0">${esc(cur.name)} 님이 조준하고 있어요 🎯</p>
      <div style="font-size:2.6rem">🪨</div>
      ${room.msg? `<p style="margin:2px 0 0">${room.msg}</p>`:''}
      <p class="muted" style="margin:6px 0 0">차례를 기다려요 ⏳</p>
    </div>`;
  }

  wrap.outerHTML=`<div id="ldWrap">
    <div class="card">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
        <h2 style="margin:2px 0; flex:1">🚩 ${esc(set.title)}</h2>
        <span class="pill land">${LD.g+1}모둠</span>
        <span class="muted">빈 땅 ${ldEmpty(room)}칸 · 남은 던지기 ${Math.max(0, ldMaxShots(room)-(room.shots||0))}번</span>
      </div>
      ${ldBoardHTML(set, room)}
      ${room.msg && !myTurn===false && room.phase==='aim' ? `<p class="muted" style="margin:0 0 8px">${room.msg}</p>`:''}
      ${ldSeatsHTML(set, room)}
    </div>
    ${panel}</div>`;

  const hear=$('ldHear');
  if(hear) hear.onclick=()=>{ const c=room.cells[room.shot.to]||{}; const it=set.items[c.i]||{}; if(it.en) speak(it.en); };
  const ok=$('ldOK'); if(ok) ok.onclick=()=> ldMissionResult(true);
  const no=$('ldNO'); if(no) no.onclick=()=> ldMissionResult(false);
  const mic=$('ldMic'); if(mic) mic.onclick=ldMicTry;
  const again=$('ldAgain'); if(again) again.onclick=async ()=>{
    const s=ldSet(LD.setId), ids=grpIds(LD.sess.groups[LD.g]);
    await sDel(ldRKey(LD.setId, LD.cid, LD.g));
    await ldEnsureRoom(s, LD.cid, LD.g, ids);
    ldStudentDraw();
  };
  if($('ldFire')) ldAimStart();
}

/* ---------- 조준 · 힘 모으기 · 발사 ---------- */
function ldAimStart(){
  const arrow=$('ldArrow'), btn=$('ldFire');
  if(!arrow || !btn || !LD) return;
  if(LD.aimT) clearInterval(LD.aimT);
  LD.charging=false; LD.pow=0;
  LD.aimT=setInterval(()=>{
    if(!LD || LD.charging || LD.flying) return;
    const a=$('ldArrow'); if(!a){ clearInterval(LD.aimT); LD.aimT=0; return; }
    LD.ang=(LD.ang+0.09)%(Math.PI*2);
    a.style.transform=`rotate(${LD.ang}rad)`;
    const t=$('ldAngT'); if(t) t.textContent=Math.round(LD.ang*180/Math.PI)+'°';
  }, 40);

  const startCharge=(e)=>{
    if(e && e.preventDefault) e.preventDefault();
    if(!LD || LD.charging || LD.flying) return;
    LD.charging=true; LD.pow=0; LD.up=true;
    btn.textContent='💪 힘 모으는 중… 손을 떼면 발사!';
    LD.powT=setInterval(()=>{
      if(!LD) return;
      LD.pow += LD.up? 0.035 : -0.035;                 /* 힘 게이지가 왕복한다 */
      if(LD.pow>=1){ LD.pow=1; LD.up=false; }
      if(LD.pow<=0.05){ LD.pow=0.05; LD.up=true; }
      const bar=$('ldPowBar'), pt=$('ldPowT');
      if(bar) bar.style.width=Math.round(LD.pow*100)+'%';
      if(pt) pt.textContent=Math.round(LD.pow*100)+'%';
    }, 40);
  };
  const fire=(e)=>{
    if(e && e.preventDefault) e.preventDefault();
    if(!LD || !LD.charging) return;
    LD.charging=false;
    if(LD.powT){ clearInterval(LD.powT); LD.powT=0; }
    if(LD.aimT){ clearInterval(LD.aimT); LD.aimT=0; }
    ldFire(LD.ang, LD.pow);
  };
  btn.onpointerdown=startCharge;
  btn.onpointerup=fire;
  btn.onpointercancel=fire;
  btn.onpointerleave=(e)=>{ if(LD && LD.charging) fire(e); };
  /* 포인터 이벤트가 없는 기기 대비 */
  btn.ontouchstart=(e)=>{ if(!LD.charging) startCharge(e); };
  btn.ontouchend=fire;
  btn.onmousedown=(e)=>{ if(!LD.charging) startCharge(e); };
  btn.onmouseup=fire;
}
function ldFire(ang, pow){
  const room=LD.room, set=ldSet(LD.setId);
  if(!room || room.winner || room.phase!=='aim') return;
  if(room.players[room.turn].sid!==session.studentId) return;
  LD.flying=true;
  const btn=$('ldFire'); if(btn){ btn.disabled=true; btn.textContent='🪨 날아가는 중…'; }
  LD.flyT=setTimeout(()=>{
    if(!LD || LD.role!=='student') return;
    LD.flying=false;
    const p=room.players[room.turn];
    const to=ldLandCell(set.n, p.last, ang, pow);
    room.shots=(room.shots||0)+1;
    room.shot={ from:p.last, to, ang, pow };
    const deg=Math.round(ang*180/Math.PI), pc=Math.round(pow*100);
    if(to<0){
      room.shot.hit='miss';
      room.msg=`💨 ${esc(p.name)} 님의 돌이 판 밖으로 나갔어요! (${deg}° · 힘 ${pc}%)`;
      room.phase='aim';
      if(!ldCheckEnd(room)) ldNextTurn(room);
      return ldSave(room);
    }
    const c=room.cells[to];
    if(c.o===room.turn){
      room.shot.hit='own';
      room.msg=`🪨 이미 내 땅이에요! 여기서 <b>한 번 더</b> 던져요 (${deg}° · 힘 ${pc}%)`;
      p.last=to;                                   /* 던지는 자리를 옮겨 더 멀리 넓힐 수 있다 */
      room.phase='aim';
      ldCheckEnd(room);                            /* 한 번 더 던져도 횟수는 줄어든다 */
      return ldSave(room);
    }
    room.shot.hit = (c.o==null) ? 'empty' : 'steal';
    room.msg=`🪨 ${deg}° · 힘 ${pc}% — ${c.o==null? '빈 땅에 떨어졌어요!' : '남의 땅에 떨어졌어요!'}`;
    room.phase='mission';
    ldSave(room);
  }, 700);
  ldStudentDraw();
}
/* ---------- 미션 판정 ---------- */
function ldMissionResult(pass){
  const room=LD.room;
  if(!room || room.phase!=='mission' || !room.shot) return;
  const p=room.players[room.turn], to=room.shot.to, c=room.cells[to];
  if(pass){
    const stolen=(c.o!=null);
    c.o=room.turn; p.last=to;
    room.msg = stolen ? `🚩 ${esc(p.name)} 님이 땅을 <b>빼앗았어요!</b>` : `🚩 ${esc(p.name)} 님의 땅이 됐어요!`;
  } else {
    room.msg=`😢 ${esc(p.name)} 님, 아쉬워요. 이 칸은 그대로예요.`;
  }
  room.phase='aim'; room.shot=null;
  if(!ldCheckEnd(room)) ldNextTurn(room);
  ldSave(room);
}
async function ldMicTry(){
  const room=LD.room, set=ldSet(LD.setId);
  if(!room || room.phase!=='mission' || !room.shot) return;
  const c=room.cells[room.shot.to]||{}, it=set.items[c.i]||{};
  const msg=$('ldMicMsg'), mic=$('ldMic');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ if(msg) msg.textContent='이 기기는 마이크 채점을 지원하지 않아요. 친구에게 판정을 부탁해요!'; return; }
  if(speakRec){ speakStop(); if(mic) mic.classList.remove('rec'); return; }
  const perm=await ensureMic();
  if(!perm.ok){ if(msg) msg.textContent='마이크 권한을 허용해 주세요 (친구가 판정해 줘도 돼요)'; return; }
  await new Promise(r=> setTimeout(r,120));
  const r=new SR(); speakRec=r; r.lang='en-US'; r.interimResults=false; r.maxAlternatives=4;
  if(mic) mic.classList.add('rec');
  if(msg) msg.textContent='듣고 있어요… 지금 말해보세요 🎙️';
  r.onresult=(e)=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    const {score, heard}=scoreSpeech(it.en||'', alts);
    if(!LD || LD.role!=='student') return;
    if(score>=60){ if(msg) msg.textContent=`잘했어요! (${score}점) 이 땅은 내 거예요 🚩`; ldMissionResult(true); }
    else { if(msg) msg.textContent=`들린 말: ${heard||'(못 알아들었어요)'} · ${score}점 — 다시 한 번 말해볼까요?`; }
  };
  r.onerror=()=>{ if(msg) msg.textContent='잘 안 들렸어요. 다시 누르거나 친구에게 판정을 부탁해요'; if(mic) mic.classList.remove('rec'); speakRec=null; };
  r.onend=()=>{ if(mic) mic.classList.remove('rec'); if(speakRec===r) speakRec=null; };
  try{ r.start(); }catch(e){ if(msg) msg.textContent='마이크를 시작할 수 없어요'; if(mic) mic.classList.remove('rec'); speakRec=null; }
}


/* ============================ START ============================ */
window.boot = boot;
// 모듈 로드가 실패해도 화면은 뜨도록 안전장치 (4초)
setTimeout(()=>{ if(!window.__booted) boot(); }, 10000);
</script>

<!-- Firebase (모듈 SDK) : 전용 Firestore DB + 인증(선생님 로그인 / 학생 익명) -->
<script type="module">
(async ()=>{
  const cfg = window.__cfg || {};
  const finish = ()=>{ if(window.boot) window.boot(); };
  if(!cfg.ready){ window.__backend = { ready:false }; return finish(); }
  try{
    const imp = async (urls)=>{ let err; for(const u of urls){ try{ return await import(u); }catch(e){ err=e; } } throw err; };
    const V="10.12.5";
    const appMod = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/app/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-app.js`]);
    const fsMod  = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/firestore/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`]);
    const auMod  = await imp([`https://cdn.jsdelivr.net/npm/firebase@${V}/auth/+esm`, `https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`]);
    const { initializeApp } = appMod;
    const { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where,
            runTransaction, arrayUnion } = fsMod;
    const { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } = auMod;
    const appFb = initializeApp(cfg.config);
    const db = cfg.dbId ? getFirestore(appFb, cfg.dbId) : getFirestore(appFb);
    const auth = getAuth(appFb);
    // 항상 누군가는 로그인된 상태로 만들기(없으면 익명) — 그래야 읽기/진행 저장 가능
    await new Promise((res)=>{
      let done=false;
      onAuthStateChanged(auth, (u)=>{
        window.__user = u || null;
        if(window.__onUser) window.__onUser(u||null);
        if(!done){ done=true; if(!u){ signInAnonymously(auth).catch(()=>{}).finally(res); } else res(); }
      });
    });
    window.__store = {
      async get(col, id){ const s = await getDoc(doc(db, col, id)); return s.exists() ? s.data().value : undefined; },
      async set(col, id, value){ await setDoc(doc(db, col, id), { value }); },
      async del(col, id){ await deleteDoc(doc(db, col, id)); },
      // 문서 하나 구독. 반환값을 부르면 구독 해제(화면을 떠날 때 꼭 해제해야 요금이 새지 않음)
      watch(col, id, cb){ return onSnapshot(doc(db, col, id), s=> cb(s.exists()? s.data().value : undefined)); },
      // 없거나 낡았을 때만 새로 쓴다 — 두 기기가 동시에 만들어도 하나만 남는다.
      // resolve(현재값)이 null을 돌려주면 그대로 두고 쓰기도 하지 않는다. (카드 미션 배정)
      async ensure(col, id, resolve){
        return await runTransaction(db, async (tx)=>{
          const ref = doc(db, col, id);
          const s = await tx.get(ref);
          const cur = s.exists() ? s.data().value : undefined;
          const next = resolve(cur);
          if(next===null || next===undefined) return cur;
          tx.set(ref, { value: next });
          return next;
        });
      },
      // 배열에 한 칸만 덧붙인다 — 문서를 통째로 다시 쓰지 않는다 (도장 1개 = 1 write)
      async push(col, id, field, item){
        await updateDoc(doc(db, col, id), { ['value.'+field]: arrayUnion(item) });
      },
      // 같은 필드값을 가진 문서들을 통째로 구독 (빙고 교사 대시보드용)
      watchWhere(col, field, val, cb){
        return onSnapshot(query(collection(db, col), where(field, '==', val)),
          snap=> cb(snap.docs.map(d=> d.data().value).filter(v=> v!==undefined)),
          err=> console.warn('watchWhere', col, err));   // 현황판만 비고 게임은 계속 돌아간다
      }
    };
    window.__auth = {
      current:()=> auth.currentUser,
      isTeacher:()=> { const u=auth.currentUser; return !!(u && !u.isAnonymous); },
      email:()=> { const u=auth.currentUser; return (u && u.email) || ''; },
      async signIn(email,pw){ await signInWithEmailAndPassword(auth, email, pw); },
      async signUp(email,pw){ await createUserWithEmailAndPassword(auth, email, pw); },
      async resetPassword(email){ await sendPasswordResetEmail(auth, email); },
      async signOutToAnon(){ try{ await signOut(auth); }catch(e){} try{ await signInAnonymously(auth); }catch(e){} }
    };
    // 고품질 TTS 콜러블 함수 연결 (실패해도 앱 본체/저장은 그대로 동작)
    // firebase/functions 모듈은 쓰지 않는다 — CDN에서 app 모듈과 다른 사본이 잡혀
    // "Service functions is not available"로 죽는다. 콜러블 규약대로 직접 부른다:
    //   POST {data:{...}}  →  {result:{...}}
    const FN_URL = `https://asia-northeast3-${cfg.config.projectId}.cloudfunctions.net/ttsSpeak`;
    window.__tts = async (text, voice)=>{
      const u = auth.currentUser; if(!u) return '';
      const tok = await u.getIdToken();
      const r = await fetch(FN_URL, { method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok },
        body: JSON.stringify({ data:{ text, voice } }) });
      if(!r.ok) throw new Error('tts http '+r.status);
      const j = await r.json();
      return j && j.result && j.result.url;
    };
    window.__backend = { ready:true };
  }catch(e){
    window.__backend = { ready:false, error:(e && e.message) || String(e) };
  }
  finish();
})();
</script>
