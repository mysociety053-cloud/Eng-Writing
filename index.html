    area.innerHTML=`
      <div class="speak-hero">
        <div class="tag">${esc([a.grade,a.unit].filter(Boolean).join(' • ')||'SPEAKING')} · ${idx+1}/${a.items.length}</div>
        <div class="word">${esc(it.text)}</div>
        ${it.meaning?`<div class="mean">${esc(it.meaning)}</div>`:''}
        <button class="listen" id="btnListen">🔊 원어민 발음 듣기</button>
      </div>
      <div class="card" style="margin-top:16px">
        <div style="display:flex; align-items:center; gap:10px">
          <h3 style="margin:0; flex:1">🎯 ${a.repeat}회 따라 말하기</h3>
          <span class="muted" id="chalText">진행: ${done} / ${a.repeat}</span>
        </div>
        <div class="chal-dots" id="dots" style="margin-top:10px">${Array.from({length:a.repeat},(_,i)=>`<span class="d ${i<done?'on':''}" data-d="${i}">${i+1}</span>`).join('')}</div>
        <div class="mic-zone" style="margin-top:14px">
          <button class="mic-btn" id="mic">🎤</button>
          <div id="micMsg" class="muted">${supported?'마이크를 켜고 말하면, 말이 끝나면 자동으로 확인해요':'이 브라우저는 음성 인식이 안 돼요. 크롬에서 열어 주세요.'}</div>
        </div>
        <div class="score-row">
          <div><div class="muted" style="font-size:.8rem">인식된 발음</div><div class="heard" id="heard">대기 중…</div></div>
          <div><div class="muted" style="font-size:.8rem">발음 점수</div><div class="score-big" id="score">-- <span style="font-size:.9rem; color:var(--ink-soft)">/100</span></div></div>
        </div>
      </div>`;
    $('btnListen').onclick=()=> speak(it.text);
    updateBar();
    if(!supported){ $('mic').disabled=true; return; }
    const mic=$('mic');
    const setDots=()=>{ const d=Math.min(a.repeat, prog.counts[it.id]||0); app.querySelectorAll('#dots .d').forEach((el,i)=>el.classList.toggle('on',i<d)); $('chalText').textContent=`진행: ${d} / ${a.repeat}`; };
    mic.onclick=()=>{
      if(speakRec){ speakStop(); mic.classList.remove('rec'); return; }
      const r=new SR(); speakRec=r; r.lang='en-US'; r.interimResults=false; r.maxAlternatives=4;
      mic.classList.add('rec'); $('micMsg').textContent='듣고 있어요… 지금 말해보세요 🎙️';
      r.onresult=async (e)=>{
        const alts=[...e.results[0]].map(x=>x.transcript);
        const {score,heard}=scoreSpeech(it.text, alts);
        const hd=$('heard'); if(hd) hd.textContent=heard||'(못 알아들었어요)';
        const sc=$('score'); if(sc){ sc.innerHTML=`${score} <span style="font-size:.9rem; color:var(--ink-soft)">/100</span>`; sc.style.color=score>=80?'var(--green-d)':score>=60?'#caa12e':'var(--coral-d)'; }
        if(score>=60){
          const cur=prog.counts[it.id]||0;
          if(cur<a.repeat){ prog.counts[it.id]=cur+1; await persist(); setDots(); updateBar(); }
          if((prog.counts[it.id]||0)>=a.repeat){
            const msg=$('micMsg'); if(msg) msg.textContent='이 단어 완료! 🎉 다음으로 넘어가요';
            const nx=firstIncomplete();
            if(nx<0){ if(!prog.done){ prog.done=true; await persist(); } setTimeout(()=> showCeleb(), 700); }
            else setTimeout(()=> renderItem(nx), 900);
          } else { const msg=$('micMsg'); if(msg) msg.textContent= score>=80?'아주 좋아요! 한 번 더 💯':'좋아요! 계속 말해봐요'; }
        } else { const msg=$('micMsg'); if(msg) msg.textContent='다시 또박또박 말해볼까요? 🔊 발음을 들어봐도 좋아요'; }
      };
      r.onerror=(e)=>{ const msg=$('micMsg'); if(msg) msg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'마이크 권한을 허용해 주세요':'잘 안 들렸어요. 다시 눌러 주세요'; mic.classList.remove('rec'); speakRec=null; };
      r.onend=()=>{ mic.classList.remove('rec'); if(speakRec===r) speakRec=null; };
      try{ r.start(); }catch(e){ const msg=$('micMsg'); if(msg) msg.textContent='마이크를 시작할 수 없어요'; mic.classList.remove('rec'); speakRec=null; }
    };
  };

  updateBar();
  const start=firstIncomplete();
  if(start<0){ showCeleb(); return; }
  renderItem(start);
}

function copiesPerLine(it){
  const N=engineState.a.repeat;
  if(/\s/.test(it.text.trim())) return 1;            // 문장은 한 줄에 하나
  const L=it.text.replace(/\s/g,'').length;
  let c = L<=4 ? 3 : L<=7 ? 2 : 1;                    // 낱말 길이에 따라 1~3칸
  return Math.max(1, Math.min(c, N));
}
function activeIdx(itemId){
  const n=engineState.prog.counts[itemId]||0;
  return n<engineState.a.repeat ? n : -1;
}
function buildItemCard(it, idx){
  const card=document.createElement('div'); card.className='card'; card.dataset.item=it.id;
  const repeat=engineState.a.repeat;
  const doneCount=Math.min(repeat, (engineState.prog.counts[it.id]||0));
  const cpl=copiesPerLine(it);
  let rowsHtml='';
  for(let start=0; start<repeat; start+=cpl){
    let cells='';
    for(let k=start; k<Math.min(start+cpl,repeat); k++){
      const isDone = k<doneCount;
      const cls = isDone? 'locked' : (k===doneCount? '' : 'future');
      cells += `<div class="trace-cell ${cls}" data-cell="${it.id}|${k}">
          <canvas class="bg"></canvas><canvas class="ink"></canvas>
          <span class="badge ${isDone?'ok show':''}">${isDone?'✓':''}</span>
        </div>`;
    }
    rowsHtml += `<div class="trace-row">${cells}</div>`;
  }
  const allDone = doneCount>=repeat;
  card.innerHTML=`
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px">
      <span class="ty" style="font-family:'Jua'; background:#F4EEDF; padding:3px 10px; border-radius:9px">${it.type==='word'?'낱말':'문장'}</span>
      <span class="muted" data-prog="${it.id}">${doneCount}/${repeat}번</span>
    </div>
    ${it.meaning? `<div style="background:#FBF3E0; border:2px solid var(--gold); border-radius:12px; padding:9px 13px; margin-bottom:8px">
        <span style="font-family:'Jua'; color:var(--green-d)">뜻</span>
        <span style="font-size:1.1rem; margin-left:6px">${esc(it.meaning)}</span>
      </div>` : ''}
    <p class="muted" style="margin:0 0 4px 2px">👀 보기 (영어를 따라 써요)</p>
    <div class="model-card trace-line" data-model="${it.id}" style="border-style:dashed; overflow:hidden">
      <canvas class="bg"></canvas>
    </div>
    <p class="muted" style="margin:12px 0 4px 2px">✏️ 흐린 영어 글자 위에 또박또박 따라 써요</p>
    ${rowsHtml}
    <div class="line-tools" data-itemtools="${it.id}" style="justify-content:space-between; align-items:center; ${allDone?'display:none':''}">
      <span class="muted" data-status="${it.id}">왼쪽 칸부터 차례로 써요</span>
      <span style="display:flex; gap:8px">
        <button class="btn ghost sm" data-clearitem="${it.id}">지우기</button>
        <button class="btn sm" data-checkitem="${it.id}">확인</button>
      </span>
    </div>`;
  return card;
}

function setupCanvas(canvas, w, h){
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return ctx;
}
function notebookGeom(h){ return { top:h*0.17, mid:h*0.46, base:h*0.74, desc:h*0.93 }; }
function drawNotebook(ctx,w,h,m){
  m = (m==null?8:m);
  const g=notebookGeom(h);
  ctx.clearRect(0,0,w,h);
  ctx.lineWidth=1.4;
  ctx.strokeStyle='#BFD8E6';
  [g.top,g.desc].forEach(y=>{ ctx.beginPath(); ctx.moveTo(m,y); ctx.lineTo(w-m,y); ctx.stroke(); });
  ctx.setLineDash([5,5]); ctx.strokeStyle='#CFE0EB';
  ctx.beginPath(); ctx.moveTo(m,g.mid); ctx.lineTo(w-m,g.mid); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#E0876B'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(m,g.base); ctx.lineTo(w-m,g.base); ctx.stroke();
  return g;
}
function fitFontSize(ctx, text, w, baseSize, pad){
  let size=baseSize;
  do{ ctx.font=`700 ${size}px Andika, sans-serif`;
    if(ctx.measureText(text).width <= (w-pad*2)) break; size-=2;
  } while(size>14);
  return size;
}
function drawGlyphs(ctx, text, w, h, color, weight, opts){
  opts=opts||{}; const pad=opts.padding==null?14:opts.padding;
  const g=notebookGeom(h);
  const size=fitFontSize(ctx, text, w, h*0.5, pad);
  ctx.font=`${weight} ${size}px Andika, sans-serif`;
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle=color;
  const tw=ctx.measureText(text).width;
  const x = opts.center ? Math.max(pad,(w-tw)/2) : pad;
  ctx.fillText(text, x, g.base-2);
  return {size, x, tw};
}

function clampH(w){ return Math.min(140, Math.max(96, Math.round(w*0.18))); }

function initItemCanvases(it){
  const card=app.querySelector(`[data-item="${it.id}"]`);
  if(!card) return;
  // model line (bold black, single copy)
  const modelWrap=card.querySelector(`[data-model="${it.id}"]`);
  const w=Math.max(220, modelWrap.clientWidth); const hh=clampH(w);
  const mctx=setupCanvas(modelWrap.querySelector('canvas'), w, hh);
  drawNotebook(mctx,w,hh,8); drawGlyphs(mctx, it.text, w, hh, '#1F1D19', '700', {padding:14});

  const doneCount=engineState.prog.counts[it.id]||0;
  // each row shares one height; cells fill the row width equally
  card.querySelectorAll('.trace-row').forEach(row=>{
    const rowW=Math.max(160, row.clientWidth); const bh=clampH(rowW);
    row.querySelectorAll('.trace-cell').forEach(cell=>{
      const k=+cell.dataset.cell.split('|')[1];
      const bw=Math.max(80, cell.clientWidth);
      const bg=cell.querySelector('.bg'); const ink=cell.querySelector('.ink');
      const bctx=setupCanvas(bg, bw, bh); const ictx=setupCanvas(ink, bw, bh);
      drawNotebook(bctx,bw,bh,2);
      const isDone=doneCount>k;
      const r=drawGlyphs(bctx, it.text, bw, bh, isDone?'#1F1D19':'rgba(40,40,55,0.20)','700', {center:true,padding:8});
      const targetLogic=document.createElement('canvas'); targetLogic.width=bw; targetLogic.height=bh;
      const tlctx=targetLogic.getContext('2d');
      drawGlyphs(tlctx, it.text, bw, bh, '#000','700', {center:true,padding:8});
      const inkLogic=document.createElement('canvas'); inkLogic.width=bw; inkLogic.height=bh;
      const ilctx=inkLogic.getContext('2d');
      cell._engine={ itemId:it.id, k, bw, bh, ictx, bctx, tlctx, ilctx, targetLogic, inkLogic, drawn:false, fontSize:r.size };
      if(!isDone && !cell.classList.contains('future')) attachDrawing(cell, ink);
    });
  });
  // single toolbar acts on the active (next unfinished) cell of this item
  const clearB=card.querySelector(`[data-clearitem="${it.id}"]`);
  const checkB=card.querySelector(`[data-checkitem="${it.id}"]`);
  if(clearB) clearB.onclick=()=>{ const k=activeIdx(it.id); if(k>=0) clearLine(it.id,k); };
  if(checkB) checkB.onclick=()=>{ const k=activeIdx(it.id); if(k>=0) checkLine(it.id,k); };
}

function attachDrawing(cell, ink){
  const e=cell._engine; let drawing=false, last=null;
  const lwV=Math.max(5, (e.fontSize||40)*0.16);
  const lwL=Math.max(7, (e.fontSize||40)*0.20);
  const pos=(ev)=>{ const r=ink.getBoundingClientRect(); const p=ev.touches?ev.touches[0]:ev;
    return { x:(p.clientX-r.left)*(e.bw/r.width), y:(p.clientY-r.top)*(e.bh/r.height) }; };
  const stroke=(ctx,a,b,lw,col)=>{ ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=lw; ctx.strokeStyle=col;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); };
  const down=(ev)=>{ ev.preventDefault(); drawing=true; last=pos(ev); e.drawn=true;
    e.ictx.fillStyle='#1B3A6B'; e.ictx.beginPath(); e.ictx.arc(last.x,last.y,lwV*0.55,0,7); e.ictx.fill();
    e.ilctx.fillStyle='#000'; e.ilctx.beginPath(); e.ilctx.arc(last.x,last.y,lwL*0.55,0,7); e.ilctx.fill(); };
  const move=(ev)=>{ if(!drawing)return; ev.preventDefault(); const p=pos(ev);
    stroke(e.ictx,last,p,lwV,'#1B3A6B'); stroke(e.ilctx,last,p,lwL,'#000'); last=p; };
  const up=()=>{ drawing=false; };
  ink.addEventListener('mousedown',down); ink.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  ink.addEventListener('touchstart',down,{passive:false}); ink.addEventListener('touchmove',move,{passive:false});
  ink.addEventListener('touchend',up);
}

function clearLine(itemId,k){
  const cell=app.querySelector(`[data-cell="${itemId}|${k}"]`); if(!cell) return;
  const e=cell._engine; if(!e) return;
  e.ictx.clearRect(0,0,e.bw,e.bh); e.ilctx.clearRect(0,0,e.bw,e.bh); e.drawn=false;
  const badge=cell.querySelector('.badge'); badge.className='badge'; badge.textContent='';
  const st=app.querySelector(`[data-status="${itemId}"]`); if(st) st.textContent='흐린 글자 위에 또박또박 써요';
}

/* --- scoring --- */
function maskFrom(ctx,w,h,ds){
  const data=ctx.getImageData(0,0,w,h).data; const W=Math.ceil(w/ds), H=Math.ceil(h/ds);
  const m=new Uint8Array(W*H);
  for(let y=0;y<h;y+=ds){ for(let x=0;x<w;x+=ds){ const i=(y*w+x)*4; if(data[i+3]>40){ m[(y/ds|0)*W+(x/ds|0)]=1; } } }
  return {m,W,H};
}
function dilate(m,W,H,R){
  const tmp=new Uint8Array(W*H), out=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let v=0; for(let dx=-R;dx<=R;dx++){const nx=x+dx; if(nx<0||nx>=W)continue; if(m[y*W+nx]){v=1;break;}} tmp[y*W+x]=v; }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let v=0; for(let dy=-R;dy<=R;dy++){const ny=y+dy; if(ny<0||ny>=H)continue; if(tmp[ny*W+x]){v=1;break;}} out[y*W+x]=v; }
  return out;
}
function cnt(m){let c=0;for(let i=0;i<m.length;i++)c+=m[i];return c;}
function scoreLine(e){
  const ds=2, R=6;
  const T=maskFrom(e.tlctx,e.bw,e.bh,ds);
  const I=maskFrom(e.ilctx,e.bw,e.bh,ds);
  const tC=cnt(T.m), iC=cnt(I.m);
  if(tC===0) return {verdict:'pass'}; // safety
  const dT=dilate(T.m,T.W,T.H,R), dI=dilate(I.m,I.W,I.H,R);
  let cov=0; for(let i=0;i<T.m.length;i++) if(T.m[i]&&dI[i]) cov++;
  let on=0; for(let i=0;i<I.m.length;i++) if(I.m[i]&&dT[i]) on++;
  const coverage=cov/tC, onTarget= iC? on/iC:0, inkRatio=iC/tC;
  const enough = iC >= 0.22*tC;
  const great = enough && inkRatio<=1.7 && coverage>=0.78 && onTarget>=0.72;
  const pass  = enough && inkRatio<=2.1 && coverage>=0.5 && onTarget>=0.55;
  return { verdict: great?'great': pass?'pass':'fail', coverage, onTarget, inkRatio, iC, tC };
}

async function checkLine(itemId,k){
  const cell=app.querySelector(`[data-cell="${itemId}|${k}"]`); if(!cell) return;
  const e=cell._engine; if(!e) return;
  const badge=cell.querySelector('.badge');
  const st=app.querySelector(`[data-status="${itemId}"]`);
  if(!e.drawn){ badge.className='badge try show'; badge.textContent='✍️'; if(st) st.textContent='먼저 칸 안에 써 볼까요? ✍️'; return; }
  const r=scoreLine(e);
  if(r.verdict==='fail'){
    badge.className='badge try show'; badge.textContent='✗';
    if(st) st.textContent='조금만 더 또박또박 따라 써요 ✍️';
    return;
  }
  // pass / great -> lock this cell
  badge.className='badge ok show'; badge.textContent='✓';
  if(st) st.textContent = r.verdict==='great'? '딱 맞췄어요! 💯' : '잘 했어요! 다음 칸을 써요 ✓';
  cell.classList.add('locked');
  drawNotebook(e.bctx,e.bw,e.bh,2);
  drawGlyphs(e.bctx, engineState.a.items.find(i=>i.id===itemId).text, e.bw, e.bh, '#1F1D19','700', {center:true,padding:8});
  // record progress
  const prev=engineState.prog.counts[itemId]||0;
  engineState.prog.counts[itemId]=Math.max(prev, k+1);
  engineState.prog.updatedAt=Date.now();
  // reveal next cell
  const nextCell=app.querySelector(`[data-cell="${itemId}|${k+1}"]`);
  if(nextCell){ nextCell.classList.remove('future'); if(nextCell._engine) attachDrawing(nextCell, nextCell.querySelector('.ink')); }
  else { // item finished -> hide its toolbar
    const tools=app.querySelector(`[data-itemtools="${itemId}"]`); if(tools) tools.style.display='none';
    if(st) st.textContent='이 낱말 완료! 🎉';
  }
  const lbl=app.querySelector(`[data-prog="${itemId}"]`);
  if(lbl) lbl.textContent=`${engineState.prog.counts[itemId]}/${engineState.a.repeat}번`;
  await persistProgress();
  updateOverall();
}

function updateOverall(){
  const a=engineState.a; const total=a.items.length*a.repeat;
  let cnt=0; for(const it of a.items) cnt+=Math.min(a.repeat, engineState.prog.counts[it.id]||0);
  const pct= total? Math.round(cnt/total*100):0;
  const bar=$('ovProg'); if(bar) bar.style.width=pct+'%';
  const txt=$('ovText'); if(txt) txt.textContent=`${cnt} / ${total} 칸 완료 (${pct}%)`;
  if(cnt>=total && !engineState.prog.done){ engineState.prog.done=true; persistProgress(); showCeleb(); }
}
async function persistProgress(){
  await sSet(progKey(engineState.a.id, session.studentId), engineState.prog);
}
function showCeleb(msg){
  $('celebMsg').textContent = msg || '모든 낱말과 문장을 또박또박 다 썼어요!';
  $('celebrate').classList.add('show');
}
function closeCeleb(){
  $('celebrate').classList.remove('show');
  if(BG && BG.role==='student'){ bingoStudentDraw(); return; }   /* 빙고 중이면 판으로 돌아간다 */
  studentAssignments();
}

/* 저장 위치
   · 세션(선생님만 씀)  : v1:bingo:<학급id>          → eng_app/bingo_<학급id>

   기존 보안 규칙(eng_app=선생님만 쓰기 / eng_progress=인증되면 쓰기)을 그대로 쓴다. 규칙 수정 불필요.
   Firestore에 타이머를 쓰지 않는다. 호출 시각 하나만 저장하고 카운트다운은 각 기기가 로컬 계산. */

const BINGO_EMO=[];
BINGO_EMO_CATS.forEach(([cat,list])=> list.forEach(([e,k,ko])=> BINGO_EMO.push([e,k,ko,cat])));

function bingoStem(w){
  if(w.length>5&&w.endsWith('ing')){ let s=w.slice(0,-3); if(s.length>2&&s[s.length-1]===s[s.length-2]) s=s.slice(0,-1); return s; }
  if(w.length>4&&w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.length>3&&w.endsWith('es')) return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')) return w.slice(0,-1);
  if(w.length>4&&w.endsWith('ed')) return w.slice(0,-2);
  return w;
}
/* 표현에서 어울리는 그림 후보를 찾는다. 긴 키워드(여러 낱말)가 항상 우선 */
function bingoSuggest(text, limit){
  const clean=String(text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(!clean) return [];
  const ws=clean.split(' ');
  const bags=[' '+ws.join(' ')+' ', ' '+ws.map(bingoStem).join(' ')+' '];
  const out=[];
  BINGO_EMO.forEach(d=>{
    let best=0;
    d[1].split('|').forEach(k=>{ if(bags.some(b=>b.includes(' '+k+' '))){ const w=k.split(' ').length*1000+k.length; if(w>best) best=w; } });
    if(best) out.push({e:d[0], s:best});
  });
  out.sort((a,b)=>b.s-a.s);
  const seen=new Set();
  return out.filter(o=>!seen.has(o.e)&&seen.add(o.e)).slice(0, limit||4).map(o=>o.e);
}

/* 같은 학생은 새로고침해도 같은 판 — 씨앗(세션id+학생id)에서 판을 다시 만든다 */
function bingoRng(seed){
  let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function bingoBoard(seed,n,k){
  const r=bingoRng(seed), c=[];
  for(let i=0;c.length<n*n;i++) c.push(i%k);           /* 표현이 골고루 반복되게 채우고 */
  for(let i=c.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=c[i]; c[i]=c[j]; c[j]=t; }  /* 섞기 */
  return c;
}
function bingoLinesOf(n){
  const L=[];
  for(let r=0;r<n;r++) L.push([...Array(n)].map((_,c)=>r*n+c));
  for(let c=0;c<n;c++) L.push([...Array(n)].map((_,r)=>r*n+c));
  L.push([...Array(n)].map((_,i)=>i*n+i));
  L.push([...Array(n)].map((_,i)=>i*n+(n-1-i)));
  return L;
}
function bingoDoneLines(marks,n){ return bingoLinesOf(n).filter(l=>l.every(i=>marks[i])); }
function bgShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function bgFace(it){ return it.e? `<span class="e">${it.e}</span>` : `<span class="w">${esc(it.m||it.t)}</span>`; }

   ① 호루라기(집중)  ② 문장 1회 듣기  ③ 생각하며 빙고판 누르기
   단계는 Firestore에 쓰지 않는다. "몇 번째 표현인지"만 공유하고, 각 기기가 그 표현을
   받은 순간부터 스스로 시간을 잰다(기기 시계가 서로 몇 초씩 달라도 안전하다). */
const BG_JINGLE_MS=3450;                       // ① 경쾌한 음악 (실제 연주 길이와 맞춰야 겹치지 않는다)
const BG_WHISTLE_MS=1100;                      // ② 삑~ (호루라기 0.72초 + 문장 전 잠깐의 여백)
const BG_INTRO_MS=BG_JINGLE_MS+BG_WHISTLE_MS;  // 여기까지 지나면 문장이 나온다
let bgAudioCtx=null;
/* 소리를 파일 없이 그 자리에서 만들어 낸다 — 학교망이 외부 파일을 막아도 울리고 받을 것도 없다 */
function bgCtx(){
  try{
    bgAudioCtx = bgAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(bgAudioCtx.state==='suspended') bgAudioCtx.resume();
    return bgAudioCtx;
  }catch(e){ return null; }
}
/* 경쾌한 시작 음악 — 다장조 3.4초. 멜로디 + 베이스 + 박을 짚어주는 하이햇.
   음원 파일이 아니라 그 자리에서 연주한다. */
function bgNote(ctx, f, t, dur, amp, types){
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp), t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  g.connect(ctx.destination);
  types.forEach(([type, mix])=>{
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=f;
    const og=ctx.createGain(); og.gain.value=mix;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t+dur+0.03);
  });
}
function bgHat(ctx, t, amp){          // 짧은 잡음 한 방 = 하이햇
  const len=Math.floor(ctx.sampleRate*0.04);
  const buf=ctx.createBuffer(1, len, ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g=ctx.createGain(); g.gain.value=amp;
  src.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start(t);
}
function bingoJingle(){
  const ctx=bgCtx(); if(!ctx) return;
  const t0=ctx.currentTime+0.04;
  const C5=523.25,E5=659.25,F5=698.46,G5=783.99,A5=880,C6=1046.5,
        C3=130.81,F3=174.61,G3=196.00;
  /* [음, 시작(초), 길이(초), 세기] — 8분음표 0.2초, 총 3.35초 */
  const melody=[
    [G5,0.00,.17,.15],[G5,0.20,.17,.13],[C6,0.40,.34,.16],
    [A5,0.80,.17,.13],[G5,1.00,.17,.13],[E5,1.20,.34,.15],
    [F5,1.60,.17,.13],[G5,1.80,.17,.13],[A5,2.00,.34,.16],
    [G5,2.40,.17,.13],[E5,2.60,.17,.13],[C6,2.80,.55,.17]
  ];
  const bass=[[C3,0,.32],[C3,.4,.32],[F3,.8,.32],[C3,1.2,.32],
              [F3,1.6,.32],[G3,2.0,.32],[G3,2.4,.32],[C3,2.8,.50]];
  melody.forEach(([f,dt,dur,amp])=> bgNote(ctx,f,t0+dt,dur,amp,[['triangle',1],['square',.22]]));
  bass.forEach(([f,dt,dur])=> bgNote(ctx,f,t0+dt,dur,.13,[['triangle',1]]));
  for(let i=0;i<17;i++) bgHat(ctx, t0+i*0.2, i%2? .035 : .06);   // 박마다 톡톡
}
/* 호루라기 "삑~" — 음악이 끝나면 길게 한 번 불어 준다 */
function bingoWhistle(){
  const ctx=bgCtx(); if(!ctx) return;
  const t0=ctx.currentTime, dur=0.72;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0+0.05);
  g.gain.setValueAtTime(0.22, t0+dur-0.14);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  g.connect(ctx.destination);
  const vib=ctx.createOscillator(); vib.frequency.value=28;       // 호루라기 특유의 떨림
  const vibAmt=ctx.createGain(); vibAmt.gain.value=95;
  vib.connect(vibAmt);
  [2150, 2680].forEach((f,i)=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    vibAmt.connect(o.frequency);
    const og=ctx.createGain(); og.gain.value=i? 0.45 : 1;
    o.connect(og); og.connect(g);
    o.start(t0); o.stop(t0+dur);
  });
  vib.start(t0); vib.stop(t0+dur);
}
/* 이 기기가 지금 표현을 받은 뒤 얼마나 지났는지로 단계를 정한다 */
function bingoPhase(){
  if(!BG || !BG.callAt) return 'think';        // 도중에 들어온 기기는 바로 누를 수 있게
  const el=Date.now()-BG.callAt;
  if(el < BG_JINGLE_MS) return 'jingle';
  if(el < BG_INTRO_MS) return 'whistle';
  if(el < BG_INTRO_MS + (BG.sayMs||1500)) return 'listen';
  return 'think';
}
/* 단계가 바뀌는 순간에 맞춰 화면을 다시 그린다 (표현을 받은 시각 기준) */
function bingoPhaseTimers(redraw){
  clearTimeout(BG.phaseT1); clearTimeout(BG.phaseT2); clearTimeout(BG.phaseT3);
  const el=Date.now()-(BG.callAt||0);
  const ts=[BG_JINGLE_MS-el, BG_INTRO_MS-el, BG_INTRO_MS+(BG.sayMs||1500)-el];
  ts.forEach((t,i)=>{ if(t>0) BG['phaseT'+(i+1)]=setTimeout(redraw, t+40); });
}

/* 화면을 떠날 때 구독·타이머·소리를 정리한다 (안 하면 요금이 계속 샌다) */
let BG=null;
function bingoLeave(){
  if(!BG) return;
  (BG.unsubs||[]).forEach(u=>{ try{ u(); }catch(e){} });
  clearTimeout(BG.repeatT); clearTimeout(BG.autoT);
  clearTimeout(BG.sayT); clearTimeout(BG.whistleT);
  clearTimeout(BG.phaseT1); clearTimeout(BG.phaseT2); clearTimeout(BG.phaseT3);
  clearInterval(BG.tickT);
  BG=null;
  speakStop();
}
/* 한 번 읽어주고, 끝나면 한 번 더 (초등에서는 두 번 들려주는 게 기본) */
async function bingoSay(text, twice){
  await speak(text);
  if(!twice) return;
  const au=ttsAudio;
  if(au && au.addEventListener) au.addEventListener('ended', ()=>{ if(ttsAudio===au) speak(text); }, {once:true});
  else if(BG) BG.repeatT=setTimeout(()=>speak(text), 2300);
}

}
/* 배부된 빙고 과제 중에서 고른다 — 판·그림 설정은 이미 과제에 들어 있다 */
function bingoPickAssignment(cid){
  const cls=DB.classes.find(x=>x.id===cid);
  const asgs=DB.assignments.filter(a=>a.classId===cid && a.mode==='bingo')
    .sort((a,b)=> b.createdAt-a.createdAt);
  app.innerHTML=`<button class="back" onclick="bingoSetup()">← 반 다시 고르기</button>

      <p class="muted">「과제 만들기」에서 이 반에 배부한 빙고입니다. 누르면 바로 시작 준비가 돼요.</p>
    </div>
    <div id="bgList"></div>`;
  const el=$('bgList');
  if(!asgs.length){
    el.innerHTML=`<div class="card empty"><span class="em">🌱</span>이 반에 배부한 빙고가 없어요.<br>
      <span class="muted">「과제 만들기 → ③ 과제 유형에서 <b>👂 듣기 빙고</b> 선택 → 학급 고르기」로 만들어 주세요.</span>
      <div style="margin-top:14px"><button class="btn" id="goMake">📝 과제 만들러 가기</button></div></div>`;
    $('goMake').onclick=()=>{ draft=null; createAssignment(); };
    return;
  }
  el.innerHTML=asgs.map(a=>{
    const b=a.bingo||{n:5,target:3,iv:14};
    const tag=[a.grade,a.unit,a.lesson].filter(Boolean).join(' / ');
    const emo=a.items.filter(i=>i.emoji && i.emoji!=='-').map(i=>i.emoji).slice(0,10).join(' ');
    return `<div class="card" style="margin-bottom:12px; cursor:pointer" data-a="${a.id}">
      <h3 style="margin:0 0 4px">👂 ${esc(a.title)}</h3>
      <p class="muted" style="margin:0 0 6px">${tag||''} · 표현 ${a.items.length}개 ·
        ${b.n}×${b.n} · ${b.target}빙고 · ${b.iv? b.iv+'초 자동':'수동 진행'}</p>
      ${emo? `<div style="font-size:1.5rem; letter-spacing:2px">${emo}${a.items.length>10?' …':''}</div>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-a]').forEach(c=> c.onclick=()=> bingoStartFromAssignment(c.dataset.a));
}
/* 과제에 저장된 설정 그대로 게임을 연다 — 학급마다 다시 설정할 필요가 없다 */
async function bingoStartFromAssignment(aid){
  const a=DB.assignments.find(x=>x.id===aid); if(!a) return;
  const cls=DB.classes.find(x=>x.id===a.classId);
  const b=a.bingo||{n:5,target:3,iv:14};
  const items=a.items.map(i=>({ t:i.text, m:i.meaning||'', e:(i.emoji==='-'?'':(i.emoji||'')) }));
  const sess={ id:'bg'+uid(), classId:a.classId, className:cls?cls.name:'', listId:a.listId, asgId:a.id,
    title:a.title, n:b.n, target:b.target, iv:b.iv, items, calls:[], at:Date.now(),
    status:'ready', updatedAt:Date.now() };
  const ok=await sSet(bingoKey(a.classId), sess);
  if(!ok) return;
  bingoRun(sess);
}
/* ---------- 이모지 고르기 창 ---------- */
/* 추천 후보만 돌리면 원하는 그림이 없을 때 막힌다. 사전 전체에서 찾아 고를 수 있게 한다. */
/* opts = { text, meaning, cands, cur, onPick(이모지) } — 어느 화면에서든 쓸 수 있게 값만 주고받는다 */
let emoPick=null;
/* 붙여넣은 글에서 첫 번째 그림(이모지) 하나만 꺼낸다.
   👩‍🏫처럼 여러 조각이 붙은 것도 통째로 살려야 해서 글자 단위(grapheme)로 자른다. */
const EMO_RE = (()=>{ try{ return new RegExp('\\p{Extended_Pictographic}|\\p{Regional_Indicator}','u'); }
                      catch(e){ return null; } })();
function emojiIsEmo(c){
  if(!c) return false;
  if(/[0-9#*]️?⃣/.test(c)) return true;                 /* 1️⃣ 같은 숫자 그림 */
  if(/[←-⯿]/.test(c)) return true;           /* ★ ☆ ♪ ➤ 같은 기호도 받아 준다 */
  if(EMO_RE) return EMO_RE.test(c);
  return c.codePointAt(0) > 0x1F000;                   /* 유니코드 속성을 못 쓰는 옛 기기 */
}
function emojiFirst(s){
  const t=String(s||'').trim();
  if(!t) return '';
  try{
    const seg=new Intl.Segmenter('ko',{granularity:'grapheme'});
    for(const g of seg.segment(t)) if(emojiIsEmo(g.segment)) return g.segment;
    return '';
  }catch(e){
    for(const c of t) if(emojiIsEmo(c)) return c;   /* Segmenter가 없으면 조각 하나만 나올 수 있다 */
    return '';
  }
}
function emojiPickOpen(opts){
  emoPick=Object.assign({ q:'', cat:'', cands:[], cur:'', meaning:'', direct:'' }, opts);
  emojiPickDraw();
  $('emoPick').classList.add('show');
  setTimeout(()=>{ const s=$('emoQ'); if(s) s.focus(); }, 60);
}
function emojiPickClose(){ $('emoPick').classList.remove('show'); emoPick=null; }
function emojiPickSet(e){
  const cb=emoPick && emoPick.onPick;
  emojiPickClose();
  if(cb) cb(e);
}
function emojiPickDraw(){
  const it={ t:emoPick.text, m:emoPick.meaning, e:emoPick.cur, cands:emoPick.cands };
  const q=emoPick.q.trim().toLowerCase();
  const hit=(d)=> !q || d[2].includes(q) || d[1].split('|').some(k=>k.includes(q));
  let secs;
  if(q){
    const rows=BINGO_EMO.filter(hit);
    secs = rows.length
      ? `<div class="sec">'${esc(emoPick.q)}' 검색 결과 ${rows.length}개</div>
         <div class="grid">${rows.map(d=>emojiPickCell(d,it.e)).join('')}</div>`
      : `<div class="empty"><span class="em">🔍</span>찾는 그림이 없어요.<br>
           <span class="muted">한글(예: 실험)이나 영어(예: science)로 찾아보세요.<br>
           그래도 없으면 창을 닫고 칸에 이모지를 직접 붙여넣으면 됩니다.</span></div>`;
  } else {
    const rec=it.cands||[];
    const cats=BINGO_EMO_CATS.filter(([c])=> !emoPick.cat || c===emoPick.cat);
    secs = (rec.length && !emoPick.cat
        ? `<div class="sec">✨ 이 표현에 어울리는 그림</div>
           <div class="grid">${rec.map(e=>emojiPickCell(BINGO_EMO.find(d=>d[0]===e)||[e,'',''], it.e)).join('')}</div>`
        : '')
      + cats.map(([c,list])=>`<div class="sec">${c}</div>
           <div class="grid">${list.map(d=>emojiPickCell(d,it.e)).join('')}</div>`).join('');
  }
  $('emoBox').innerHTML=`
    <div class="hd">
      <div class="q">${esc(it.t)}</div>
      ${it.m?`<div class="muted" style="margin-bottom:8px">${esc(it.m)}</div>`:'<div style="height:8px"></div>'}
      <input type="text" id="emoQ" placeholder="🔎 한글·영어로 찾기 (예: 실험, science)" value="${esc(emoPick.q)}">
    </div>
    <div class="cats">
      <span class="chip ${emoPick.cat?'':'on'}" data-cat="">전체</span>
      ${BINGO_EMO_CATS.map(([c])=>`<span class="chip ${emoPick.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</span>`).join('')}
    </div>
    <div class="body">${secs}</div>
    <div class="ft" style="flex-direction:column; align-items:stretch; gap:10px">
      <div>
        <div class="muted" style="font-size:.8rem; margin-bottom:5px">
          찾는 그림이 없나요? <b>이모지를 직접 넣을 수 있어요</b>
          — 윈도우는 <b>⊞ + .</b> , 태블릿은 자판의 이모지 단추를 누르세요.</div>
        <div style="display:flex; gap:8px; align-items:center">
          <input type="text" id="emoDirect" placeholder="여기에 이모지를 붙여넣기 (예: 🥩)"
            value="${esc(emoPick.direct||'')}" style="flex:1; min-width:0">
          <span id="emoDirectPv" style="flex:0 0 42px; font-size:1.7rem; text-align:center; line-height:1.2"></span>
          <button class="btn sm" id="emoUse" style="flex:0 0 auto">넣기</button>
        </div>
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <button class="btn ghost sm" id="emoNone">글자로 표시</button>
        <div style="flex:1"></div>
        <button class="btn sm" id="emoClose">닫기</button>
      </div>
    </div>`;
  const qi=$('emoQ');
  qi.oninput=()=>{ emoPick.q=qi.value; const at=qi.selectionStart; emojiPickDraw();
    const n=$('emoQ'); if(n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(e){} } };
  $('emoBox').querySelectorAll('[data-cat]').forEach(c=> c.onclick=()=>{ emoPick.cat=c.dataset.cat; emoPick.q=''; emojiPickDraw(); });
  $('emoBox').querySelectorAll('[data-pick]').forEach(b=> b.onclick=()=> emojiPickSet(b.dataset.pick));
  /* 직접 넣기 — 사전에 없는 그림도 쓸 수 있는 탈출구 */
  const di=$('emoDirect'), pv=$('emoDirectPv'), use=$('emoUse');
  const syncDirect=()=>{
    emoPick.direct=di.value;                 /* 검색으로 화면을 다시 그려도 남아 있게 */
    const e=emojiFirst(di.value);
    pv.textContent = e || (di.value.trim() ? '✕' : '');   /* 그림이 아니면 왜 못 넣는지 보이게 */
    pv.style.color = e ? '' : 'var(--bad)';
    use.disabled = !e;
  };
  const useDirect=()=>{ const e=emojiFirst(di.value); if(e) emojiPickSet(e); };
  di.oninput=syncDirect;
  di.onkeydown=(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); useDirect(); } };
  use.onclick=useDirect;
  syncDirect();
  $('emoNone').onclick=()=> emojiPickSet('');
  $('emoClose').onclick=emojiPickClose;
}
function emojiPickCell(d, cur){
  return `<button data-pick="${esc(d[0])}" class="${d[0]===cur?'on':''}" title="${esc(d[2]||'')}">${d[0]}</button>`;
}
$('emoPick').onclick=(e)=>{ if(e.target.id==='emoPick') emojiPickClose(); };   /* 바깥을 누르면 닫기 */

/* ---------- 그림 고르기 한 줄 (과제 만들기의 빙고 설정에서 씀) ----------
   보관함 항목의 emoji 값을 그대로 다룬다: '' = 아직 안 정함, '-' = 일부러 글자로, 그 외 = 이모지 */
function emojiRowsHTML(items){

    const cur=i.emoji==='-'? '' : (i.emoji||'');
    return `<div class="item-row">
      <input class="bg-emo" data-emoin="${k}" value="${esc(cur)}" placeholder="글자" maxlength="8"
        title="이모지를 직접 넣거나 붙여넣기 (비우면 한글 뜻이 글자로 나와요)" aria-label="${esc(i.text)} 그림">
      <button class="bg-emo-cyc" data-emocyc="${k}" title="추천 그림으로 바꾸기">🔄</button>
      <button class="bg-emo-cyc" data-emopick="${k}" title="그림 목록에서 고르기">🔎</button>
      <span class="txt">${esc(i.text)}${i.meaning?`<span class="muted" style="font-size:.85rem"> — ${esc(i.meaning)}</span>`:''}</span>
    </div>`;

}
/* sugg: 추천 후보를 뽑는 방법 (기본은 듣기 빙고, 카드 미션은 한글 뜻까지 본다) */
function emojiRowsBind(root, items, redraw, sugg){
  const cand = sugg || (i=> bingoSuggest(i.text,4));
  /* 선생님이 손대면 emojiAuto=false — 낱말 칸을 고쳐도 이 그림은 그대로 둔다 */
  root.querySelectorAll('[data-emoin]').forEach(inp=> inp.oninput=()=>{
    const i=items[+inp.dataset.emoin]; const v=inp.value.trim();
    i.emoji = v || '-'; i.emojiAuto=false;                                  /* 다시 그리지 않는다(커서 유지) */
  });
  root.querySelectorAll('[data-emocyc]').forEach(b=> b.onclick=()=>{
    const i=items[+b.dataset.emocyc], cands=cand(i);
    i.emojiAuto=false;
    if(!cands.length){ i.emoji='-'; return redraw(); }
    const cur=i.emoji==='-'? '' : (i.emoji||'');
    const at=cands.indexOf(cur);
    i.emoji = at<0 ? cands[0] : (at+1>=cands.length ? '-' : cands[at+1]);
    redraw();
  });
  root.querySelectorAll('[data-emopick]').forEach(b=> b.onclick=()=>{
    const k=+b.dataset.emopick, i=items[k];
    emojiPickOpen({ text:i.text, meaning:i.meaning||'', cands:cand(i),
      cur:(i.emoji==='-'?'':(i.emoji||'')),
      onPick:(e)=>{ i.emoji = e || '-'; i.emojiAuto=false; redraw(); } });
  });
}
/* ---------- 선생님: 진행 ---------- */
function bingoRun(sess){
  bingoLeave();
  if(sess.iv==null) sess.iv=0;                       /* 자동 진행이 없던 예전 게임은 수동으로 */
  BG={ role:'teacher', sess, players:[], unsubs:[], repeatT:0,
       autoT:0, tickT:0, paused:false, nextAt:0 };
  const cls=DB.classes.find(x=>x.id===sess.classId);
  BG.roster = cls? cls.students : [];
  if(fbReady && window.__store){
    BG.unsubs.push(window.__store.watchWhere(colName('progress'), 'value.sess', sess.id, (rows)=>{
      BG.players=rows; bingoRunDraw();
    }));
  }
  BG.tickT=setInterval(bingoAutoTick, 250);          /* 남은 시간만 갱신 — 화면을 통째로 다시 그리지 않는다 */
  bingoRunDraw();
}
/* ---------- 자동 진행 (선생님 기기에서만 돈다) ---------- */
/* 읽어주는 데 걸리는 시간 어림값 — 느린 목소리로 바꾸면 그만큼 길어진다.
   앞뒤 여백까지 넉넉히 잡는다. 선생님 기기와 학생 태블릿이 같은 계산을 써야 단계가 어긋나지 않으므로,
   실제 음성 길이로 보정하지 않고 이 어림값 하나만 쓴다. */
function bingoSayMs(text, twice){
  const words=String(text||'').trim().split(/\s+/).length;
  const one=Math.max(1200, words*380/Math.max(0.5, VOICE.rate) + 700);
  return twice? one*2+700 : one;
}
function bingoAutoSchedule(){
  if(!BG || BG.role!=='teacher') return;
  clearTimeout(BG.autoT); BG.autoT=0;
  const s=BG.sess;
  if(!(s.iv>0) || s.status!=='playing' || BG.paused){ BG.nextAt=0; return; }
  /* 음악·호루라기·문장을 다 들려주고도 생각할 틈은 남아야 한다 — 그보다 짧게는 넘기지 않는다 */
  const wait=Math.max(s.iv*1000, BG_INTRO_MS+(BG.sayMs||0)+3000);   /* 생각할 시간 최소 3초 */
  BG.nextAt=Date.now()+wait;
  BG.autoT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoNext(); }, wait);
}
function bingoAutoTick(){
  if(!BG || BG.role!=='teacher') return;
  const el=$('bgTick'); if(!el) return;
  const s=BG.sess;
  if(!(s.iv>0) || s.status!=='playing'){ el.textContent=''; return; }
  if(BG.paused){ el.textContent='⏸ 잠깐 멈춤'; return; }
  if(!BG.nextAt){ el.textContent=''; return; }
  el.textContent=`${Math.max(0,Math.ceil((BG.nextAt-Date.now())/1000))}초 뒤 다음 표현`;
}
function bingoAutoPause(){
  BG.paused=!BG.paused;
  if(BG.paused){ clearTimeout(BG.autoT); BG.autoT=0; BG.nextAt=0; }
  else bingoAutoSchedule();
  bingoRunDraw();
}
/* 간격 조절 — 수업 분위기를 보고 바로 늘리거나 줄일 수 있어야 한다 */
function bingoAutoSet(v){
  v=Math.max(4, Math.min(30, v|0));
  BG.paused=false;
  bingoTeacherSave({iv:v});          /* 새로고침해도 유지되도록 세션에 같이 저장 */
  bingoAutoSchedule();
}
function bingoAutoOff(){
  clearTimeout(BG.autoT); BG.autoT=0; BG.nextAt=0; BG.paused=false;
  bingoTeacherSave({iv:0});
}
function bingoTeacherSave(patch){
  Object.assign(BG.sess, patch, {updatedAt:Date.now()});
  sSet(bingoKey(BG.sess.classId), BG.sess);   /* 판정·저장은 선생님 기기 한 대만 한다 */
  bingoRunDraw();
}
function bingoNext(){
  const s=BG.sess;
  const unseen=s.items.map((_,i)=>i).filter(i=>!s.calls.includes(i));
  const pool=unseen.length?unseen:s.items.map((_,i)=>i);       /* 다 들려줬으면 처음부터 다시 */
  const pick=pool[Math.floor(Math.random()*pool.length)];
  clearTimeout(BG.repeatT); clearTimeout(BG.sayT); clearTimeout(BG.whistleT);
  const text=s.items[pick].t;
  BG.callAt=Date.now();
  BG.sayMs=bingoSayMs(text, false);                 /* 문장은 한 번만 들려준다 */
  bingoJingle();                                    /* ① 경쾌한 음악 */
  BG.whistleT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoWhistle(); }, BG_JINGLE_MS);      /* ② 삑~ */
  BG.sayT=setTimeout(()=>{ if(BG && BG.role==='teacher') bingoSay(text, false); }, BG_INTRO_MS);    /* ③ 듣기 */
  bingoTeacherSave({ calls:[...s.calls, pick], at:Date.now(), status:'playing' });
  bingoPhaseTimers(bingoRunDraw);                   /* ④ 생각·터치 */
  bingoAutoSchedule();
}
function bingoRunDraw(){
  if(!BG || BG.role!=='teacher') return;
  if(BG.learn) return bingoLearnDraw();
  const s=BG.sess, ci=s.calls.length? s.calls[s.calls.length-1] : -1, it=ci>=0? s.items[ci] : null;
  /* 게임 중에는 정답을 화면에 절대 띄우지 않는다.
     이 화면이 곧 교실 TV라, 그림이나 문장이 뜨면 늦게 누르는 학생이 소리 대신 화면을 보고 찍는다. */
  const ph=bingoPhase();
  let stage, stageCls='';
  if(s.status==='ready') stage=`<div class="em">👂</div><div class="tx">Listen &amp; Bingo</div>
      <div class="hint">아래 <b>첫 표현 들려주기</b>를 누르면 시작해요</div>`;
  else if(s.status==='done') stage=`<div class="tx">Good job! 🎉</div>
      <div class="hint">${BG.players.filter(p=>p.bingo).length}명이 빙고를 완성했어요</div>`;
  else if(ph==='jingle'){ stageCls=' jingle';
    stage=`<div class="em bg-bounce">🎵</div><div class="tx" style="font-size:1.8rem">${s.calls.length}번째 표현</div>
      <div class="hint">곧 시작해요</div>`; }
  else if(ph==='whistle'){ stageCls=' whistle';
    stage=`<div class="em">📣</div><div class="tx" style="font-size:2rem">집중!</div>
      <div class="hint">잘 들을 준비</div>`; }
  else if(ph==='listen') stage=`<div class="ear">🔊</div><div class="tx" style="font-size:1.5rem">잘 들어요</div>
      <div class="hint">한 번만 들려줍니다</div>`;
  else { stageCls=' think';
    stage=`<div class="em">👆</div><div class="tx" style="font-size:1.6rem">빙고판에서 찾아 누르세요</div>
      <div class="hint">${s.calls.length}번째 · 한 칸만 누를 수 있어요</div>`; }
  /* 들려준 표현은 게임이 끝난 뒤에만 공개한다 (놓친 학생이 뒤늦게 따라 찍는 것도 막는다) */
  const review= s.status!=='done' ? '' : `<div class="card noanim">
      <h3 style="margin:0 0 10px">🔎 들려준 표현 (${s.calls.length}번)</h3>
      <div class="bg-review">${s.calls.map((c,k)=>`<span><b>${k+1}</b> ${s.items[c].e||''} ${esc(s.items[c].t)}</span>`).join('')}</div>
    </div>`;
  /* 명단과 학생 기록을 합친다 — 아직 안 들어온 학생도 보이도록 */
  const byId={}; BG.players.forEach(p=> byId[p.sid]=p);
  const rows=(BG.roster.length? BG.roster.map(st=>({ sid:st.id, name:st.name, p:byId[st.id] }))
    : BG.players.map(p=>({ sid:p.sid, name:p.name, p })));
  const near=rows.filter(r=>r.p && !r.p.bingo && r.p.lines>=s.target-1).length;
  const wins=rows.filter(r=>r.p && r.p.bingo).length;
  const tiles=rows.map(r=>{ const p=r.p;
    const c=p? (p.bingo?'win':(p.lines>=s.target-1?'near':'')) : '';
    const st=p? (p.bingo?'🎉 빙고!':`${p.lines}줄 · ${p.marks.filter(Boolean).length}칸`) : '아직 안 들어옴';
    return `<div class="bg-stu ${c}"><div class="nm">${esc(r.name)}</div><div class="st">${st}</div></div>`;}).join('');
  app.innerHTML=`<button class="back" onclick="bingoQuitTeacher()">← 선생님 메뉴</button>
    <div class="card noanim">
      <div class="bg-stage${stageCls}">${stage}</div>
      <div class="center" style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
        ${s.status==='ready'?`<button class="btn ghost" id="bgLearn">📖 표현 익히기</button>`:''}
        ${s.status!=='done'?`<button class="btn lg" id="bgNext">${s.calls.length?'다음 표현 ▶':'첫 표현 들려주기 ▶'}</button>`:''}
        ${s.calls.length&&s.status!=='done'?`<button class="btn ghost" id="bgAgain">🔁 다시 들려주기</button>`:''}
        ${s.status!=='done'?`<button class="btn ghost" id="bgEnd">게임 끝내기</button>`
          :`<button class="btn coral" id="bgNew">새 게임 만들기</button>`}
        <button class="btn ghost" id="bgClose">🗑 게임 닫기</button>
        <button class="btn ghost" id="bgPrint">🖨️ 종이 빙고판</button>
      </div>
      ${s.status==='done'? '' : `<div class="bg-auto">
        ${s.iv>0? `
          <button class="btn sm ${BG.paused?'coral':'ghost'}" id="bgPause">${BG.paused?'▶ 이어서 하기':'⏸ 잠깐 멈춤'}</button>
          <span class="ivbox">
            <button class="btn sm ghost" id="bgSlow" title="간격 줄이기 (빠르게)" ${s.iv<=4?'disabled':''}>−</button>
            <b>${s.iv}초 간격</b>
            <button class="btn sm ghost" id="bgFast" title="간격 늘리기 (천천히)" ${s.iv>=30?'disabled':''}>+</button>
          </span>
          <span class="tick" id="bgTick"></span>
          <button class="btn sm ghost" id="bgManual">✋ 수동으로</button>`
        : `<button class="btn sm ghost" id="bgAuto">⏱ 자동 진행 켜기 (14초마다)</button>
           <span class="muted" style="font-size:.82rem">켜면 누르지 않아도 다음 표현이 나와요</span>`}
      </div>`}
      <div class="bg-stat">
        <div><b>${s.calls.length}</b><span>들려준 횟수</span></div>
        <div><b>${near}</b><span>한 줄 남은 학생</span></div>
        <div><b>${wins}</b><span>빙고 완성</span></div>
      </div>
      <p class="muted center">${s.n}×${s.n} · ${s.target}빙고 · 표현 ${s.items.length}개 · ${esc(s.className||'')}</p>
    </div>
    <div class="card noanim">
      <h3 style="margin:0 0 10px">학생별 현황</h3>
      ${rows.length? `<div class="bg-grid">${tiles}</div>`
        : '<p class="muted">이 학급에 등록된 학생이 없어요. 종이 빙고판으로도 놀 수 있어요.</p>'}
    </div>
    ${review}`;
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('bgNext', bingoNext);
  on('bgLearn', ()=> bingoLearn(0));
  on('bgAgain', ()=>{ if(it) bingoSay(it.t, false); });
  on('bgEnd', ()=>{ clearTimeout(BG.repeatT); clearTimeout(BG.autoT);
    BG.autoT=0; BG.nextAt=0; speakStop(); bingoTeacherSave({status:'done'}); });
  on('bgNew', ()=> bingoPickAssignment(s.classId));
  on('bgClose', async ()=>{
    if(!confirm('게임을 닫을까요?\n학생 태블릿에서 빙고판이 사라지고, 지금까지 체크한 것도 지워져요.\n(과제는 그대로 남아서 언제든 다시 시작할 수 있어요)')) return;
    const cid=s.classId;
    clearTimeout(BG.autoT); speakStop();
    await bingoCloseGame(cid);
    bingoLeave();
    toast('게임을 닫았어요. 학생 화면에서 내려갔어요');
    bingoPickAssignment(cid);
  });
  on('bgPrint', bingoPrint);
  on('bgPause', bingoAutoPause);
  on('bgSlow', ()=> bingoAutoSet(s.iv-2));      /* 화면에 보이는 '초' 숫자를 그대로 올리고 내린다 */
  on('bgFast', ()=> bingoAutoSet(s.iv+2));
  on('bgManual', bingoAutoOff);
  on('bgAuto', ()=> bingoAutoSet(14));
  bingoAutoTick();
}
function bingoQuitTeacher(){ bingoLeave(); missionRoomTeacher(); }
/* ---------- 게임 전 단계: TV로 표현 익히기 (Listen and Repeat) ---------- */
function bingoLearn(i){
  BG.learn={ i:Math.max(0, Math.min(BG.sess.items.length-1, i||0)) };
  bingoRunDraw();
  bingoSay(BG.sess.items[BG.learn.i].t, false);
}
function bingoLearnDraw(){
  const s=BG.sess, L=BG.learn, it=s.items[L.i];
  app.innerHTML=`<button class="back" id="lnClose">← 게임 화면으로</button>
    <div class="card noanim">
      <div class="bg-stage" style="min-height:300px">
        <div class="em" style="font-size:7rem">${it.e||'🔤'}</div>
        <div class="tx">${esc(it.t)}</div>
        ${it.m?`<div class="mn" style="font-size:1.2rem">${esc(it.m)}</div>`:''}
      </div>
      <div class="center" style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
        <button class="btn ghost" id="lnPrev" ${L.i===0?'disabled':''}>◀ 이전</button>
        <button class="btn" id="lnSay">🔊 다시 들려주기</button>
        <button class="btn ghost" id="lnNext" ${L.i>=s.items.length-1?'disabled':''}>다음 ▶</button>
      </div>
      <p class="muted center" style="margin-top:12px">${L.i+1} / ${s.items.length} · 학생들과 함께 듣고 따라 말해 보세요</p>
      <div class="bg-review" style="margin-top:12px; justify-content:center">
        ${s.items.map((x,k)=>`<span data-ln="${k}" style="cursor:pointer; ${k===L.i?'border-color:var(--green); background:#E9F6F0':''}">${x.e||''} ${esc(x.t)}</span>`).join('')}
      </div>
    </div>`;
  $('lnClose').onclick=()=>{ BG.learn=null; speakStop(); bingoRunDraw(); };
  $('lnSay').onclick=()=> bingoSay(it.t, false);
  const pv=$('lnPrev'), nx=$('lnNext');
  if(pv && L.i>0) pv.onclick=()=> bingoLearn(L.i-1);
  if(nx && L.i<s.items.length-1) nx.onclick=()=> bingoLearn(L.i+1);
  app.querySelectorAll('[data-ln]').forEach(b=> b.onclick=()=> bingoLearn(+b.dataset.ln));
}
/* 종이 빙고판 — 태블릿으로 들어온 학생과 같은 판이 나오도록 같은 씨앗을 쓴다 */
function bingoPrint(){

function bingoStudentQuit(){ bingoLeave(); studentPickName(session.classId); }
/* 새 게임이 열리면 내 판을 새로 만든다 */
function bingoStudentSync(){

  }
  if(s && s.status!=='ready' && BG.pr){ BG.pr=null; speakStop(); }   /* 게임이 시작되면 연습은 끝 */
  /* 새 표현이 도착한 순간부터 이 기기 기준으로 단계를 잰다 (선생님 기기와 시계가 달라도 안전) */
  if(s && s.status==='playing' && s.calls.length !== BG.seenCalls){
    BG.seenCalls=s.calls.length;
    BG.callAt=Date.now();
    BG.sayMs=bingoSayMs(s.items[s.calls[s.calls.length-1]].t, false);
    bingoPhaseTimers(()=>{ if(BG && BG.role==='student') bingoStudentDraw(); });
  }
  bingoStudentDraw();
}
async function bingoTap(cell){
  const s=BG.sess, me=BG.me;
  if(!s || s.status!=='playing' || me.bingo) return;
  if(bingoPhase()!=='think') return;          /* 듣는 동안에는 판이 안 보이므로 눌릴 일도 없다 */
  const callIdx=s.calls.length-1, ei=s.calls[callIdx];
  /* 방금 이번 차례에 찍은 칸은 취소할 수 있다 (지난 차례 것은 못 고침) */
  if(me.lastCall===callIdx && me.lastCell===cell){
    me.marks[cell]=false; me.lastCall=-1; me.lastCell=-1;
    me.lines=bingoDoneLines(me.marks,s.n).length; BG.fb='취소했어요. 다시 골라도 돼요';
    bingoStudentDraw(); return bingoSaveMe();
  }
  if(me.lastCall===callIdx){ BG.fb='이번 소리는 이미 체크했어요'; return bingoStudentDraw(); }
  if(me.marks[cell]){ BG.fb='이미 체크한 칸이에요'; BG.shake=cell; return bingoStudentDraw(); }
  const board=bingoBoard(s.id+'|'+session.studentId, s.n, s.items.length);
  if(board[cell]!==ei){ BG.fb='다른 그림이에요. 다시 들어보세요'; BG.shake=cell; return bingoStudentDraw(); }
  me.marks[cell]=true; me.lastCall=callIdx; me.lastCell=cell;
  me.lines=bingoDoneLines(me.marks,s.n).length;
  BG.fb='좋아요! 잘 찾았어요';
  if(me.lines>=s.target && !me.bingo){ me.bingo=true; showCeleb(`${s.target}빙고 완성! 손을 들어 선생님께 알려요 🎉`); }
  bingoStudentDraw();
  await bingoSaveMe();
}
async function bingoSaveMe(){ BG.me.updatedAt=Date.now(); await sSet(bingoPKey(session.classId, session.studentId), BG.me); }

/* 열려 있는 게임을 완전히 내린다 — 세션과 학생 판 기록을 지운다.
   이걸 안 하면 학생 태블릿에 빙고가 계속 떠 있는다. 과제를 지울 때도 같이 불러야 한다. */
async function bingoCloseGame(cid){
  await sDel(bingoKey(cid));

/* ---------- 게임 전 연습: 그림 ↔ 문장 맞추기 ---------- */
/* 빙고는 "듣고 그림 찾기"라, 그 전에 어떤 그림이 어떤 표현인지 익혀 두어야 게임이 된다.
   문제는 학생 기기 안에서만 만들고 채점한다 — 저장도, 통신도 없다. */
function bingoPracticeStart(dir){
  const s=BG.sess; if(!s) return;
  const n=s.items.length, k=Math.min(4, n);
  const qs=bgShuffle([...Array(n).keys()]).map(ans=>{
    const others=bgShuffle([...Array(n).keys()].filter(i=>i!==ans)).slice(0, k-1);
    return { ans, opts:bgShuffle([ans, ...others]) };
  });
  BG.pr={ dir:dir||'toPic', qs, i:0, ok:0, tries:0, wrongSel:-1, justOk:false };
  bingoStudentDraw();
}
function bingoPracticeAnswer(choice){
  const p=BG.pr, q=p.qs[p.i];
  if(p.justOk) return;
  p.tries++;
  if(choice!==q.ans){ p.wrongSel=choice; bingoStudentDraw(); return; }
  p.ok++; p.justOk=true; p.wrongSel=-1;
  bingoStudentDraw();
  setTimeout(()=>{                       /* 맞았다는 표시를 잠깐 보여주고 다음 문제로 */
    if(!BG || !BG.pr) return;
    BG.pr.justOk=false; BG.pr.i++;
    bingoStudentDraw();
  }, 750);
}
function bingoPracticeQuit(){ BG.pr=null; bingoStudentDraw(); }
function bingoPracticeDraw(wrap){

  const opts=q.opts.map(oi=>{

    <div style="display:flex; align-items:center; gap:10px; margin:4px 0 10px">

      <span class="pill ${p.justOk?'done':'not'}">${p.i+1} / ${p.qs.length}</span>
    </div>
    <div class="progress" style="margin-bottom:12px"><div style="width:${Math.round(p.i/p.qs.length*100)}%"></div></div>

function bingoStudentDraw(){

  const wrap=$('bgWrap'); if(!wrap) return;

  if(!s){ wrap.className='card empty';
    wrap.innerHTML='<span class="em">🕰️</span>아직 빙고가 열리지 않았어요.<br>선생님이 시작하면 바로 나와요!'; return; }
  if(BG.pr && s.status==='ready'){ bingoPracticeDraw(wrap); return; }   /* 시작 전에는 연습 화면 */

      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px">

  const me=BG.me;

  const lit=new Set(); bingoDoneLines(me.marks,s.n).forEach(l=>l.forEach(i=>lit.add(i)));
  const done=(s.status!=='playing')||me.bingo;
  const cells=board.map((v,i)=>{ const it=s.items[v];

    const face= it.e? `<span class="e">${it.e}</span>` : `<span class="w">${esc(it.m||it.t)}</span>`;
    return `<button class="${cls}" data-cell="${i}" aria-label="${esc(it.m||it.t)}">${face}</button>`;

      <div class="hint">${me.bingo?'빙고를 완성했어요!':`${me.lines}줄 완성했어요`}</div></div>`;

    head=`<div class="bg-stage jingle" style="min-height:200px"><div class="em bg-bounce" style="font-size:4rem">🎵</div>

      <div class="hint">곧 시작해요</div></div>`; }
  else if(ph==='whistle'){ showBoard=false;
    head=`<div class="bg-stage whistle" style="min-height:200px"><div class="em" style="font-size:4rem">📣</div>
      <div class="tx" style="font-size:1.8rem">집중!</div>

  else if(ph==='listen'){ showBoard=false;
    head=`<div class="bg-stage" style="min-height:200px"><div class="ear">🔊</div>
      <div class="tx" style="font-size:1.4rem">잘 들어요</div>
      <div class="hint">한 번만 들려줍니다</div></div>`; }
  else head=`<div class="bg-stage think" style="min-height:96px"><div class="tx" style="font-size:1.3rem">👆 지금 눌러요</div>
      <div class="hint">${s.calls.length}번째 · 한 칸만</div></div>`;
  wrap.className='card';
  wrap.innerHTML=`
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">

    </div>
    ${head}
    ${showBoard? `<div class="bg-board" style="grid-template-columns:repeat(${s.n},1fr)">${cells}</div>
    <div class="bg-foot ${/좋아요/.test(BG.fb)?'hit':(BG.fb?'miss':'')}">
      ${me.bingo? 'BINGO! 🎉 손을 들어요' : (over? '게임이 끝났어요' : (BG.fb||'들은 그림을 한 칸만 눌러요'))}</div>`
    : `<div class="bg-foot">빙고판은 소리가 끝나면 나와요</div>`}`;
  /* 소리는 선생님 기기 한 대만 낸다 — 태블릿마다 따로 울리면 교실이 시끄럽고 어느 소리인지 헷갈린다 */
  BG.fb=''; BG.shake=-1;

}

/* ============================ 카드 미션 (친구 찾기 말하기) ============================ */
/* 저장 위치
   · 세트(선생님만 씀) : v1:mingle → eng_app/mingle — 세트 전부를 배열 한 문서에 담는다(읽기 1회)
   · 학생 배정·도장    : v1:prog:mingle:<세트>:<학급>:<학생> → eng_progress/mingle__…
   기존 보안 규칙(eng_app=선생님만 쓰기 / eng_progress=인증되면 쓰기)을 그대로 쓴다. 규칙 수정 불필요.

   쓰기 횟수: 학생 최초 입장 1회(카드·보드 배정) + 도장 1개당 1회. 룰렛·화면 이동은 저장하지 않는다.
   도장은 언제나 '도장을 받는 학생의 기기'가 자기 문서에만 쓴다 → 한 문서를 쓰는 기기는 늘 하나뿐.
   다만 친구가 아직 입장 전이면 사인 화면에서 친구 배정을 대신 만들어야 하므로, 그 자리만
   트랜잭션(store.ensure)으로 처리한다 — 친구 기기와 동시에 만들어도 카드가 갈리지 않는다. */
const mgPKey = (setId,cid,sid)=> `v1:prog:mingle:${setId}:${cid}:${sid}`;
const MG_INKS = ['#D8543A','#2C6FA8','#2F8F77','#8E5AA8','#D9A324'];
const MG_PUBS = ['천재(함)','천재(윤)','YBM(김)','YBM(최)','대교','동아','지학사','미래엔'];
let MG=null, mgUnsub=null, mgSaveArm=false;

/* 화면을 떠날 때 구독·오버레이를 정리한다 (안 하면 요금이 계속 샌다) */
function mingleLeave(){
  if(mgUnsub){ try{ mgUnsub(); }catch(e){} mgUnsub=null; }
  document.querySelectorAll('.mg-ov,.mg-conf').forEach(el=> el.remove());
  if(app) app.classList.remove('mg-tv');
  mgWide(false);
  MG=null;
}
/* 카드 미션 화면에서만 본문을 좌우로 넓게 쓴다 (낱말이 한 줄에 다 들어가도록) */
function mgWide(on){ document.body.classList.toggle('mg-wide', !!on); }
function mgSets(){ return (DB.mingle||[]).slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)); }
/* 이 세트를 받은 학급들 (classIds가 없는 옛 세트는 전체 학급) */
function mgClasses(set){
  if(!set) return [];
  if(!set.classIds || !set.classIds.length) return DB.classes.slice();
  return DB.classes.filter(c=> set.classIds.includes(c.id));
}
function mgClassNames(set){
  if(!set.classIds || !set.classIds.length) return '전체 학급';
  const list=mgClasses(set);
  return list.length ? list.map(c=>c.name).join(', ') : '배부된 학급 없음(지워진 학급)';
}
function mgSet(id){ return (DB.mingle||[]).find(s=>s.id===id) || null; }
function mgTotal(p){ return (p && p.board ? p.board : []).reduce((a,b)=>a+b,0); }
/* 그림 추천 — 듣기 빙고와 같은 사전을 쓴다(영어 키워드 + 한글 이름) */
function mgSuggest(en, ko){
  const out = bingoSuggest(en, 8).slice();
  const k = String(ko||'').trim();
  if(k) BINGO_EMO.forEach(d=>{
    const nm = d[2]||'';
    if((k.length>=2 ? nm.includes(k) : nm===k) && !out.includes(d[0])) out.push(d[0]);
  });
  return out.slice(0,12);
}

/* 배정: 내 카드 1장 + 카드별 만날 친구 수 (모든 카드 최소 1명, 카드당 최대 cap명) */
function mgMakeAssign(set){
  const K=set.cards.length;
  const card=Math.floor(Math.random()*K);
  const board=Array(K).fill(1);
  let left=Math.max(0, (set.goal||K)-K), guard=0;
  while(left>0 && guard++<800){ const i=Math.floor(Math.random()*K); if(board[i]<set.cap){ board[i]++; left--; } }
  return { card, board };
}
/* 배정이 없거나 세트가 바뀌었으면(ver 불일치) 새로 만든다. 그대로면 쓰기 0회. */
async function mgEnsure(set, cid, stu){
  const key=mgPKey(set.id, cid, stu.id), ref=keyRef(key);
  let made=false;
  const resolve=(cur)=>{
    if(cur && cur.ver===set.ver && Array.isArray(cur.board) && cur.board.length===set.cards.length){
      made=false; return null;                       /* 그대로 쓴다 → 쓰기 없음 */
    }
    made=true;
    const a=mgMakeAssign(set);
    return { setId:set.id, classId:cid, sid:stu.id, name:stu.name, mgKey:set.id+'|'+cid,
             ver:set.ver, card:a.card, board:a.board, stamps:[], startedAt:Date.now() };
  };
  if(fbReady && window.__store && window.__store.ensure){
    try{ const val=await window.__store.ensure(ref.col, ref.id, resolve); return { doc:val, made }; }
    catch(e){ console.warn('mgEnsure', e); }        /* 트랜잭션이 막히면 아래 방식으로 */
  }
  const cur=await sGet(key, null);
  const next=resolve(cur);
  if(next){ await sSet(key, next); return { doc:next, made:true }; }
  return { doc:cur, made:false };
}

/* 룰렛 — 카드마다 한 번씩 돌려 그 카드의 친구 수를 정한다.
   이미 저장된 배분(board) 숫자 칸에 착지시키므로 연출과 데이터가 절대 어긋나지 않는다.
   스핀 횟수 = 카드 수 (목표가 25명이어도 연출 시간은 그대로) */
function mgRoulette(ov){
  const st=MG.set, p=MG.prog, K=st.cards.length;
  const SEG=8, cap=Math.max(1, st.cap||3);
  const vals=Array.from({length:SEG},(_,i)=>(i%cap)+1);
  const PAS=['#F6D2CE','#CFE0EF','#D5EBDD','#E4D7EE','#F6E3C6','#F9EFD6','#EAD9CD','#D8E8EA'];
  const segA=360/SEG;
  const grad=vals.map((_,i)=>`${PAS[i%PAS.length]} ${i*segA}deg ${(i+1)*segA}deg`).join(',');
  ov.innerHTML=`
    <button class="btn mg-skip">건너뛰기</button>
    <div class="mg-roul">
      <div class="mg-stat" id="mgStat">🎡 카드마다 룰렛을 돌려 만날 친구 수를 정해요!</div>
      <div class="mg-pin"></div>
      <div style="position:relative">
        <div class="mg-wheel" id="mgWheel" style="background:conic-gradient(${grad})">
          ${vals.map((v,i)=>`<span style="--a:${i*segA+segA/2}deg">${v}</span>`).join('')}
        </div>
        <div class="mg-hub" id="mgHub">${st.cards[0].em||'🃏'}</div>
      </div>
      <div class="mg-tally">${st.cards.map((c,i)=>`<div class="c${i===0?' now':''}" id="mgC${i}">${c.em||'🃏'}<b>?</b></div>`).join('')}</div>
      <button class="btn coral lg" id="mgSpin" style="width:250px">🎡 룰렛 돌리기!</button>
    </div>`;
  ov.querySelector('.mg-skip').onclick=()=> ov.remove();
  const wheel=$('mgWheel'), hub=$('mgHub'), btn=$('mgSpin'), stat=$('mgStat');
  let rot=0, step=0;
  const ask=()=> `${st.cards[step].em||''} ${st.cards[step].en} 친구는 몇 명일까?`;
  btn.onclick=()=>{
    if(step>=K){ ov.remove(); return; }               /* 다 돌린 뒤: 보드 보러 가기 */
    btn.disabled=true; stat.textContent=ask(); spin();
  };
  function spin(){
    if(!document.body.contains(ov)) return;           /* 건너뛰기로 닫힌 경우 */
    const n=p.board[step]||0;
    const hits=vals.map((v,i)=> v===n ? i : -1).filter(i=>i>=0);
    const seg=hits.length ? hits[Math.floor(Math.random()*hits.length)] : 0;
    const dur = step===0 ? 2200 : 1200;               /* 첫 스핀만 길게 */
    const land = 360-(seg*segA+segA/2);
    rot = Math.ceil(rot/360)*360 + (step===0?4:2)*360 + land;
    wheel.style.transition=`transform ${dur}ms cubic-bezier(.15,.85,.25,1)`;
    wheel.style.transform=`rotate(${rot}deg)`;
    setTimeout(()=>{
      if(!document.body.contains(ov)) return;
      const ch=$('mgC'+step);
      ch.querySelector('b').textContent='×'+n;
      ch.classList.remove('now','bump'); void ch.offsetWidth; ch.classList.add('bump');
      stat.textContent=`${st.cards[step].em||''} ${st.cards[step].en} 친구 ${n}명!`;
      step++;
      if(step<K){
        hub.textContent=st.cards[step].em||'🃏';
        $('mgC'+step).classList.add('now');
        setTimeout(()=>{ if(!document.body.contains(ov)) return; stat.textContent=ask(); spin(); }, 500);
      } else {
        btn.disabled=false; btn.textContent='✅ 미션 보드 보러 가기';
        stat.textContent=`🎯 모두 ${mgTotal(p)}명! 이제 친구를 찾아 떠나요!`;
      }
    }, dur+100);
  }
}

/* 1초 길게 누르면 도장. 채워지는 고리는 rAF로 그리지만, 완료 판정은 타이머로 한다
   — 화면이 잠깐 가려져 rAF가 멈춰도 도장이 안 찍히는 일이 없도록. */
function mgHold(){
  const btn=$('mgHold'); if(!btn) return;
  const DUR=1000; let t0=0, raf=0, timer=0;
  const stop=()=>{
    if(raf) cancelAnimationFrame(raf); raf=0;
    if(timer) clearTimeout(timer); timer=0;
    btn.style.setProperty('--p',0);
  };
  const tick=()=>{
    btn.style.setProperty('--p', Math.min(100,(performance.now()-t0)/DUR*100));
    raf=requestAnimationFrame(tick);
  };
  btn.addEventListener('pointerdown', e=>{
    e.preventDefault(); stop();
    t0=performance.now();
    raf=requestAnimationFrame(tick);
    timer=setTimeout(()=>{ stop(); mgDoStamp(); }, DUR);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=> btn.addEventListener(ev, stop));
}

async function mgDoStamp(){
  if(!MG || !MG.pend) return;
  const pend=MG.pend; MG.pend=null;
  const key=mgPKey(MG.set.id, session.classId, session.studentId), ref=keyRef(key);
  const item={ pid:pend.id, pname:pend.name, cardIdx:pend.cardIdx, at:Date.now() };
  MG.prog.stamps=[...(MG.prog.stamps||[]), item];
  mingleMission();                                    /* 저장을 기다리지 않고 먼저 보여 준다 */
  let ok=false;
  if(fbReady && window.__store && window.__store.push){
    try{ await window.__store.push(ref.col, ref.id, 'stamps', item); ok=true; }
    catch(e){ console.warn('mgStamp', e); }
  }
  if(!ok) ok=await sSet(key, MG.prog);                /* 문서가 없거나 실패하면 통째로 저장 */
  if(!ok) toast('도장을 저장하지 못했어요. 잠시 뒤 다시 해 주세요.');
}

/* ============================ 보드게임 (주사위 말판) ============================
   태블릿만으로 하는 모둠 보드게임. 실물 주사위·말·카드가 하나도 필요 없다.
   · 선생님: 과제 만들기에서 낱말·인원·칸 수를 정하고 → 미션 활동에서 학급을 골라 모둠을 짠다
   · 학생: 같은 모둠끼리 한 말판을 나눠 보며 차례로 주사위를 굴린다 (모든 기기가 실시간 동기화)
   저장 위치 — 모둠 편성은 선생님만 쓰는 eng_app, 게임판은 학생도 쓰므로 eng_progress. */
const BD_TOKENS=['🐰','🐻','🐼','🦊','🐯','🐨'];
const bdKey  = (setId,cid)=> `v1:bd:${setId}:${cid}`;                 /* 모둠 편성 (선생님이 씀) */
const bdRKey = (setId,cid,g)=> `v1:prog:bd:${setId}:${cid}:${g}`;     /* 모둠별 게임판 (학생이 씀) */
let BD=null, bdUnsubs=[];

function bdLeave(){
  groupRevealClose();
  bdUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  bdUnsubs=[];
  if(BD && BD.rollT){ clearTimeout(BD.rollT); }
  BD=null;
}
function bdSets(){ return (DB.board||[]).slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)); }
function bdSet(id){ return (DB.board||[]).find(s=>s.id===id) || null; }
function bdClasses(set){
  if(!set) return [];
  if(!set.classIds || !set.classIds.length) return DB.classes.slice();
  return DB.classes.filter(c=> set.classIds.includes(c.id));
}
function bdClassNames(set){
  if(!set.classIds || !set.classIds.length) return '전체 학급';
  const l=bdClasses(set);
  return l.length ? l.map(c=>c.name).join(', ') : '배부된 학급 없음(지워진 학급)';
}

/* ---------- 말판 만들기 ---------- */
const BD_SPECIAL=[
  { t:'again', em:'🎲', name:'한 번 더!', msg:'와! 주사위를 <b>한 번 더</b> 굴려요 🎲' },
  { t:'rest',  em:'😴', name:'쉬어가기',  msg:'쿨쿨… <b>한 번 쉬어요</b> 😴' },
  { t:'jump',  em:'🚀', name:'앞으로',    msg:'슝! <b>앞으로</b> 더 나아가요 🚀' },
  { t:'back',  em:'🪃', name:'뒤로',      msg:'앗! <b>뒤로</b> 돌아가요 🪃' },
  { t:'lucky', em:'🍀', name:'행운 칸',   msg:'행운! <b>미션 없이 통과</b>예요 🍀' }
];
function bdSpecial(t){ return BD_SPECIAL.find(s=>s.t===t) || null; }
function bdShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 출발–도착 사이를 미션 칸과 재미 칸으로 채운다. 재미 칸이 연달아 나오지 않게 한다. */
function bdMakeTiles(items, size){
  const n=Math.max(12, Math.min(48, +size||30));
  const tiles=[{ t:'start', em:'🏁' }];
  let bag=[];
  const nextItem=()=>{ if(!bag.length) bag=bdShuffle(items.map((_,i)=>i)); return bag.pop(); };
  for(let i=1;i<n-1;i++){
    const prev=tiles[i-1];
    const canSpecial = prev.t!=='start' && !bdSpecial(prev.t);      /* 재미 칸은 붙여 놓지 않는다 */
    if(canSpecial && Math.random()<0.34){
      const s=BD_SPECIAL[Math.floor(Math.random()*BD_SPECIAL.length)];
      tiles.push({ t:s.t, em:s.em, d:(s.t==='jump'||s.t==='back') ? (2+Math.floor(Math.random()*2)) : 0 });
    } else {
      tiles.push({ t:'mission', i:nextItem() });
    }
  }
  tiles.push({ t:'goal', em:'🏆' });
  return tiles;
}
/* 모둠 한 칸에서 학생 id 목록 꺼내기.
   Firestore 는 '배열 안의 배열'을 저장하지 못해서 {ids:[...]} 로 감싸 둔다.
   메모리 모드에서 만들어진 옛 모양(그냥 배열)도 그대로 읽을 수 있게 한다. */
function grpIds(g){ return Array.isArray(g) ? g : ((g && g.ids) || []); }
function grpWrap(gs){ return gs.map(ids=> ({ ids })); }
/* 모둠 나누기 — 섞은 뒤 인원수대로 자르고, 마지막에 1명만 남으면 앞 모둠에 붙인다 */
function bdMakeGroups(students, per){
  const ids=bdShuffle(students.map(s=>s.id));
  const p=Math.max(2, Math.min(4, +per||2));
  const gs=[];
  for(let i=0;i<ids.length;i+=p) gs.push(ids.slice(i,i+p));
  if(gs.length>1 && gs[gs.length-1].length===1){ gs[gs.length-2]=gs[gs.length-2].concat(gs.pop()); }
  return gs;
}

/* ---------- 말판 그리기 (뱀처럼 지그재그로 이어진다) ---------- */
function bdBoardHTML(set, room, opt){
  opt=opt||{};
  const cols = opt.cols || (set.tiles.length>28 ? 6 : 5);
  const cells = set.tiles.map((t,i)=>{
    const row=Math.floor(i/cols);
    const col=(row%2===0) ? (i%cols) : (cols-1 - (i%cols));
    const here=(room? room.players.filter(p=>p.pos===i) : []);
    const toks=here.map(p=>`<span>${BD_TOKENS[room.players.indexOf(p)%BD_TOKENS.length]}</span>`).join('');
    const cur = room && room.players[room.turn] && room.players[room.turn].pos===i;
    let face='', word='';
    if(t.t==='mission'){ const it=set.items[t.i]||{}; face=(it.em||'📝'); word=esc(it.en||''); }
    else { const s=bdSpecial(t.t); face = t.em || (s? s.em : '·'); if(t.d) word=(t.t==='back'?'-':'+')+t.d; }
    return `<div class="bd-cell ${t.t}${cur?' here':''}" style="grid-row:${row+1}; grid-column:${col+1}"
        title="${t.t==='mission'? esc((set.items[t.i]||{}).en||'') : (bdSpecial(t.t)||{}).name||''}">
      <span class="no">${i===0?'출발':(i===set.tiles.length-1?'도착':i)}</span>
      <span>${face}</span>${word?`<span class="wd">${word}</span>`:''}
      ${toks?`<span class="bd-toks">${toks}</span>`:''}
    </div>`;
  }).join('');
  return `<div class="bd-board" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div>`;
}
function bdSeatsHTML(set, room){
  return room.players.map((p,i)=>`
    <div class="bd-seat ${i===room.turn?'on':''}">
      <span class="tk">${BD_TOKENS[i%BD_TOKENS.length]}</span>
      <span class="nm">${esc(p.name)}${p.sid===session.studentId?' (나)':''}</span>
      <span class="ps">${p.skip?'😴 쉬는 중 · ':''}${p.pos}칸 / ${set.tiles.length-1}</span>
    </div>`).join('');
}

async function bdDrawGroups(again){
  const set=bdSet(BD.setId), cls=DB.classes.find(c=>c.id===BD.cid);
  if(!set || !cls) return;
  if(cls.students.length<2){ toast('학생이 2명 이상이어야 모둠을 짤 수 있어요'); return; }
  if(again && !confirm('모둠을 다시 뽑을까요?\n진행 중인 게임은 처음부터 다시 시작됩니다.')) return;
  const btn=$('bdDraw')||$('bdReshuffle');
  if(btn){ btn.disabled=true; btn.textContent='🥁 뽑는 중…'; }
  bdUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); bdUnsubs=[];
  if(BD.sess) for(let g=0; g<BD.sess.groups.length; g++) await sDel(bdRKey(BD.setId, BD.cid, g));
  const groups=bdMakeGroups(cls.students, set.players);
  const rec={ setId:BD.setId, classId:BD.cid, ver:set.ver, groups:grpWrap(groups), at:Date.now(),
              shuffle:((BD.sess&&BD.sess.shuffle)||0)+1 };
  if(!await sSet(bdKey(BD.setId, BD.cid), rec)){
    if(btn){ btn.disabled=false; btn.textContent=again? '🔀 모둠 다시 뽑기' : '🎊 모둠 뽑기'; }
    return;
  }
  if(!BD || BD.role!=='teacher') return;
  BD.sess=rec; BD.rooms={};
  await groupReveal(groups, cls.students, { sub:`${cls.name} · ${set.title}`, tokens:BD_TOKENS });
  if(!BD || BD.role!=='teacher') return;
  bdTeacherDraw(); bdTeacherWatch();
}

async function bdJoin(setId){
  const set=bdSet(setId); if(!set) return;
  const cid=session.classId;
  const sess=await sGet(bdKey(setId,cid), null);
  if(!BD || BD.role!=='student') return;
  const g=(sess && sess.groups) ? sess.groups.findIndex(grp=> grpIds(grp).includes(session.studentId)) : -1;
  const wrap=$('bdWrap');
  if(g<0){
    if(wrap) wrap.outerHTML=`<div id="bdWrap" class="card empty"><span class="em">🙋</span>
      아직 모둠에 들어가지 못했어요.<br>선생님께 <b>모둠 다시 짜기</b>를 부탁해 주세요.
      <div class="center" style="margin-top:12px"><button class="btn ghost sm" onclick="boardStudent()">🔄 다시 확인</button></div></div>`;
    return;
  }
  BD.setId=setId; BD.g=g; BD.sess=sess;
  await bdEnsureRoom(set, cid, g, grpIds(sess.groups[g]));
  if(!BD || BD.role!=='student') return;
  if(fbReady && window.__store){
    const ref=keyRef(bdRKey(setId,cid,g));
    bdUnsubs.push(window.__store.watch(ref.col, ref.id, (v)=>{
      if(!BD || BD.role!=='student') return;
      if(v) BD.room=v;
      bdStudentDraw();
    }));
  }
  bdStudentDraw();
}
/* 방이 없으면 만든다 — 여러 명이 동시에 들어와도 하나만 남도록 트랜잭션을 쓴다 */
async function bdEnsureRoom(set, cid, g, ids){
  const cls=DB.classes.find(c=>c.id===cid);
  const mk=()=>({ setId:set.id, classId:cid, g, ver:set.ver, bdKey:set.id+'|'+cid,
    players: ids.map(sid=>{ const s=cls? cls.students.find(x=>x.id===sid) : null;
      return { sid, name:s? s.name : '친구', pos:0, skip:0 }; }),
    turn:0, phase:'roll', dice:0, from:0, tile:null, msg:'', winner:null, at:Date.now() });
  const key=bdRKey(set.id,cid,g), ref=keyRef(key);
  const resolve=(cur)=>{
    if(cur && cur.ver===set.ver && Array.isArray(cur.players) && cur.players.length===ids.length) return null;
    return mk();
  };
  if(fbReady && window.__store && window.__store.ensure){
    try{ const v=await window.__store.ensure(ref.col, ref.id, resolve); BD.room=v; return; }
    catch(e){ console.warn('bdEnsureRoom', e); }
  }
  const cur=await sGet(key, null);
  const next=resolve(cur);
  BD.room = next || cur;
  if(next) await sSet(key, next);
}
async function bdSave(room){
  room.at=Date.now();
  BD.room=room;
  bdStudentDraw();
  await sSet(bdRKey(room.setId, room.classId, room.g), room);
}
/* 다음 차례로 넘긴다 — 쉬는 칸에 걸린 친구는 한 번 건너뛴다 */
function bdNextTurn(room){
  const n=room.players.length;
  for(let k=1;k<=n;k++){
    const idx=(room.turn+k)%n, p=room.players[idx];
    if(p.skip>0){ p.skip--; continue; }
    room.turn=idx; return;
  }
  room.turn=(room.turn+1)%n;      /* 모두 쉬는 중이면 그냥 다음 사람 */
}

      <div style="font-family:'Andika'; font-size:1.7rem; margin:2px 0">${esc(it.en||'')}</div>
      ${it.ko?`<p class="muted" style="margin:0">${esc(it.ko)}</p>`:''}
      <div class="row" style="justify-content:center; margin-top:10px">

        : '친구가 말하는 걸 듣고 판정해 주세요!'}</p>
      ${!myTurn? `<div class="row" style="justify-content:center; margin-top:10px">
        <button class="btn" id="bdOK">👍 통과!</button>
        <button class="btn ghost" id="bdNO">👎 다시 (제자리로)</button></div>`:''}
      <p class="muted" style="margin:10px 0 0; font-size:.82rem">실패하면 원래 자리(${room.from}칸)로 돌아가요.</p>
    </div>`;
  } else {
    panel=`<div class="card center">
      <p class="muted" style="margin:0">${myTurn? '내 차례예요!' : esc(cur.name)+' 님의 차례'}</p>
      <div class="bd-dice ${BD.rolling?'rolling':''}" id="bdDice">${BD.rolling? '🎲' : (room.dice? '⚀⚁⚂⚃⚄⚅'[room.dice-1] : '🎲')}</div>
      ${room.msg? `<p style="margin:2px 0 8px">${room.msg}</p>`:''}
      ${myTurn? `<button class="btn lg coral" id="bdRoll" ${BD.rolling?'disabled':''}>🎲 주사위 굴리기</button>`
              : '<p class="muted" style="margin:6px 0 0">친구가 굴릴 때까지 기다려요 ⏳</p>'}
    </div>`;
  }

  wrap.outerHTML=`<div id="bdWrap">
    <div class="card">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
        <h2 style="margin:2px 0; flex:1">🎲 ${esc(set.title)}</h2>
        <span class="pill bingo">${BD.g+1}모둠</span>

  const ok=$('bdOK');  if(ok) ok.onclick=()=> bdMissionResult(true);

    const s=bdSet(BD.setId); const ids=grpIds(BD.sess.groups[BD.g]);

/* ---------- 주사위 ---------- */
function bdRoll(){
  const room=BD.room, set=bdSet(BD.setId);
  if(!room || room.winner || room.phase!=='roll') return;
  if(room.players[room.turn].sid!==session.studentId) return;
  BD.rolling=true; bdStudentDraw();
  BD.rollT=setTimeout(async ()=>{
    if(!BD || BD.role!=='student') return;
    BD.rolling=false;
    const d=1+Math.floor(Math.random()*6);
    const p=room.players[room.turn];
    const last=set.tiles.length-1;
    const from=p.pos;
    let pos=p.pos+d;
    room.dice=d; room.from=from; room.msg='';
    if(pos>=last){                                   /* 도착! */
      p.pos=last; room.winner=p.sid; room.phase='over';
      room.msg=`🎉 ${esc(p.name)} 님이 도착했어요!`;
      return bdSave(room);
    }
    p.pos=pos;
    const t=set.tiles[pos];
    if(t.t==='mission'){
      room.phase='mission'; room.tile=pos;
      room.msg=`${esc(p.name)} 님이 ${d}칸 이동! 미션 칸이에요 📝`;
      return bdSave(room);
    }
    const sp=bdSpecial(t.t);
    room.msg=`${d}칸 이동 — ${sp? sp.msg : ''}`;
    if(t.t==='again'){ room.phase='roll'; return bdSave(room); }        /* 차례를 넘기지 않는다 */
    if(t.t==='rest'){ p.skip=1; }
    if(t.t==='jump'){ p.pos=Math.min(last, pos+(t.d||2));
      if(p.pos>=last){ room.winner=p.sid; room.phase='over'; room.msg=`🎉 ${esc(p.name)} 님이 도착했어요!`; return bdSave(room); } }
    if(t.t==='back'){ p.pos=Math.max(0, pos-(t.d||2)); }
    room.phase='roll'; bdNextTurn(room);
    bdSave(room);
  }, 650);
  bdStudentDraw();
}
/* ---------- 미션 판정 ---------- */
function bdMissionResult(pass){
  const room=BD.room;
  if(!room || room.phase!=='mission') return;
  const p=room.players[room.turn];
  if(pass){ room.msg=`✅ ${esc(p.name)} 님 통과! 그 자리에 남아요.`; }
  else { p.pos=room.from; room.msg=`↩️ ${esc(p.name)} 님은 ${room.from}칸으로 돌아가요.`; }
  room.phase='roll'; room.tile=null;
  bdNextTurn(room);
  bdSave(room);
}
/* 마이크로 자동 판정 — 60점 이상이면 통과 (말하기 연습과 같은 채점) */
async function bdMicTry(){
  const room=BD.room, set=bdSet(BD.setId);
  if(!room || room.phase!=='mission') return;
  const t=set.tiles[room.tile]||{}, it=set.items[t.i]||{};
  const msg=$('bdMicMsg'), mic=$('bdMic');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ if(msg) msg.textContent='이 기기는 마이크 채점을 지원하지 않아요. 친구에게 판정을 부탁해요!'; return; }
  if(speakRec){ speakStop(); if(mic) mic.classList.remove('rec'); return; }
  const perm=await ensureMic();
  if(!perm.ok){ if(msg) msg.textContent='마이크 권한을 허용해 주세요 (친구가 판정해 줘도 돼요)'; return; }
  await new Promise(r=> setTimeout(r,120));
  const r=new SR(); speakRec=r; r.lang='en-US'; r.interimResults=false; r.maxAlternatives=4;
  if(mic) mic.classList.add('rec');
  if(msg) msg.textContent='듣고 있어요… 지금 말해보세요 🎙️';
  r.onresult=(e)=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    const {score, heard}=scoreSpeech(it.en||'', alts);
    if(!BD || BD.role!=='student') return;
    if(score>=60){ if(msg) msg.textContent=`잘했어요! (${score}점) 통과 ✅`; bdMissionResult(true); }
    else { if(msg) msg.textContent=`들린 말: ${heard||'(못 알아들었어요)'} · ${score}점 — 다시 한 번 말해볼까요?`; }
  };
  r.onerror=()=>{ if(msg) msg.textContent='잘 안 들렸어요. 다시 누르거나 친구에게 판정을 부탁해요'; if(mic) mic.classList.remove('rec'); speakRec=null; };
  r.onend=()=>{ if(mic) mic.classList.remove('rec'); if(speakRec===r) speakRec=null; };
  try{ r.start(); }catch(e){ if(msg) msg.textContent='마이크를 시작할 수 없어요'; if(mic) mic.classList.remove('rec'); speakRec=null; }
}


/* ============================ 밸런스 게임 (PPT 보고 번호 고르기) ============================
   문제는 선생님이 PPT로 보여 주고, 학생 태블릿에는 번호 버튼(①②③④)만 나온다.
   진행은 선생님이 잡는다 — 학생이 다 들어온 것을 보고 「시작」을 눌러야 1번 문제가 열리고,
   한 문제가 끝나면 「다음 문제」를 누를 때까지 학생 화면은 그대로 멈춰 있다.
   저장 위치
   · 진행 상태 : v1:bls:<세트>:<학급>  → eng_app  (선생님만 쓰기, 학생은 구독만)
   · 학생 답안 : v1:prog:bal:<세트>:<학급>:<학생> → eng_progress (학생 자기 것만 쓴다)
   기존 보안 규칙을 그대로 쓴다. 규칙 수정 불필요.
   소리는 선생님 기기 한 대만 낸다 — 태블릿마다 울리면 교실이 시끄럽다 (듣기 빙고와 같은 규칙). */
const blSKey = (setId,cid)=> `v1:bls:${setId}:${cid}`;
const blPKey = (setId,cid,sid)=> `v1:prog:bal:${setId}:${cid}:${sid}`;
const BL_NUM = ['①','②','③','④'];
const BL_FBS = { end:'마지막에 한꺼번에', now:'문제가 끝날 때마다' };
let BL=null;

function blLeave(){
  if(BL){
    (BL.unsubs||[]).forEach(u=>{ try{ u(); }catch(e){} });
    if(BL.t) clearTimeout(BL.t);
    if(BL.tick) clearInterval(BL.tick);
  }
  BL=null;
}
function blSets(){ return (DB.balance||[]).slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)); }
function blSet(id){ return (DB.balance||[]).find(s=>s.id===id) || null; }
function blClasses(set){
  if(!set) return [];
  if(!set.classIds || !set.classIds.length) return DB.classes.slice();
  return DB.classes.filter(c=> set.classIds.includes(c.id));
}
function blClassNames(set){
  if(!set.classIds || !set.classIds.length) return '전체 학급';
  const l=blClasses(set);
  return l.length ? l.map(c=>c.name).join(', ') : '배부된 학급 없음(지워진 학급)';
}
/* 정답표는 라운드 수만큼, 값은 1~보기 수 안에 있어야 한다 */
function blAnswers(set){
  const n=Math.max(1, set.rounds||1), k=Math.max(2, Math.min(4, set.choices||4));
  const a=(set.answers||[]).slice(0,n);
  while(a.length<n) a.push(1);
  return a.map(v=> (v>=1 && v<=k) ? v : 1);
}
function blKeyText(set){ return blAnswers(set).map(v=> BL_NUM[v-1]).join(''); }
function blScore(set, picks){ return blAnswers(set).filter((a,i)=> (picks||[])[i]===a).length; }

/* ---------- 번호판 (학생 화면 · 선생님 미리보기가 같은 모양을 쓴다) ---------- */
function blPadHTML(set, opts){
  const o=opts||{};
  const k=Math.max(2, Math.min(4, set.choices||4));
  const picks=o.picks||[], i=o.i||0, ans=blAnswers(set)[i];
  const pick=picks[i]||0;
  const lim=set.limit||0;
  const left=(o.left===undefined? lim : o.left);
  const strip=(set.rounds>1)
    ? `<div class="bl-strip">${[...Array(set.rounds).keys()].map(r=>
        `<span class="bl-chip ${r===i?'on':''} ${picks[r]?'did':''}">${r+1}</span>`).join('')}</div>`
    : '';
  /* ⏱ 남은 시간 — 10초 아래로 내려가면 숫자가 커지고 빨개진다 */
  const timer=lim? `<div class="bl-timer ${left<=10?'warn':''}" id="blTimer">
      <div class="bl-count" id="blCount">${left<=10? left : '⏱ '+left+'초'}</div>
      <div class="bl-tbar"><div id="blBar" style="width:${Math.round(left/lim*100)}%"></div></div>
    </div>` : '';
  const nums=[...Array(k).keys()].map(x=>{
    const v=x+1;
    const mark=[ o.showAns ? (v===ans? 'ok' : (v===pick? 'no':'')) : (v===pick? 'sel':''),
                 o.lock? 'lock':'' ].filter(Boolean).join(' ');
    return `<button class="bl-num ${mark}" data-bln="${v}" ${o.lock?'disabled':''}>${BL_NUM[x]}</button>`;
  }).join('');
  const foot = o.foot!==undefined ? o.foot
    : o.showAns ? (pick===ans? '정답이에요! 👍' : (pick? `아쉬워요. 정답은 ${BL_NUM[ans-1]}` : `정답은 ${BL_NUM[ans-1]}`))
    : pick ? `${BL_NUM[pick-1]} 을(를) 골랐어요${o.lock? '' : ' (바꿔도 돼요)'}`
    : '📺 화면을 보고 답을 골라요';
  return `${strip}${timer}
    <div class="bl-round">${i+1} <span class="muted" style="font-size:1rem">/ ${set.rounds}</span></div>
    <div class="bl-nums c${k}">${nums}</div>
    <div class="bg-foot ${o.showAns? (pick===ans?'hit':'miss') : ''}">${foot}</div>`;
}

/* ---------- 제한시간 (소리는 파일 없이 그 자리에서 만든다) ---------- */
function blTickSound(s){                 /* 10초부터 1초에 한 번 째깍 — 3초부터는 더 높고 크게 */
  const ctx=bgCtx(); if(!ctx) return;
  const t=ctx.currentTime+0.01;
  const f = s<=3 ? 1174.7 : (s<=5 ? 987.77 : 880);
  bgNote(ctx, f, t, 0.12, s<=3? 0.20:0.13, [['square',0.32],['triangle',0.55]]);
  if(s<=3) bgHat(ctx, t, 0.07);
}
function blTimeUpSound(){                /* 삐— 시간 끝 */
  const ctx=bgCtx(); if(!ctx) return;
  const t=ctx.currentTime+0.01;
  bgNote(ctx, 392.00, t,      0.22, 0.20, [['sawtooth',0.30],['triangle',0.5]]);
  bgNote(ctx, 293.66, t+0.20, 0.44, 0.20, [['sawtooth',0.30],['triangle',0.5]]);
}
function blGoSound(){                    /* 문제 시작 — 도미솔 */
  const ctx=bgCtx(); if(!ctx) return;
  const t=ctx.currentTime+0.01;
  [[523.25,0],[659.25,0.09],[783.99,0.18]].forEach(([f,d])=>
    bgNote(ctx, f, t+d, 0.3, 0.17, [['triangle',0.7],['sine',0.4]]));
}
function blTimerStop(){ if(BL && BL.tick){ clearInterval(BL.tick); BL.tick=0; } }
/* 시계는 각 기기가 스스로 잰다 — 선생님 기기와 시각이 달라도 어긋나지 않게 (듣기 빙고와 같은 방식) */
function blTimerStart(sec, onEnd, full){
  blTimerStop();
  if(!BL) return;
  const lim=sec||0;
  BL.lim=full||lim; BL.left=lim; BL.beeped=99; BL.shown=-1; BL.onEnd=onEnd||null;
  if(!lim){ BL.endAt=0; return; }
  BL.endAt=Date.now()+lim*1000;
  BL.tick=setInterval(blTimerStep, 100);
}
function blTimerStep(){
  if(!BL || !BL.endAt){ blTimerStop(); return; }
  const lim=BL.lim||1;
  const rem=(BL.endAt-Date.now())/1000;
  const s=Math.max(0, Math.ceil(rem));
  if(BL.sound && s<=10 && s>0 && s<BL.beeped){ BL.beeped=s; blTickSound(s); }
  BL.left=s;
  blTimerPaint(rem, lim);
  if(rem<=0){
    blTimerStop(); BL.endAt=0;
    if(BL.sound) blTimeUpSound();
    const f=BL.onEnd; BL.onEnd=null; if(f) f();
  }
}
/* 숫자와 막대만 고쳐 그린다 — 화면 전체를 다시 그리면 누르던 버튼이 튄다 */
function blTimerPaint(rem, lim){
  if(!BL) return;
  const s=BL.left;
  const box=$('blTimer'), c=$('blCount'), b=$('blBar');
  if(b) b.style.width=Math.max(0, Math.min(100, rem/lim*100))+'%';
  if(box) box.classList.toggle('warn', s<=10);
  if(c){
    c.textContent = s<=10 ? String(s) : ('⏱ '+s+'초');
    if(s<=10 && s!==BL.shown){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  }
  BL.shown=s;
}
